<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hub · Statistics</title>
<link rel="icon" href="hub-logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
:root{--blush:#f9f0f0;--red:#cc5f5f;--blue:#b8c9d9;--ink:#1a1a1a;--soft:#6b6b6b;--white:#fff;--line:#ecdede;--grey:#f6f2f2;--g:#3a7d4d;--rr:#cc5f5f;--amber:#e8b45f;
--c-earn:#4a7fb5;--c-net:#3a7d4d;--c-cost:#cc5f5f;--c-khaled:#7a9ac4;--c-sarah:#cf8f6f;--c-occ:#8fb0cc;
--ch-airbnb:#e0798a;--ch-booking:#4a7fb5;--ch-direct:#6f9a76;--ch-test:#b9a9c9}
*{box-sizing:border-box}
body{margin:0;background:#dcd0d0;font-family:'Cairo',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 0 40px}
.frame{max-width:900px;margin:16px auto;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 24px rgba(0,0,0,.10);overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;white-space:nowrap;flex:none}.brand .r{color:var(--red)}.brand .logo{width:26px;height:26px;border-radius:6px;flex:none}.brand .bs{font-weight:600;font-size:11.5px;color:var(--soft);border-left:1px solid var(--line);padding-left:7px}
.rib{font-size:10px;color:#4c4040;text-align:right;line-height:1.5}.rib b{color:#1a1a1a}
.body{padding:13px;background:var(--blush)}
.tabbar{display:flex;background:var(--white);border-top:1px solid var(--line)}
.tabbar .tab{flex:1;text-align:center;padding:7px 1px 8px;font-size:9.5px;color:var(--soft);text-decoration:none;font-weight:600;border-top:2px solid transparent}
.tabbar .tab .ti{display:block;font-size:16px;line-height:1.15;margin-bottom:1px}
.tabbar .tab.active{color:var(--red);border-top-color:var(--red)}
.scope{margin-bottom:10px}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;font-family:inherit;font-size:11px;font-weight:700;color:var(--soft);padding:4px 9px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--red);color:#fff}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:13px;font-weight:700}
.card h3 .rt{float:right;font-weight:400;color:var(--soft);font-size:11px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
svg{width:100%;height:auto;max-width:860px;display:block}
svg text{font-family:'Cairo',sans-serif}
.legend{font-size:10px;color:var(--soft);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
/* item 8 — the bookings behind a bar: a ledger grouped by flat, dates first, names given room */
.bdrill{margin-top:8px;border:1px solid var(--line,#ecdede);border-radius:10px;padding:8px 12px;background:#fbf7f7}
.bdrill h4{margin:0 0 6px;font-size:12.5px;display:flex;justify-content:space-between;align-items:baseline}
.bdrill h4 .x{cursor:pointer;color:var(--soft);font-weight:400;font-size:11px}
.bdrill table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.bdrill td{padding:3px 6px;border-bottom:1px solid #f0e6e6;text-align:right;white-space:nowrap}
.bdrill td.bdate{width:88px;text-align:left;color:var(--soft);font-size:10.5px}
.bdrill td.bguest{text-align:left;overflow:hidden;text-overflow:ellipsis}
.bdrill td:nth-child(3){width:64px}
.bdrill td.bval{width:86px;font-weight:600}
.bdrill .bname{unicode-bidi:isolate}
.bdrill .bnote{font-size:10px;color:var(--soft);font-weight:400}
.bdrill .bflat td{background:#f3eaea;font-weight:700;border-bottom:0;padding-top:6px}
.bdrill .btot td{font-weight:700;border-top:2px solid var(--line,#ecdede);border-bottom:0;padding-top:5px}
.bhit{cursor:pointer}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.csub{font-size:10.5px;color:var(--soft);margin-bottom:6px}
.note{font-size:10px;color:var(--soft);margin-top:5px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
.t th,.t td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.t th:first-child,.t td:first-child{text-align:left}
.t thead th{font-size:9.5px;color:var(--soft)}
.t td.neg{color:var(--rr)}
.muted{color:var(--soft);font-size:11px}
.err{background:#f6e3e3;border:1px solid #e6b9b9;border-radius:10px;padding:12px;font-size:13px}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="brand"><img class="logo" src="hub-logo.png" alt="The Hub"><span class="bn">The Hub</span><span class="bs">Statistics</span></div>
    <div class="rib" id="rib"></div>
  </div>
  <div class="body"><div id="app"><div class="card"><span class="muted">Loading…</span></div></div></div>
  <nav class="tabbar">
    <a class="tab" href="today.html"><span class="ti">🏠</span>Today</a>
    <a class="tab" href="week.html"><span class="ti">🗓️</span>Week</a>
    <a class="tab" href="repairs.html"><span class="ti">🔧</span>Repairs</a>
    <a class="tab" href="internet.html"><span class="ti">📶</span>Net</a>
    <a class="tab" href="close.html"><span class="ti">📑</span>Close</a>
    <a class="tab active" href="stats.html"><span class="ti">📊</span>Stats</a>
  </nav>
</div>

<script src="auth.js"></script>
<script>
/* CONFIG (ENDPOINT + session) lives in auth.js */

/* ---------- state ---------- */
var D=null, DAYMS=86400000, MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var scope='portfolio';
var R={rev:'12M',cost:'12M',attr:'12M',occ:'12M',nb:'12M',vol:'12M',chan:'12M',pay:'12M',adr:'6M',vc:'6M',rep:'12M',mar:'6M',uni:'12M',fx:'12M'};
var revSeries='earnings', costCat='all', costMonth='all', chanMode='nights', payMode='money', nbMode='nights';
/* item 8 (Sarah 2026-08-05, built 2026-08-08): tap a month on the revenue or nights chart → the
   bookings behind it. One open drill at a time; tapping the same month again closes it. */
var DRILL=null;
function statDrill(kind,m){ DRILL=(DRILL&&DRILL.kind===kind&&DRILL.m===m)?null:{kind:kind,m:m}; render(); }
/* booked/blocked/free are viewable alone (Sarah 2026-08-08): small stacked segments are hard to
   read even with hover, so each series is a toggle. At least one always stays on. */
var nbShow={booked:true,blocked:true,free:true};
function setNbShow(k){
  var on=Object.keys(nbShow).filter(function(x){return nbShow[x];});
  if(nbShow[k]&&on.length===1) return;                      // never an empty chart
  nbShow[k]=!nbShow[k]; render();
}
var adrMonth='all', vcMonth='all', repMonth='all', repMode='flat';
var marMonth='all', marBasis='var', uniUnit='sub', uniView='sum';   // margin table · per-unit trend chart
var revMode='total', dMode='prev', dOpen={};   // by-flat chart mode · What-changed comparison · expanded rows
var FLAT_COLORS={'8A':'#4a7fb5','17A':'#cc5f5f','17B':'#9aa7b5','28A':'#6f9a76','Zayed 2000':'#d9a441'};
/* §5.1 currency toggle (2026-08-04): ONE currency for the whole screen, chosen like the partner
   screens and shared with them via localStorage owh_cur. Every month converts at ITS OWN derived
   rate BEFORE summing (converting a multi-month total at one rate restates closed months). */
var CUR=(function(){ try{ return localStorage.getItem('owh_cur')||'USD'; }catch(e){ return 'USD'; } })();
function setCur(c){ CUR=c; try{ localStorage.setItem('owh_cur',c); }catch(e){} render(); }
var __rates={};
function rateFor(m){                       // EGP per USD, recovered from the month's own P&L figures
  if(__rates[m]) return __rates[m];
  var egp=0,usdc=0,rev=0,net=0;
  allFlats().forEach(function(f){ var p=pnlOf(f,m); if(!p)return; rev+=p.revenue.total; net+=p.net;
    (p.costs||[]).forEach(function(c){ if(c.currency==='USD')usdc+=c.amount; else egp+=c.amount; }); });
  var egpInUSD=(rev-net)-usdc;
  var r=(egp>0&&egpInUSD>0)?egp/egpInUSD:((D.meta.fx&&D.meta.fx.current)||49);
  return (__rates[m]=r);
}
function disp(usd,m){ return CUR==='USD'?usd:usd*rateFor(m); }         // convert per month, then sum
function curU(){ return CUR==='USD'?'$':''; }                          // chart unit prefix
var TRADES=[['سباك','plumbing','#4a7fb5'],['كهربائي','electric','#d9a441'],['فني تكييف','AC','#6f9a76'],['نجار','carpentry','#b58a5a'],['منجد','upholstery','#a97fb0'],['أخرى','other','#9aa7b5']];
function esc(s){ return (s||'').toString().replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function isLive(s){ var st=(s.status||'').toLowerCase(); return st.indexOf('cancel')<0 && st.indexOf('block')<0; }
function fmt(n){ n=+n||0; var a=Math.abs(n); return (n<0?'-':'')+(a>=1000?Math.round(a).toLocaleString('en-US'):String(Math.round(a*10)/10)); }
function kf(n){ n=+n||0; var a=Math.abs(n); return (n<0?'-':'')+(a>=1000?(a/1000).toFixed(a>=10000?0:1)+'k':String(Math.round(a))); }
/* 2 decimals: these are dollars, and small per-flat figures were rounding away to "0". `fmt` stays
   whole-number — it also formats nights and counts. */
function money(n){ n=+n||0; var dec=CUR==='USD'?2:0;   // EGP figures are big — decimals are noise (Sarah 2026-08-04)
  var s=(n<0?'-':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return CUR==='USD'?'$'+s:s+' EGP'; }
function fmt1(n){ return (Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }   // an FX rate, always 2dp
function day(s){ return new Date(String(s).slice(0,10)+'T00:00:00'); }
/* EVERY screen counts the same flats (Sarah 2026-08-05). "Portfolio" here used to mean "flats with
   an Airbnb target", which silently dropped 17B (long-let) — so Statistics disagreed with Close and
   with the what-changed table by 17B's entire revenue and net (32k EGP in May alone).
   MONEY now spans ALL flats. The only exceptions are metrics computed from per-booking data —
   ADR, channel mix, money-by-account — which a long-let has none of; including it there would
   divide real revenue by phantom bookings. Occupancy counts a long-let as FULLY OCCUPIED, which is
   what it actually is, so the portfolio figure stays truthful instead of being deflated by 31
   "vacant" nights a month. */
function allFlats(){ return D.meta.flatsOrder.filter(function(f){ return D.pnl[f]; }); }
function isLongLet(f){ var x=(D.flats||[]).filter(function(o){ return o.id===f; })[0]; return !!(x&&x.isLongLet); }
function airbnbFlats(){ return allFlats().filter(function(f){ return !isLongLet(f); }); }
function rawStays(){ return D.stays||[]; }
function scopeFlats(){ return scope==='portfolio'?allFlats():[scope]; }                          // money
function scopeStayFlats(){ return scopeFlats().filter(function(f){ return !isLongLet(f); }); }   // per-booking metrics
function monthOf(d){ return String(d).slice(0,7); }

function mergeStays(stays){
  var live=(stays||[]).filter(function(s){ return isLive(s)&&s.checkIn&&s.checkOut; }).slice().sort(function(a,b){ return a.flat<b.flat?-1:(a.flat>b.flat?1:(a.checkIn<b.checkIn?-1:1)); });
  var out=[], acc=null;
  live.forEach(function(s){ if(acc&&acc.flat===s.flat&&acc.guest===s.guest&&acc.checkOut===s.checkIn){ acc.checkOut=s.checkOut; acc.nights=Math.round((day(acc.checkOut)-day(acc.checkIn))/DAYMS); }
    else { if(acc)out.push(acc); acc={flat:s.flat,guest:s.guest,checkIn:s.checkIn,checkOut:s.checkOut,nights:s.nights}; } });
  if(acc)out.push(acc); return out;
}

/* ---------- months / ranges ---------- */
/* Future months with bookings SHOW (Sarah 2026-08-23: "any month with a booking already shows in
   stats") — but they are never anyone's "now": relative ranges (3M/6M/12M/YTD) and default
   analysis months anchor on the CALENDAR month, so December being open doesn't drag the lens. */
function allMonths(){ var set={}; Object.keys(D.pnl).forEach(function(f){ Object.keys(D.pnl[f]).forEach(function(m){ set[m]=1; }); });
  return Object.keys(set).sort(); }
function monthsPast_(){ var cm=D.meta.currentMonth; return allMonths().filter(function(m){ return !cm||m<=cm; }); }
function monthsInRange(rng){ var all=allMonths(), past=monthsPast_(), cm=D.meta.currentMonth;
  if(rng==='all') return all;
  if(rng==='YTD'){ var y=cm.slice(0,4); return past.filter(function(m){ return m.slice(0,4)===y; }); }
  var n=rng==='3M'?3:(rng==='6M'?6:12); return past.slice(-n); }
function daysIn(m){ var y=+m.slice(0,4),mo=+m.slice(5,7); return Math.round((new Date(y,mo,1)-new Date(y,mo-1,1))/DAYMS); }

/* ---------- pnl aggregation ---------- */
function pnlOf(f,m){ return (D.pnl[f]||{})[m]||null; }
function costsUSD(f,m){ var p=pnlOf(f,m); if(!p) return {total:0,by:{}};
  var totalUSD=(p.revenue?p.revenue.total:0)-(p.net||0), sumUSD=0,sumEGP=0;
  (p.costs||[]).forEach(function(c){ if(c.currency==='USD')sumUSD+=c.amount; else sumEGP+=c.amount; });
  var rate=sumEGP>0?(totalUSD-sumUSD)/sumEGP:0, by={};
  (p.costs||[]).forEach(function(c){ by[c.key]=(c.currency==='USD'?c.amount:c.amount*rate); });
  return {total:totalUSD, by:by}; }

/* ---------- occupancy / channel / account ---------- */
function overlapNights(s,m){ if(!s.checkIn||!s.checkOut)return 0; var y=+m.slice(0,4),mo=+m.slice(5,7),ms=new Date(y,mo-1,1),me=new Date(y,mo,1);
  var os=Math.max(day(s.checkIn),ms),oe=Math.min(day(s.checkOut),me); return Math.max(0,Math.round((oe-os)/DAYMS)); }
function earningsOf(s){ return (s.allIn||0)-(s.other||0); }
/* RULE C1 — a stay's revenue belongs to the months it was OCCUPIED, apportioned by nights, exactly
   as the sheet's Revenue-by-month tab does it (and as the partner screens already did).
   These charts used to credit a whole stay to its CHECK-OUT month, which empties every month a long
   stay spans and inflates the one it ends in: Iman's 3 Jun → 19 Jul stay put all $1,951 into July,
   so 17A's June read ZERO while the P&L correctly showed $1,187.70 (Sarah 2026-08-05). */
function earnedIn(s,m){ var n=s.nights||0; return n?earningsOf(s)*overlapNights(s,m)/n:0; }
function channelGroup(portal){ var p=portal||''; var a=(D.channelAliases||[]).filter(function(x){ return x.channel===p; })[0];
  if(a) return {group:a.group, inRev:a.inRevenue};
  var lp=p.toLowerCase(); return {group:(lp.indexOf('airbnb')>-1?'Airbnb':(lp.indexOf('book')>-1?'Booking.com':(lp.indexOf('direct')>-1?'Direct':(p||'?')))), inRev:true}; }
function accountOf(s){ if(s.payRoute && s.payRoute.toLowerCase()!=='split') return s.payRoute;
  var d=(D.paymentDefaults||[]).filter(function(x){ return x.flat===s.flat && x.channel===s.portal; })[0];
  return d?d.account:(channelGroup(s.portal).group==='Direct'?'(unconfirmed)':'HSBC'); }

/* ---------- fetch ---------- */
function boot(){ fetchOnce().then(onData).catch(function(){ setTimeout(function(){ fetchOnce().then(onData).catch(showErr); },800); }); }
function fetchOnce(){ return api('props_get_all').then(function(j){ if(!j||!j.ok)throw new Error(j&&j.error||'bad'); return j; }); }
function onData(j){ D=j.data; D.channelAliases=D.channelAliases||[]; D.paymentDefaults=D.paymentDefaults||[]; render();
  document.getElementById('rib').innerHTML='data <b>'+new Date().toTimeString().slice(0,5)+'</b>'; }
function showErr(e){ document.getElementById('app').innerHTML='<div class="err"><b>Couldn\'t load.</b> '+esc(e.message||e)+'</div>'; }

/* ---------- SVG primitives (responsive: fixed viewBox scales to width) ---------- */
var W=820, H=162, PAD=26, TOP=20, BOT=28;
function open_(){ return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMinYMid meet">'; }
function xlabels(months, gwCenter){
  var s=''; months.forEach(function(m,i){ var cx=gwCenter(i);
    s+='<text x="'+cx.toFixed(1)+'" y="'+(H-11)+'" font-size="8" fill="#6b6b6b" text-anchor="middle">'+MON[+m.slice(5,7)-1]+'</text>';
    if(i===0||m.slice(5,7)==='01') s+='<text x="'+cx.toFixed(1)+'" y="'+(H-2)+'" font-size="7.5" font-weight="700" fill="#333" text-anchor="middle">'+m.slice(0,4)+'</text>';
  }); return s;
}
/* NEGATIVES MUST LOOK NEGATIVE (Sarah 2026-08-05): these charts used to plot Math.abs(), so a
   LOSS drew an identical bar to a profit — August's −289 read as +289. Every money chart now maps
   values onto a real scale with a zero line, so a negative sits below it and is labelled with its
   sign. scaleOf returns that mapping; `zero` is the y of 0 and is only drawn when data goes below. */
/* item 8 — one transparent full-height hit band per month, laid UNDER the marks (Sarah 2026-08-08:
   bands on top swallowed the segments' native hover tooltips). Bars/points sit above and keep
   their <title>; when drilling is on, the marks themselves also carry the onclick, so tapping a
   bar or the space around it both work. */
function drillRects(months, cxFn, bandW, kind){
  if(!kind) return '';
  var s='';
  months.forEach(function(m,i){
    s+='<rect class="bhit" x="'+(cxFn(i)-bandW/2).toFixed(1)+'" y="0" width="'+bandW.toFixed(1)+'" height="'+H+'" '+
       'fill="'+(DRILL&&DRILL.kind===kind&&DRILL.m===m?'rgba(204,95,95,.09)':'transparent')+'" '+
       'onclick="statDrill(\''+kind+'\',\''+m+'\')"/>';
  });
  return s;
}
function drillOn(kind,m){ return kind?' style="cursor:pointer" onclick="statDrill(\''+kind+'\',\''+m+'\')"':''; }
function scaleOf(vals, plotH, baseY){
  var hi=Math.max.apply(null,[0].concat(vals)), lo=Math.min.apply(null,[0].concat(vals));
  var span=(hi-lo)||1;
  return { y:function(v){ return baseY - plotH*(v-lo)/span; }, zero:baseY - plotH*(0-lo)/span, hasNeg:lo<0 };
}
function zeroLine(sc){ return sc.hasNeg ? '<line x1="'+PAD+'" x2="'+(W-PAD)+'" y1="'+sc.zero.toFixed(1)+'" y2="'+sc.zero.toFixed(1)+'" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>' : ''; }
function lineChart(rows, opt){ opt=opt||{}; var col=opt.color||'var(--c-earn)', n=rows.length; if(!n) return '<div class="muted">No data.</div>';
  var plotH=H-TOP-BOT, baseY=H-BOT;
  var sc=scaleOf(rows.map(function(r){return r.value;}), plotH, baseY);
  var step=n>1?(W-2*PAD)/(n-1):0, cx=function(i){ return PAD+i*step; };
  var pts=rows.map(function(r,i){ return [cx(i), sc.y(r.value)]; });
  var d=pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var s=open_()+(opt.drill?drillRects(rows.map(function(r){return r.m;}), cx, step||W-2*PAD, opt.drill):'')+
        zeroLine(sc)+'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.2"/>';
  pts.forEach(function(p,i){ var v=rows[i].value, neg=v<0;
    s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.3" fill="'+(neg?'var(--red)':col)+'"><title>'+rows[i].m+': '+(opt.unit||'')+fmt(v)+'</title></circle>'+
    '<text x="'+p[0].toFixed(1)+'" y="'+(neg?(p[1]+10):(p[1]-5)).toFixed(1)+'" font-size="8" font-weight="700" fill="'+(neg?'var(--red)':'#333')+'" text-anchor="middle">'+(v<0?'-':'')+(opt.unit||'')+kf(Math.abs(v))+'</text>'; });
  s+=xlabels(rows.map(function(r){return r.m;}), cx);
  return s+'</svg>';
}
/* several lines on one chart (2026-08-04, the by-flat trend view) — rows: [{m, vals:{key:v}}] */
function lineMulti(rows, series, opt){ opt=opt||{}; var n=rows.length; if(!n) return '<div class="muted">No data.</div>';
  var max=1; rows.forEach(function(r){ series.forEach(function(se){ max=Math.max(max,Math.abs(r.vals[se.k]||0)); }); });
  var plotH=H-TOP-BOT, zeroY=H-BOT, step=n>1?(W-2*PAD)/(n-1):0, cx=function(i){ return PAD+i*step; };
  var s=open_()+(opt.drill?drillRects(rows.map(function(r){return r.m;}), cx, step||W-2*PAD, opt.drill):'');
  series.forEach(function(se){
    var pts=rows.map(function(r,i){ return [cx(i), zeroY-plotH*Math.abs(r.vals[se.k]||0)/max]; });
    var d=pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="1.9"/>';
    pts.forEach(function(p,i){ s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="1.8" fill="'+se.color+'"><title>'+esc(se.lbl||se.k)+' · '+rows[i].m+': '+fmt(rows[i].vals[se.k]||0)+'</title></circle>'+
      // value label per point, in the line's colour (Sarah 2026-08-04: unlabeled lines are unreadable)
      '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]-3.5).toFixed(1)+'" font-size="6.5" font-weight="700" fill="'+se.color+'" text-anchor="middle">'+kf(rows[i].vals[se.k]||0)+'</text>'; });

/* 0 · What changed — the diagnosis table (Sarah 2026-08-04). EVERY number reconciles:

function secDelta(){

  else if(dMB!=='prev'&&all.indexOf(dMB)>-1&&dMB!==mNow){ refMs=[dMB]; refLbl=MON[+dMB.slice(5,7)-1]+' '+dMB.slice(0,4); }
  else { refMs=[all[idx-1]]; refLbl=MON[+refMs[0].slice(5,7)-1]+' '+refMs[0].slice(0,4); }

  function agg(f,msArr){ var n=0,rev=0,net=0; msArr.forEach(function(m){ var p=pnlOf(f,m); if(!p)return; n++;
      rev+=disp(p.revenue.total,m); net+=disp(p.net,m); });

  var tot={f:'Portfolio', now:{rev:0,cost:0,net:0}, dRev:0, dCost:0, dNet:0};

        '<option value="prev"'+(dMB==='prev'?' selected':'')+'>previous month</option>'+

      curSeg()+'</div>'+
    '<table class="t"><thead><tr><th></th><th>Revenue</th><th>Δ</th><th>Costs</th><th>Δ</th><th>Net</th><th>Δ</th></tr></thead><tbody>';

function occLine(f,mNow,refMs){

/* item 8 — the bookings behind a tapped month. Reads the SAME basis the screens use everywhere:
   earnedIn (RULE C1 apportionment of earnings = accommodation only), so the list adds up to the
   month's earnings line, with long-term rent shown as its own row rather than absorbed. */
function bookingsCard(kind){
  if(!DRILL||DRILL.kind!==kind) return '';
  var m=DRILL.m, port=scope==='portfolio';
  var mlbl=MON[+m.slice(5,7)-1]+' '+m.slice(0,4);
  function dspan(s){                                  // 12/07 → 02/08, compact
    function dm(x){ return x?x.slice(8,10)+'/'+x.slice(5,7):''; }
    return dm(s.checkIn)+' → '+dm(s.checkOut);
  }
  var sum=0,nsum=0,count=0,body='';
  // grouped by flat, flats in house order, stays by check-in — a ledger, not a leaderboard
  scopeStayFlats().forEach(function(f){
    var list=rawStays().filter(function(s){ return s.flat===f&&isLive(s)&&overlapNights(s,m)>0; })
      .sort(function(a,z){ return (a.checkIn||'')<(z.checkIn||'')?-1:1; });
    if(!list.length)return;
    var fsum=0,fn=0,rows='';
    list.forEach(function(s){
      var nn=overlapNights(s,m), val=disp(earnedIn(s,m),m);
      fsum+=val; fn+=nn;
      rows+='<tr><td class="bdate">'+dspan(s)+'</td>'+
        '<td class="bguest"><bdi class="bname">'+esc(s.guest||s.id||'—')+'</bdi>'+
        '<span class="bnote"> · '+esc(s.portal||'')+'</span></td>'+
        '<td>'+nn+(s.nights&&s.nights!==nn?' <span class="bnote">of '+s.nights+'</span>':'')+'n</td>'+
        '<td class="bval">'+money(val)+'</td></tr>';
    });
    sum+=fsum; nsum+=fn; count+=list.length;
    body+=(port?'<tr class="bflat"><td colspan="2">'+esc(f)+'</td><td>'+fn+'n</td><td class="bval">'+money(fsum)+'</td></tr>':'')+rows;
  });
  var h='<div class="bdrill"><h4><span>Bookings · '+esc(mlbl)+(kind==='rev'?' <span class="bnote">earnings · '+CUR+'</span>':'')+'</span>'+
        '<span class="x" onclick="statDrill(\''+kind+'\',\''+DRILL.m+'\')">✕ close</span></h4>';
  if(!count) return h+'<div class="muted">no bookings touch this month</div></div>';
  h+='<table><tbody>'+body;
  if(kind==='rev'){
    var rent=0; scopeFlats().forEach(function(f){ if(!isLongLet(f))return; var p=pnlOf(f,m); if(p)rent+=disp(p.revenue.earnings,m); });
    if(rent>0.005){ sum+=rent; h+='<tr class="bflat"><td colspan="3">long-term rent · 17B</td><td class="bval">'+money(rent)+'</td></tr>'; }
    h+='<tr class="btot"><td colspan="2">'+count+' booking'+(count===1?'':'s')+(rent>0.005?' + rent':'')+' = the month\'s earnings</td><td>'+nsum+'n</td><td class="bval">'+money(sum)+'</td></tr>';
  } else {
    h+='<tr class="btot"><td colspan="2">'+count+' booking'+(count===1?'':'s')+'</td><td>'+nsum+'n</td><td class="bval">'+money(sum)+'</td></tr>';
    h+='<tr><td colspan="4" class="bnote">the bar also counts long-let, blocked and free nights — none of those has a booking to list</td></tr>';
  }
  return h+'</tbody></table></div>';
}

/* 2 · What the money goes on — stacked per-month, category + month buttons + time */
var COST_ORDER=[['rent','rent','#e0a5a5'],['cleaning','cleaning','#b8c9d9'],['supplies','supplies','#8ab48f'],['electricity','electricity','#d9a441'],['maintenance','maintenance','#c77b7b'],['compound-maintenance','compound maint.','#a05f5f'],['tv-phone-internet','internet','#9c86c4'],['laundry','laundry','#c98f8f'],['contingency','contingency','#b0a08e'],['opsmanager','opsMgr','#7d9c9c'],['water','water','#7fb2c9'],['heat-gas','heat/gas','#caa06a'],['subscription','subscription','#9aa7b5']];

/* 4 · Occupancy & ADR combined */
function secOccAdr(){
  var ms=monthsInRange(R.occ);
  // a long-let is occupied every night of the month — counting it as vacant would deflate the portfolio
  var occ=ms.map(function(m){ var o=0,a=0; scopeFlats().forEach(function(f){ a+=daysIn(m);
    if(isLongLet(f)){ o+=daysIn(m); return; }
    rawStays().forEach(function(s){ if(s.flat===f&&isLive(s))o+=overlapNights(s,m); }); }); return {m:m,value:a>0?o/a*100:0}; });
  // ADR is a per-booking rate — a long-let has no bookings, so it is not part of this average
  var adr=ms.map(function(m){ var e=0,n=0; scopeStayFlats().forEach(function(f){ rawStays().forEach(function(s){ if(s.flat!==f||!isLive(s))return;
    e+=earnedIn(s,m); n+=overlapNights(s,m); }); }); return {m:m,value:disp(n>0?e/n:0,m)}; });
  return '<div class="card"><h3>Occupancy &amp; ADR</h3><div class="csub">bars = ADR (earned in the month ÷ nights occupied in it, '+CUR+', Airbnb flats only — a long-let has no per-night rate) · line = occupancy % (a long-let counts as fully occupied)</div>'+
    '<div class="rowbtns">'+scopeSeg()+curSeg()+'</div><div class="rowbtns">'+timeSeg('occ')+'</div>'+occAdrChart(occ,adr)+
    '<div class="legend"><span><i style="background:var(--c-occ)"></i>ADR '+CUR+'</span><span><i style="background:var(--red)"></i>Occupancy %</span></div></div>';
}
/* 4b · Booked / blocked / free nights — with a value toggle (Sarah's request 2026-07-24, built
   2026-08-04). Per-day truth so multi-channel blocks can't double-count and a block overlapping a
   live stay counts as BOOKED (it's mostly Smoobu's own turnover block): a night is booked if a
   live stay covers it, else blocked if a block covers it, else free. Value mode: booked = that
   month's actual earnings; blocked & free = nights × that month's ADR (the opportunity cost). */
function secNights(){
  var ms=monthsInRange(R.nb);
  var rows=ms.map(function(m){
    var b=0,bl=0,fr=0,earn=0,nn=0, y=+m.slice(0,4),mo=+m.slice(5,7),dim=daysIn(m);
    scopeFlats().forEach(function(f){
      if(isLongLet(f)){ b+=dim; earn+=0; return; }        // let: every night is booked, no per-night rate
      for(var dd=1;dd<=dim;dd++){
        var dt=new Date(y,mo-1,dd), occ=false,blk=false;
        (D.stays||[]).forEach(function(s){
          if(s.flat!==f||!s.checkIn||!s.checkOut)return;
          var st=(s.status||'').toLowerCase(); if(st.indexOf('cancel')>-1)return;
          if(!(day(s.checkIn)<=dt&&dt<day(s.checkOut)))return;
          if(st.indexOf('block')>-1)blk=true; else occ=true;
        });
        if(occ)b++; else if(blk)bl++; else fr++;
      }
      rawStays().forEach(function(s){ if(s.flat!==f||!isLive(s))return; earn+=earnedIn(s,m); nn+=overlapNights(s,m); });
    });
    if(nbMode==='nights') return {m:m,vals:{booked:b,blocked:bl,free:fr}};
    var adr=nn>0?earn/nn:0;
    return {m:m,vals:{booked:disp(earn,m),blocked:disp(bl*adr,m),free:disp(fr*adr,m)}};
  });
  var NBall=[{k:'booked',lbl:'booked',color:'var(--g)'},{k:'blocked',lbl:'blocked',color:'#b58a5a'},{k:'free',lbl:'free',color:'#d9c7c7'}];
  var NB=NBall.filter(function(se){return nbShow[se.k];});
  // the series toggles double as the legend — colour chip + name, dimmed when off
  var chips='<div class="seg">'+NBall.map(function(se){
    return '<button class="'+(nbShow[se.k]?'on':'')+'" onclick="setNbShow(\''+se.k+'\')" style="'+(nbShow[se.k]?'background:'+se.color+';color:#fff;':'')+'">'+se.lbl+'</button>'; }).join('')+'</div>';
  return '<div class="card"><h3>Booked · blocked · free nights<span class="rt">'+(nbMode==='nights'?'nights':'value '+CUR+' — free/blocked at that month\'s ADR')+'</span></h3>'+
    '<div class="rowbtns">'+scopeSeg()+curSeg()+'</div>'+
    '<div class="rowbtns">'+seg([['nights','Nights'],['value','Value']],nbMode,'setNb')+chips+timeSeg('nb')+'</div>'+
    stackedChart(rows,NB,{unit:nbMode==='value'?curU():'',drill:'stays'})+
    bookingsCard('stays')+'</div>';
}
/* 5 · Nights · stays · dry-clean submissions (grouped) */
// dry-clean submissions = count of per-submission "laundry" rows in Cost line items (the same rows that drive
// laundry cost + supplies allocation). One row per drop-off, so the count IS the submission count.
function dcCount(f,m){ var n=0; (D.tx||[]).forEach(function(t){ if(t.flat===f&&t.ym===m&&/laundry/i.test(t.cat))n++; }); return n; }
function secVolumes(){

  return '<div class="card"><h3>Stays · dry-clean submissions<span class="rt">stays = merged, counted at check-out · '+dcTot+' submissions</span></h3>'+

/* 6 · Channel mix — nights / revenue toggle, stacked per-month */
function chColor(g){ return g==='Airbnb'?'var(--ch-airbnb)':g==='Booking.com'?'var(--ch-booking)':g==='Direct'?'var(--ch-direct)':g==='Test'?'var(--ch-test)':'var(--soft)'; }

/* 7 · Money by account — revenue / nights / net-profit toggle, stacked per-month.
   NET (Sarah 2026-08-28): money IN lands per account, and ALL money OUT leaves from Instapay —
   so net mode shows each account's revenue while Instapay additionally bears every cost of the
   scoped flats. The stacked chart already draws negatives below the axis, so a heavy-cost month
   shows Instapay diving under zero and the bar's total label IS the net profit — the columns sum
   to revenue − costs by construction (tables must reconcile). */
function secPay(){
  var ms=monthsInRange(R.pay);
  var accSet={}; scopeStayFlats().forEach(function(f){ rawStays().forEach(function(s){ if(s.flat!==f||!isLive(s))return; if(!channelGroup(s.portal).inRev)return; accSet[accountOf(s)]=1; }); });

  var accs=Object.keys(accSet);

    if(payMode==='nights'){ vals[accountOf(s)]+=overlapNights(s,m); } else { vals[accountOf(s)]+=disp(earnedIn(s,m),m); } }); });
    if(payMode==='net'){ var mOut=0; scopeStayFlats().forEach(function(f){ mOut+=disp(costsUSD(f,m).total,m); }); vals['Instapay']=(vals['Instapay']||0)-mOut; }
    return {m:m,vals:vals}; });
  return '<div class="card"><h3>Money by account<span class="rt">'+(payMode==='money'?'revenue '+CUR:(payMode==='net'?'net profit '+CUR:'nights'))+' by account · Test excluded</span></h3>'+

    '<div class="rowbtns">'+seg([['money','Revenue'],['nights','Nights'],['net','Net profit']],payMode,'setPay')+timeSeg('pay')+'</div>'+
    stackedChart(rows,accs.map(function(a){return {k:a,color:PC[a]||'#9aa7b5'};}),{unit:payMode==='nights'?'':curU()})+
    '<div class="legend">'+accs.map(function(a){return '<span><i style="background:'+(PC[a]||'#9aa7b5')+'"></i>'+esc(a)+'</span>';}).join('')+'</div>'+
    (payMode==='net'?'<div class="legend">net = each account\'s money in · ALL money out (the scoped flats\' costs) leaves from Instapay — the bar total is the month\'s net profit</div>':'')+'</div>';
}
/* 8 · ADR per channel per flat (table) */
function secAdrTable(){
  var ms=pickMonths(R.adr,adrMonth), chans=['Airbnb','Booking.com','Direct'];
  var h='<div class="card"><h3>ADR per channel, per flat<span class="rt">'+CUR+(adrMonth!=='all'?' · '+MON[+adrMonth.slice(5,7)-1]+' '+adrMonth.slice(0,4):'')+'</span></h3>'+
    '<div class="rowbtns">'+scopeSeg()+curSeg()+'</div>'+
    '<div class="rowbtns">'+monthBtnsFor(monthsInRange(R.adr),adrMonth,'setAdrMonth')+timeSeg('adr')+'</div>'+
    '<table class="t"><thead><tr><th>Flat</th>'+chans.map(function(c){return '<th>'+c+'</th>';}).join('')+'<th>All</th><th>Spread</th></tr></thead><tbody>';
  var gE={},gN={},gTE=0,gTN=0;
  // per RULE C1: a stay counts in each month of the range by the nights it occupied there, so a stay
  // straddling the range edge contributes only its inside part instead of all-or-nothing
  scopeStayFlats().forEach(function(f){ var e={},n={},tE=0,tN=0; rawStays().forEach(function(s){ if(s.flat!==f||!isLive(s))return;
    var g=channelGroup(s.portal).group, ev=0, nv=0;
    ms.forEach(function(mm){ ev+=disp(earnedIn(s,mm),mm); nv+=overlapNights(s,mm); });
    if(!nv&&!ev)return;
    e[g]=(e[g]||0)+ev; n[g]=(n[g]||0)+nv; tE+=ev; tN+=nv;
    gE[g]=(gE[g]||0)+ev; gN[g]=(gN[g]||0)+nv; gTE+=ev; gTN+=nv; });
    var adr={},vals=[]; chans.forEach(function(c){ var a=n[c]>0?e[c]/n[c]:0; adr[c]=a; if(a>0)vals.push(a); });
    var spread=vals.length>1?Math.round((Math.min.apply(null,vals)-Math.max.apply(null,vals))/Math.max.apply(null,vals)*100):0;
    h+='<tr><td>'+esc(f)+'</td>'+chans.map(function(c){return '<td>'+(adr[c]?fmt(adr[c]):'—')+'</td>';}).join('')+
       '<td style="font-weight:700">'+(tN>0?fmt(tE/tN):'—')+'</td><td class="'+(spread<0?'neg':'')+'">'+(vals.length>1?spread+'%':'—')+'</td></tr>'; });
  // all-flats row — nights-weighted blend, so it reconciles with the rows above
  h+='<tr style="font-weight:800"><td>All flats</td>'+chans.map(function(c){return '<td>'+(gN[c]>0?fmt(gE[c]/gN[c]):'—')+'</td>';}).join('')+
     '<td>'+(gTN>0?fmt(gTE/gTN):'—')+'</td><td>—</td></tr>';
  return h+'</tbody></table><div class="note">Earnings and nights are apportioned to the months in range (RULE C1), so a stay crossing the edge counts only its part inside. All = the flat\'s blended ADR across every channel (earnings ÷ nights — nights-weighted, not a simple average). Spread = (weakest − strongest) ÷ strongest: −20% means the weakest channel earns 20% less per night than the strongest.</div></div>';
}
/* 9 · Turnover economics — per DRY-CLEAN SUBMISSION (Sarah's request 2026-07-24, built 2026-08-04):
   a 46-night stay with weekly cleans produces several submissions but only one checkout, so
   per-stay understated the real turnover rhythm. Submissions counted from the per-submission
   laundry rows already mirrored into the P&L (dcCount — same source as the volumes chart). */
/* 9a · Margin per unit (Sarah 2026-08-14) — replaces "Turnover economics", which showed only what a
   turnover COST. The unit is unchanged (a dry-clean submission = one turnover · an occupied night),
   but each unit now carries what it earned, what it cost and what it left:
       Margin/sub   = Revenue/sub   − Cost/sub
       Margin/night = Revenue/night − Cost/night
   Revenue = the month's TOTAL (nightly earnings + other revenue), so a flat's row ties to the P&L.
   COST BASIS is a toggle, because "margin" honestly means two different things:
     · Variable  — the same costs as the table below, so the two tables reconcile column for column.
                   Margin here is CONTRIBUTION: what a turnover leaves before the standing costs.
     · All costs — everything the P&L charges the flat (rent, subscription, ops manager, repairs,
                   contingency …), so Portfolio Margin × units ties back to Net.
   Nights = occupied nights in the range, the same divisor the cost table uses. */
function marCols(){ return marBasis==='all'
  ? {lbl:'all costs', note:'every cost the P&L charges the flat'}
  : {lbl:'variable',  note:'the variable costs from the table below'}; }
function unitCostUSD(f,m){                       // one flat-month's cost on the chosen basis, in USD
  var c=costsUSD(f,m);
  if(marBasis==='all') return c.total;
  var t=0; VC_COLS.forEach(function(col){ col.keys.forEach(function(k){ t+=(c.by[k]||0); }); });
  return t;
}
function secMargin(){
  var ms=pickMonths(R.mar,marMonth), merged=mergeStays(rawStays()), basis=marCols();
  var h='<div class="card"><h3>Margin per unit<span class="rt">per dry-clean submission · per occupied night'+(marMonth!=='all'?' · '+MON[+marMonth.slice(5,7)-1]+' '+marMonth.slice(0,4):'')+'</span></h3>'+
    '<div class="rowbtns">'+scopeSeg()+curSeg()+'</div>'+
    '<div class="rowbtns">'+monthBtnsFor(monthsInRange(R.mar),marMonth,'setMarMonth')+timeSeg('mar')+
      seg([['var','Variable cost'],['all','All costs']],marBasis,'setMarBasis')+'</div>'+
    '<div style="overflow-x:auto"><table class="t" style="min-width:780px"><thead><tr><th>Flat</th><th>Stays</th><th>Subs</th><th>Nights</th>'+
      '<th>Revenue/sub</th><th>Cost/sub</th><th>Margin/sub</th>'+
      '<th>Revenue/night</th><th>Cost/night</th><th>Margin/night</th></tr></thead><tbody>';
  function cells(rev,cost,subs,nights){
    var mg=rev-cost;
    function trio(d){ return d>0
      ? '<td>'+money(rev/d)+'</td><td>'+money(cost/d)+'</td><td style="font-weight:700'+(mg<0?';color:var(--red)':'')+'">'+money(mg/d)+'</td>'
      : '<td>—</td><td>—</td><td>—</td>'; }
    return trio(subs)+trio(nights);
  }
  var T={nS:0,subs:0,nights:0,rev:0,cost:0};
  scopeFlats().forEach(function(f){
    var stays=merged.filter(function(s){ return s.flat===f&&monthOf(s.checkOut)>=ms[0]&&monthOf(s.checkOut)<=ms[ms.length-1]; });
    var nS=stays.length, subs=0, nights=0, rev=0, cost=0;
    ms.forEach(function(m){
      var p=pnlOf(f,m);
      if(p){ rev+=disp(p.revenue.total,m); cost+=disp(unitCostUSD(f,m),m); }
      subs+=dcCount(f,m);
      rawStays().forEach(function(s){ if(s.flat===f&&isLive(s))nights+=overlapNights(s,m); });
    });
    T.nS+=nS; T.subs+=subs; T.nights+=nights; T.rev+=rev; T.cost+=cost;
    h+='<tr><td>'+esc(f)+'</td><td>'+(nS||'—')+'</td><td>'+(subs||'—')+'</td><td>'+(nights||'—')+'</td>'+cells(rev,cost,subs,nights)+'</tr>';
  });
  h+='<tr style="font-weight:800"><td>Portfolio</td><td>'+(T.nS||'—')+'</td><td>'+(T.subs||'—')+'</td><td>'+(T.nights||'—')+'</td>'+
     cells(T.rev,T.cost,T.subs,T.nights)+'</tr>';
  return h+'</tbody></table></div><div class="note">A submission = one dry-clean drop-off (mid-stay cleans included) — the real turnover unit. <b>Revenue</b> = the month\'s total (nightly earnings + other revenue). <b>Cost</b> = '+basis.note+'. <b>Margin = Revenue − Cost</b> on the same divisor, so each trio adds across. <b>Nights</b> = occupied nights in the range, so a month inside a long stay shows its true nightly figures. Portfolio row = the same maths over all flats\' sums.'+
    (marBasis==='var'?' On this basis margin is a <b>contribution</b>: rent, subscriptions, ops manager, repairs and contingency are not deducted — switch to All costs for the figure that ties to Net.':' On this basis Margin × units ties back to the P&L Net.')+'</div></div>';
}

/* 9c · Per-unit economics over time (Sarah 2026-08-14) — the tables answer "what does a unit earn
   and cost"; this answers "and how is that moving". Same unit, months side by side: every series is
   a RATE (÷ subs or ÷ occupied nights), never a total, so a big month and a small one compare
   honestly. Cost detail breaks out the same six categories as the cost table. */
var UNI_SER={
  sum:[ {k:'rev',lbl:'Revenue',color:'#4a7fb5'},{k:'cost',lbl:'Cost',color:'#cc5f5f'},{k:'mar',lbl:'Margin',color:'#3a7d4d'} ],
  cost:[{k:'laundry',lbl:'Laundry',color:'#4a7fb5'},{k:'cleaning',lbl:'Cleaning',color:'#cc5f5f'},
        {k:'elec',lbl:'Electricity',color:'#d9a441'},{k:'supplies',lbl:'Supplies',color:'#6f9a76'},
        {k:'net',lbl:'Net & phone',color:'#a97fb0'},{k:'util',lbl:'Utilities',color:'#9aa7b5'},
        {k:'cost',lbl:'Total',color:'#1a1a1a'}]
};
function uniRows(ms){
  return ms.map(function(m){
    var subs=0, nights=0, rev=0, cost=0, by={}; VC_COLS.forEach(function(c){ by[c.k]=0; });
    scopeFlats().forEach(function(f){
      var p=pnlOf(f,m);
      if(p){ rev+=disp(p.revenue.total,m); cost+=disp(unitCostUSD(f,m),m);
             var c=costsUSD(f,m);
             VC_COLS.forEach(function(col){ col.keys.forEach(function(k){ by[col.k]+=disp(c.by[k]||0,m); }); }); }
      subs+=dcCount(f,m);
      rawStays().forEach(function(s){ if(s.flat===f&&isLive(s))nights+=overlapNights(s,m); });
    });
    var d=(uniUnit==='sub'?subs:nights), vals={};
    vals.rev=d>0?rev/d:0; vals.cost=d>0?cost/d:0; vals.mar=vals.rev-vals.cost;
    VC_COLS.forEach(function(c){ vals[c.k]=d>0?by[c.k]/d:0; });
    return { m:m, vals:vals, d:d };
  });
}
function secUnitTrend(){
  var ms=monthsInRange(R.uni), rows=uniRows(ms), ser=UNI_SER[uniView], basis=marCols();
  var unitLbl=(uniUnit==='sub'?'per submission':'per occupied night');
  var h='<div class="card"><h3>Per-unit economics over time<span class="rt">'+unitLbl+' · '+basis.lbl+' cost</span></h3>'+
    '<div class="rowbtns">'+scopeSeg()+curSeg()+'</div>'+
    '<div class="rowbtns">'+seg([['sub','Per submission'],['night','Per night']],uniUnit,'setUniUnit')+
      seg([['sum','Revenue · cost · margin'],['cost','Cost detail']],uniView,'setUniView')+
      seg([['var','Variable cost'],['all','All costs']],marBasis,'setMarBasis')+timeSeg('uni')+'</div>'+
    lineSigned(rows, ser, {unit:curU()});
  h+='<div class="legend">'+ser.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+esc(s.lbl)+'</span>'; }).join('')+'</div>';
  var thin=rows.filter(function(r){ return !r.d; }).map(function(r){ return r.m; });
  return h+'<div class="note">Every line is a rate, '+unitLbl+' — the divisor is that month\'s '+(uniUnit==='sub'?'dry-clean submissions':'occupied nights')+', so months compare like for like. Cost basis follows the Margin per unit table above ('+basis.note+'); Margin = Revenue − Cost at every point.'+
    (thin.length?' <b>'+thin.join(', ')+'</b> had no '+(uniUnit==='sub'?'submissions':'occupied nights')+' and plot at zero.':'')+'</div></div>';
}

/* 9d · FX impact on margin (Sarah 2026-08-14: "it has been quite volatile lately, so i need to see
   the impact on profitability"). Revenue is earned in USD and almost every cost is spent in EGP, so
   the rate moves margin on its own — with nothing changing in the business.
   TWO readings, because they answer different questions:
     · vs a constant rate — every month restated at ONE reference rate (the latest month in range),
       so "margin as reported" minus "margin at that rate" IS the cumulative FX effect.
     · month-over-month bridge — the change in margin split into what OPERATIONS did and what the
       RATE did. The split is exact, not an estimate: operating change is measured at last month's
       rate, and the rate change is applied to this month's spend, so the two always sum to Δ.
   In EGP the exposure is the mirror image (USD income restated at a moving rate), so the same two
   readings are computed against the currency on screen. */
function fxRows(ms){
  return ms.map(function(m){
    var usdNat=0, egpNat=0, rev=0;
    scopeFlats().forEach(function(f){
      var p=pnlOf(f,m); if(!p) return;
      rev+=p.revenue.total;                                    // USD-native
      (p.costs||[]).forEach(function(c){ if(c.currency==='USD') usdNat+=c.amount; else egpNat+=c.amount; });
    });
    // N = the USD-native flow (revenue less USD-priced costs) · E = the EGP-native spend
    return { m:m, r:rateFor(m), N:rev-usdNat, E:egpNat, rev:rev };
  });
}
function secFx(){
  var ms=monthsInRange(R.fx), rows=fxRows(ms);
  if(!rows.length) return '';
  var R0=rows[rows.length-1].r, refM=rows[rows.length-1].m;
  var usd=(CUR==='USD');
  function marginAt(row,rate){ return usd ? (row.N - row.E/rate) : (row.N*rate - row.E); }
  var h='<div class="card"><h3>FX impact on margin<span class="rt">'+(usd?'USD':'EGP')+' · reference '+fmt1(R0)+' ('+MON[+refM.slice(5,7)-1]+' '+refM.slice(0,4)+')</span></h3>'+
    '<div class="rowbtns">'+scopeSeg()+curSeg()+timeSeg('fx')+'</div>'+
    '<div style="overflow-x:auto"><table class="t" style="min-width:760px"><thead><tr><th>Month</th><th>Rate</th>'+
      '<th>Margin</th><th>At '+fmt1(R0)+'</th><th>FX effect</th><th>Δ vs prev</th><th>· operating</th><th>· FX</th></tr></thead><tbody>';
  var TF=0, TO=0, TD=0;
  rows.forEach(function(r,i){
    var mAct=marginAt(r,r.r), mRef=marginAt(r,R0);
    var fxEff=mAct-mRef;
    var d=null, op=null, fx=null;
    if(i){ var q=rows[i-1];
      d=mAct-marginAt(q,q.r);
      op = usd ? ((r.N-q.N) - (r.E-q.E)/q.r) : ((r.N-q.N)*q.r - (r.E-q.E));
      fx = usd ? (-r.E*(1/r.r - 1/q.r))      : ( r.N*(r.r-q.r));
      TD+=d; TO+=op; TF+=fx;
    }
    var neg=function(v){ return v<0?' style="color:var(--red)"':''; };
    h+='<tr><td>'+MON[+r.m.slice(5,7)-1]+' '+r.m.slice(2,4)+'</td><td>'+fmt1(r.r)+'</td>'+
       '<td'+neg(mAct)+'>'+money(mAct)+'</td><td>'+money(mRef)+'</td>'+
       '<td'+neg(fxEff)+'>'+(fxEff>0?'+':'')+money(fxEff)+'</td>'+
       (d==null?'<td>—</td><td>—</td><td>—</td>'
              :'<td'+neg(d)+'>'+(d>0?'+':'')+money(d)+'</td><td'+neg(op)+'>'+(op>0?'+':'')+money(op)+'</td><td'+neg(fx)+'>'+(fx>0?'+':'')+money(fx)+'</td>')+'</tr>';
  });
  h+='<tr style="font-weight:800"><td>Total</td><td>—</td><td>—</td><td>—</td><td>—</td><td>'+(TD>0?'+':'')+money(TD)+'</td><td>'+(TO>0?'+':'')+money(TO)+'</td><td>'+(TF>0?'+':'')+money(TF)+'</td></tr>';
  h+='</tbody></table></div>';
  // the bridge, drawn: what operations did vs what the pound did, month by month
  var brows=rows.slice(1).map(function(r,i){ var q=rows[i];
    return { m:r.m, vals:{ op: usd?((r.N-q.N)-(r.E-q.E)/q.r):((r.N-q.N)*q.r-(r.E-q.E)),
                           fx: usd?(-r.E*(1/r.r-1/q.r)):(r.N*(r.r-q.r)) } }; });
  if(brows.length) h+=groupedChart(brows,[{k:'op',lbl:'Operating',color:'#4a7fb5'},{k:'fx',lbl:'FX',color:'#d9a441'}])+
    '<div class="legend"><span><i style="background:#4a7fb5"></i>Operating</span><span><i style="background:#d9a441"></i>FX</span></div>';
  return h+'<div class="note"><b>Margin</b> here is revenue less <i>every</i> cost — the P&amp;L\'s Net for the flats in scope. <b>At '+fmt1(R0)+'</b> restates the month at '+MON[+refM.slice(5,7)-1]+' '+refM.slice(0,4)+'\'s rate, so <b>FX effect</b> is what the pound alone did to that month: '+
    (usd?'in USD you are long EGP costs, so a <b>weaker</b> pound (a higher rate) makes them cheaper and margin higher.'
        :'in EGP you are long USD income, so a <b>weaker</b> pound (a higher rate) makes that income worth more and margin higher.')+
    ' <b>Δ vs prev</b> splits each month\'s move exactly into operating and FX — the two columns always sum to Δ (operating is measured at last month\'s rate, FX is applied to this month\'s '+(usd?'EGP spend':'USD income')+').</div></div>';
}
/* 9b · Variable cost per turnover (Sarah 2026-08-13) — the same unit and the same toggles as
   Turnover economics, widened to EVERY variable cost so a submission shows what a turnover really
   costs us: laundry · cleaning (incl. labour) · electricity · supplies · internet & phone ·
   utilities (water + gas). Rent, maintenance, subscriptions and contingency are deliberately OUT:
   they do not move with a turnover. Per RULE: the /night column divides by OCCUPIED nights, so a
   month inside a long stay shows its true nightly cost instead of zero. */
var VC_COLS=[
  {k:'laundry',   lbl:'Laundry',    keys:['laundry']},
  // cleaning and cleaning labour stay ONE column (Sarah 2026-08-13) — same as Turnover economics,
  // so the two tables can be read against each other without mental arithmetic
  {k:'cleaning',  lbl:'Cleaning',   keys:['cleaning','cleaning-labor']},
  {k:'elec',      lbl:'Electricity',keys:['electricity']},
  {k:'supplies',  lbl:'Supplies',   keys:['supplies']},
  {k:'net',       lbl:'Net & phone',keys:['tv-phone-internet']},
  {k:'util',      lbl:'Utilities',  keys:['water','heat-gas']}
];
function secVarCost(){
  var ms=pickMonths(R.vc,vcMonth), merged=mergeStays(rawStays());
  var h='<div class="card"><h3>Variable cost per turnover<span class="rt">per dry-clean submission'+(vcMonth!=='all'?' · '+MON[+vcMonth.slice(5,7)-1]+' '+vcMonth.slice(0,4):'')+'</span></h3>'+
    '<div class="rowbtns">'+scopeSeg()+curSeg()+'</div>'+
    '<div class="rowbtns">'+monthBtnsFor(monthsInRange(R.vc),vcMonth,'setVcMonth')+timeSeg('vc')+'</div>'+
    '<div style="overflow-x:auto"><table class="t" style="min-width:800px"><thead><tr><th>Flat</th><th>Stays</th><th>Subs</th><th>Nights</th>'+
      VC_COLS.map(function(c){return '<th>'+c.lbl+'/sub</th>';}).join('')+
      '<th>Total/sub</th><th>Total/night</th></tr></thead><tbody>';
  var T={nS:0,subs:0,nights:0,tot:0,by:{}}; VC_COLS.forEach(function(c){T.by[c.k]=0;});
  scopeFlats().forEach(function(f){
    var stays=merged.filter(function(s){ return s.flat===f&&monthOf(s.checkOut)>=ms[0]&&monthOf(s.checkOut)<=ms[ms.length-1]; });
    var nS=stays.length, subs=0, nights=0, val={}, tot=0; VC_COLS.forEach(function(c){val[c.k]=0;});
    ms.forEach(function(m){
      var c=costsUSD(f,m); subs+=dcCount(f,m);
      VC_COLS.forEach(function(col){ col.keys.forEach(function(k){ var v=disp(c.by[k]||0,m); val[col.k]+=v; tot+=v; }); });
      rawStays().forEach(function(s){ if(s.flat===f&&isLive(s))nights+=overlapNights(s,m); });
    });
    T.nS+=nS; T.subs+=subs; T.nights+=nights; T.tot+=tot;
    VC_COLS.forEach(function(c){ T.by[c.k]+=val[c.k]; });
    h+='<tr><td>'+esc(f)+'</td><td>'+(nS||'—')+'</td><td>'+(subs||'—')+'</td><td>'+(nights||'—')+'</td>'+
       VC_COLS.map(function(c){return '<td>'+money(subs>0?val[c.k]/subs:0)+'</td>';}).join('')+
       '<td style="font-weight:700">'+money(subs>0?tot/subs:0)+'</td><td>'+money(nights>0?tot/nights:0)+'</td></tr>'; });
  h+='<tr style="font-weight:800"><td>Portfolio</td><td>'+(T.nS||'—')+'</td><td>'+(T.subs||'—')+'</td><td>'+(T.nights||'—')+'</td>'+
     VC_COLS.map(function(c){return '<td>'+money(T.subs>0?T.by[c.k]/T.subs:0)+'</td>';}).join('')+
     '<td>'+money(T.subs>0?T.tot/T.subs:0)+'</td><td>'+money(T.nights>0?T.tot/T.nights:0)+'</td></tr>';
  return h+'</tbody></table></div><div class="note">Every cost that moves with a turnover, per dry-clean submission — laundry, cleaning (labour included, same as Turnover economics), electricity, supplies, internet &amp; phone, and utilities (water + gas). <b>Rent, maintenance, compound maintenance, subscriptions, ops manager and contingency are excluded</b>: they run whether or not a guest turns over. <b>Nights = booked nights</b> — nights a guest actually occupied the flat inside the range (blocked and empty nights excluded), and it is exactly the divisor behind Total/night. Columns add across to Total/sub, and the Portfolio row is the same maths over all flats\' sums.</div></div>';
}
/* 10 · Repairs — stacked by flat × trade category (or by category), month + time buttons */
function tradeLabel(t){ var m=TRADES.filter(function(x){return x[0]===t;})[0]; return m?m[1]:(t||'other'); }
function secRepairs(){
  var ms=pickMonths(R.rep,repMonth);
  var closed=(D.repairs||[]).filter(function(r){ return r.status==='closed'&&r.closedDate&&ms.indexOf(monthOf(r.closedDate))>=0&&(scope==='portfolio'||r.flat===scope); });
  // repairs START in EGP, so the toggle converts them UP: each repair at its own closed-month rate
  function repVal(r){ return CUR==='EGP'?(r.cost||0):(r.cost||0)/rateFor(monthOf(r.closedDate)); }
  var tot=closed.reduce(function(a,r){return a+repVal(r);},0);
  /* time on the x-axis like every other chart (Sarah 2026-08-04): monthly bars by closed date,
     stacked by TRADE or by FLAT — the toggle picks the stacking dimension. */
  var series = repMode==='cat'
    ? TRADES.map(function(t){ return {k:t[0],lbl:t[1],color:t[2]}; })
    : scopeFlats().map(function(f){ return {k:f,lbl:f==='Zayed 2000'?'Zayed':f,color:FLAT_COLORS[f]||'#999'}; });
  var chart, legend='';
  if(!closed.length){
    chart='<div class="muted">No closed repairs in range — log WeShare-backed ones in the Repairs tab (Status=closed + Closed date + Cost).</div>';
  } else {
    var rows=ms.map(function(m){ var vals={}; series.forEach(function(se){vals[se.k]=0;});
      closed.forEach(function(r){ if(monthOf(r.closedDate)!==m)return;
        var k=repMode==='cat'?r.trade:r.flat; if(vals[k]!==undefined)vals[k]+=repVal(r); });
      return {m:m,vals:vals}; });
    chart=stackedChart(rows,series,{unit:''});
    legend='<div class="legend">'+series.map(function(se){return '<span><i style="background:'+se.color+'"></i>'+esc(se.lbl)+'</span>';}).join('')+'</div>';
  }
  return '<div class="card"><h3>Repairs<span class="rt">'+closed.length+' closed · '+fmt(tot)+' '+(CUR==='USD'?'USD':'EGP')+(repMonth!=='all'?' · '+MON[+repMonth.slice(5,7)-1]+' '+repMonth.slice(0,4):'')+'</span></h3>'+
    '<div class="csub">'+(CUR==='USD'?'USD':'EGP')+' per month by closed date — analysis of Maintenance already in the P&amp;L, not added to totals</div>'+
    '<div class="rowbtns">'+scopeSeg()+curSeg()+'</div>'+
    '<div class="rowbtns">'+seg([['cat','Stack by trade'],['flat','Stack by flat']],repMode,'setRepMode')+'</div>'+
    '<div class="rowbtns">'+monthBtnsFor(monthsInRange(R.rep),repMonth,'setRepMonth')+timeSeg('rep')+'</div>'+
    chart+legend+'</div>';
}

AUTH_ON_LOGIN = boot; if (authGuard()) boot();   // signed in → load now; otherwise the sign-in form loads it
