@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
:root{--blush:#f9f0f0;--red:#cc5f5f;--blue:#b8c9d9;--ink:#1a1a1a;--soft:#6b6b6b;--white:#fff;--line:#ecdede;--grey:#f6f2f2;--g:#3a7d4d;--rr:#cc5f5f;--amber:#e8b45f}
*{box-sizing:border-box}
body{margin:0;background:#dcd0d0;font-family:'Cairo',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 0 40px}

.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;white-space:nowrap;flex:none}.brand .r{color:var(--red)}.brand .logo{width:26px;height:26px;border-radius:6px;flex:none}.brand .bs{font-weight:600;font-size:11.5px;color:var(--soft);border-left:1px solid var(--line);padding-left:7px}
.rib{font-size:10px;color:#4c4040;text-align:right;line-height:1.5}.rib b{color:#1a1a1a}
.body{padding:13px 13px 12px;background:var(--blush)}
.tabbar{display:flex;background:var(--white);border-top:1px solid var(--line)}
.tabbar .tab{flex:1;text-align:center;padding:7px 1px 8px;font-size:9.5px;color:var(--soft);text-decoration:none;font-weight:600;border-top:2px solid transparent}
.tabbar .tab .ti{display:block;font-size:16px;line-height:1.15;margin-bottom:1px}
.tabbar .tab.active{color:var(--red);border-top-color:var(--red)}

.bar{height:9px;background:#eee3e3;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar > i{display:block;height:100%;border-radius:6px}
/* Needs-you list: one block per thing to DO — what, why, and the action, red before amber */
.act{border-radius:10px;padding:7px 10px;margin-bottom:6px;border-left:4px solid}
.act.red{background:#f8e6e6;border-color:#cc5f5f}
.act.amber{background:#fbf1dc;border-color:#e8b45f}

.dep.ok{background:#dce9df;color:#2f6a41}.dep.warn{background:#f6dede;color:#a24a4a}.dep.wait{background:#eef1f4;color:#4a6377}
.wait2{color:var(--soft);font-size:12px;padding:4px 0}

details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}

<div class="frame">
  <div class="topbar">

<script src="auth.js"></script>
<script src="net_model.js"></script>
<script>
/* CONFIG (ENDPOINT + session) lives in auth.js */
/* Bundle catalog lives ONLY in the sheet ("Internet catalog" tab) — no code-side defaults, nothing fabricated. */
function catalog(){ return (D.internet&&D.internet.catalog)?D.internet.catalog:[]; }

var D=null, DAYMS=86400000, STAYS=[], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function esc(s){ return (s||'').toString().replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function pdt(s){ s=(s||'').toString().trim(); if(!s)return null; s=s.replace(' ','T'); if(s.length<=10)s+='T00:00'; var d=new Date(s); return isNaN(d)?null:d; }
function day(s){ return new Date(String(s).slice(0,10)+'T00:00:00'); }
/* logical stays: contiguous same-guest bookings merge into one continuous stay (cleaning + internet only) */
function mergeStays(stays){
  var live=(stays||[]).filter(function(s){ return isLive(s)&&s.checkIn&&s.checkOut; })
    .slice().sort(function(a,b){ return a.flat<b.flat?-1:(a.flat>b.flat?1:(a.checkIn<b.checkIn?-1:1)); });
  var out=[], acc=null;
  live.forEach(function(s){
    if(acc && acc.flat===s.flat && acc.guest===s.guest && acc.checkOut===s.checkIn){
      acc.checkOut=s.checkOut; acc.nights=Math.round((day(acc.checkOut)-day(acc.checkIn))/DAYMS);
      acc.guests=Math.max(acc.guests||1,s.guests||1); acc.ids.push(s.id);
    } else { if(acc)out.push(acc);
      acc={ id:s.id, ids:[s.id], flat:s.flat, guest:s.guest, checkIn:s.checkIn, checkOut:s.checkOut, nights:s.nights, guests:s.guests }; }
  });
  if(acc)out.push(acc);
  return out;
}
/* GUARD — STAYS (merged) = INTERNET / occupancy only. rawStays() (per booking) = MONEY / CHANNEL /
   PAYMENT / STATISTICS. Revenue-by-channel and -by-payment are per booking, never off the merged view. */
function rawStays(){ return D.stays || []; }
function ymd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function dmon(d){ return d.getDate()+' '+MON[d.getMonth()]; }
function isLive(s){ var st=(s.status||'').toLowerCase(); return st.indexOf('cancel')<0 && st.indexOf('block')<0; }
/* flatsWithNet · curBundle · lastReading · curStay · netHistory · netCalc live in net_model.js
   (ONE model shared with today.html — Sarah 2026-09-02: "so that we don't have several
   calculations"). Do not re-define them here: a page-level copy would shadow the shared one. */
function nowLocal(){ return new Date(D.meta.asOf+'T'+new Date().toTimeString().slice(0,5)+':00'); }

function nextCheckout(flat, from){
  var next=null; STAYS.forEach(function(s){ if(s.flat!==flat)return; var co=day(s.checkOut);
    if(co>=from&&(!next||co<next))next=co; }); return next;
}
function overageThisMonth(flat){
  var m={}; (D.internet.bundles||[]).forEach(function(x){ if(x.flat!==flat)return; var d=pdt(x.cycleStart); if(!d)return;
    var k=d.getFullYear()+'-'+d.getMonth(); m[k]=(m[k]||0)+1; });
  for(var k in m) if(m[k]>=2) return true; return false;
}

/* §5.4 occupancy-aware pace model → net_model.js (one copy shared with today.html, 2026-09-02).
   KEEP IN STEP with netWatchCandidates_ in Code.gs — same model drives the Telegram alert. */

/* ============================================================
 * NEEDS YOU — the whole point of the page (Sarah 2026-08-18: "there is so much going on for each
 * apartment and i honestly can't read the message to act on"). Every flat used to print eight
 * blocks whether or not anything was wrong. Nothing here fires unless there is something to DO,
 * each line says what · why · by when, and red outranks amber.
 *
 * WHICH ONES INTERRUPT YOU (Sarah asked, 2026-08-18). A Telegram is for something that costs money
 * or a guest's evening if it waits until you next open the page — and that you would not otherwise
 * see. Everything else sits here and waits, because a channel that pings for things that can wait
 * stops being read. `tg:true` marks the three that earn it:
 *   · the bundle dies before the guest leaves — no internet in an occupied flat
 *   · it dies within two days, occupied or not — you must recharge before it goes
 *   · the renewal is tomorrow — an errand in the real world, one ping the day before
 * Not telegrammed: a depletion later this cycle, a stale reading, a greedy guest, a second renewal
 * this month, a missing bundle. Each is real, none of them decays overnight.
 * netWatchCandidates_ in Code.gs sends exactly these three, announce-once per bundle cycle.
 * ============================================================ */
function netActions(){
  var out=[], asOf=day(D.meta.asOf);
  flatsWithNet().forEach(function(f){
    var c=netCalc(f), b=c.bundle;
    // every flat is ours, 17B included — we buy the internet there too (Sarah 2026-08-18)
    if(c.state==='nobundle'){
      out.push({f:f,key:f+'|nobundle',fp:'1',sev:'amber',ttl:'No bundle recorded',why:'nothing can be projected without a quota and a cycle date',act:'Set the bundle below'});
      return;
    }
    // 1 · renewal due — it is Sarah who pays, so it is her action, not a fact
    if(c.state!=='waiting' && c.daysToRenew<=3)
      out.push({f:f,key:f+'|renew|'+ymd(c.cycleEnd),fp:'1',tg:c.daysToRenew<=1,sev:c.daysToRenew<=1?'red':'amber',ttl:'Renews '+(c.daysToRenew===0?'today':c.daysToRenew===1?'tomorrow':'in '+c.daysToRenew+' days')+' ('+dmon(c.cycleEnd)+')',
                why:'the cycle ends and the quota resets',act:'Renew it, then record the new bundle below'});
    // 2 · dies before the renewal — this is the one that costs a second bundle
    if(c.state!=='waiting' && c.spent){
      // the projection already ran past zero — the bundle is dead, or the reading is too old to trust
      out.push({f:f,key:f+'|dies|'+ymd(c.cycleEnd),fp:ymd(c.depletion),tg:true,sev:'red',ttl:'Should be empty by now',
                why:'at '+fmtGB(c.rate)+' GB/guest-day the '+fmtGB(c.remaining)+' GB read on '+dmon(c.at)+' are already gone',
                act:c.readingAge>=3?'Get a fresh reading first — it may be stale — then top up or renew':'Top up or renew now'});
    } else if(c.state!=='waiting' && c.dies){
      /* "Runs out before the guest leaves" is meaningless for a long stay (Sarah 2026-08-18: Iman
         is in 17A until October). Of course it does — the bundle renews monthly and she is here for
         three of them. A guest is only STRANDED when their stay also ends before the renewal, so
         nothing can rescue them; when the renewal lands first, it is the renewal that matters and
         the checkout date is noise. */
      var gAt=curStay(f,day(ymd(c.depletion)));
      var stranded = gAt && day(gAt.checkOut) <= c.cycleEnd;
      var gapD=Math.max(1,Math.round((c.cycleEnd-c.depletion)/DAYMS));
      out.push({f:f,key:f+'|dies|'+ymd(c.cycleEnd),fp:ymd(c.depletion),tg:(c.daysToDeplete<=2||stranded),sev:(c.daysToDeplete<=2||stranded)?'red':'amber',
                ttl:'Runs out '+dmon(c.depletion)+(c.daysToDeplete<=1?' — tomorrow':' ('+c.daysToDeplete+' days)'),
                why:gapD+' days before it renews on '+dmon(c.cycleEnd)+
                    (stranded?' — and the guest leaves '+dmon(day(gAt.checkOut))+', before the renewal could save them'
                            :(gAt?' — a guest is in the flat for those days':'')),
                act:stranded?'Top up now — a guest without internet is a review'
                           :(gAt?'Top up, or leave it and let the renewal cover it':'Top up or renew early')});
    }
    // 3 · a stale reading makes every number above it a guess
    if(c.state==='waiting')
      out.push({f:f,key:f+'|stale',fp:'none',sev:'amber',ttl:'No reading yet this cycle',why:'nothing to project from',act:'Take a reading from the WE app'});
    else if(c.readingAge >= (c.occupied?4:7))
      out.push({f:f,key:f+'|stale',fp:String(Math.floor(c.readingAge/3)),sev:'amber',ttl:'Reading is '+c.readingAge+' days old',why:'every figure for this flat is a projection from it',act:'Take a fresh reading from the WE app'});
    /* 4 · a guest well past their share — a conversation, not a colour. Only while there is still a
       conversation to have: once they have checked out and a couple of days have passed the number
       is history, and history does not belong in a list of things to do (Sarah 2026-08-18: Amjed
       and Ryen both left and were still sitting there). The figure stays in the per-guest ledger
       inside the card, which is where past guests belong. */
    guestUsage(f).forEach(function(u){
      if(!u.stay||u.fair<=0) return;
      var gone=Math.round((asOf-day(u.stay.checkOut))/DAYMS);
      if(gone>2) return;
      var ratio=u.consumed/u.fair;
      if(ratio<1.3 || u.over < 0.2*b.quota) return;
      out.push({f:f,key:f+'|over|'+u.stay.id, fp:String(Math.round(u.over/10)),
                sev:'amber',ttl:esc((u.guest||'guest').split(' ')[0])+' is '+fmtGB(u.over)+' GB over',
                why:'used '+fmtGB(u.consumed)+' GB against a fair share of '+fmtGB(u.fair)+' ('+(Math.round(ratio*10)/10)+'×)'+(gone>0?' — checked out '+dmon(day(u.stay.checkOut)):''),
                act:gone>0?'Last chance to raise it before they are gone':'Worth a message — or let it ride if the bundle still lasts'});
    });
    // 5 · two cycle-starts in one calendar month = money you did not plan
    if(overageThisMonth(f))
      out.push({f:f,key:f+'|twice|'+String(D.meta.asOf).slice(0,7),fp:'1',sev:'amber',ttl:'Renewed twice this month',why:'a second recharge lands as an overage in the P&L',act:'Check it was needed — the bundle may be too small for this flat'});
  });
  var rank={red:0,amber:1};
  return out.sort(function(a,z){ return (rank[a.sev]-rank[z.sev]) || (a.f<z.f?-1:1); });
}
/* the "seen" ledger — {alertKey: the fingerprint that was seen}. localStorage, so it survives
   logins on this device; a different device starts with a clean slate, which is the honest trade
   for not needing a server round-trip to fold away a line you have read. */
var NET_SEEN_KEY='owh_net_seen';
function netSeen(){ try{ return JSON.parse(localStorage.getItem(NET_SEEN_KEY)||'{}')||{}; }catch(e){ return {}; } }
function netSeenSave(o){ try{ localStorage.setItem(NET_SEEN_KEY,JSON.stringify(o)); }catch(e){} }
function netMarkSeen(k,fp){ var s=netSeen(); s[k]=fp; netSeenSave(s); render(); }
function netUnsee(k){ var s=netSeen(); delete s[k]; netSeenSave(s); render(); }
function rateChip(c){
  var m={guest:'measured — '+esc(((c.guest||{}).guest||'guest').split(' ')[0]),
         history:'estimate · flat history', portfolio:'estimate · portfolio', fair:'estimate · fair share'};
  return '<span class="fb '+(c.rateSource==='guest'?'ok':'hi')+'" title="how the GB/day rate was derived">'+(m[c.rateSource]||'')+'</span>';
}
function paceBadge(ratio){ return ratio<=1.0?{cls:'ok',txt:'fair'}:(ratio<=1.3?{cls:'hi',txt:'high'}:{cls:'ov',txt:'over'}); }
/* per-guest fairness — WHOLE STAY, across cycles (Sarah 2026-08-04): a cycle boundary is a billing
   artefact, not a behavior reset — a guest who killed one bundle and started on the next must show
   the SUM. consumed = the netHistory attribution across every bundle; fair = Σ per stay-day of
   (that day's bundle quota ÷ 30). Listed: stays touching the current cycle (the actionable ones),
   worst-first. Vacant idle burn already shows in the card header as the trickle rate. */
function guestUsage(flat){
  var b=curBundle(flat); if(!b) return [];
  var cs=pdt(b.cycleStart); if(!cs) return [];
  var asOf=day(D.meta.asOf), ce=new Date(cs.getTime()+30*DAYMS), H=netHistory();
  var bs=(D.internet.bundles||[]).filter(function(x){return x.flat===flat;})
    .map(function(x){return {q:x.quota,cs:pdt(x.cycleStart)};}).filter(function(x){return x.cs;})
    .sort(function(a,z){return a.cs-z.cs;});
  function fairFor(d0,d1){                       // Σ quota/30 over each day of [d0,d1)
    var tot=0;
    for(var t=d0.getTime(); t<d1.getTime(); t+=DAYMS){
      for(var i=bs.length-1;i>=0;i--){ if(bs[i].cs<=new Date(t+DAYMS/2)){ tot+=bs[i].q/30; break; } }
    }
    return tot;
  }
  var out=[];
  STAYS.forEach(function(st){
    if(st.flat!==flat) return;
    var ci=day(st.checkIn), co=day(st.checkOut);
    if(co<=cs||ci>=ce) return;                   // not touching the current cycle
    var g=H.guest[flat+'|'+st.id];
    if(!g||g.gb<=0.1) return;
    var upto=asOf<co?asOf:co;
    var nights=Math.max(0,Math.round((upto-ci)/DAYMS));
    var fair=fairFor(ci,upto);
    out.push({stay:st, guest:st.guest, nights:nights, consumed:g.gb, fair:fair, over:g.gb-fair});
  });
  return out.sort(function(a,z){ return z.over-a.over; });
}

/* ---------- fetch ---------- */
function boot(){ fetchOnce().then(onData).catch(function(){ setTimeout(function(){ fetchOnce().then(onData).catch(showErr); },800); }); }
function fetchOnce(){ return api('props_get_all',{scope:'net'}).then(function(j){ if(!j||!j.ok)throw new Error(j&&j.error||'bad'); return j; }); }
function onData(j){ D=j.data; D.internet=D.internet||{bundles:[],readings:[]}; STAYS=mergeStays(D.stays); render(); loadPhones(); document.getElementById('rib').innerHTML='data <b>'+new Date().toTimeString().slice(0,5)+'</b>'; }
function showErr(e){ document.getElementById('app').innerHTML='<div class="err"><b>Couldn\'t load.</b> '+esc(e.message||e)+'</div>'; }

function render(){
  var asOf=day(D.meta.asOf), h='';
  __nh=null;                                     // rate history recomputes per render (fresh data)
  /* --- what needs doing, before anything that merely reports --- */
  var acts=netActions(), seen=netSeen(), open=[], hid=[];
  acts.forEach(function(a){ (a.key && seen[a.key]===a.fp ? hid : open).push(a); });
  h+='<div class="card"><h3>Needs you<span class="rt">'+(open.length?open.length+' item'+(open.length>1?'s':''):'all clear')+'</span></h3>';
  if(!open.length) h+='<div class="act ok">'+(hid.length?'Nothing new — '+hid.length+' item'+(hid.length>1?'s':'')+' you have already seen below.':'Every bundle is on pace and every reading is current. Nothing to do.')+'</div>';
  open.forEach(function(a){
    h+='<div class="act '+a.sev+'"><div class="at"><b>'+esc(a.f)+'</b> — '+a.ttl+
       (a.tg?' <span class="tgb" title="this one also reaches you on Telegram, once">📲</span>':'')+
       (a.key?'<span class="seenb" onclick="netMarkSeen(\''+a.key+'\',\''+a.fp+'\')" title="I have read this — tuck it away until it changes">✓ seen</span>':'')+'</div>'+
       '<div class="aw">'+a.why+'</div><div class="aa">→ '+a.act+'</div></div>';
  });
  /* SEEN, NOT DISMISSED (Sarah 2026-08-18: "if i dismiss then i would not remember, but if i
     minimize i have to minimize every time i log in"). Marking one seen remembers it in this
     browser, so it stays tucked away across logins — and it comes BACK on its own the moment the
     situation changes for the worse: each item carries a fingerprint of its own substance (the
     depletion date, how many GB over, how stale the reading is in 3-day steps), and a changed
     fingerprint is a different problem wearing the same name. Nothing is ever deleted; they sit
     folded underneath, counted. */
  if(hid.length){
    h+='<details class="seen"><summary>✓ '+hid.length+' already seen — show</summary>';
    hid.forEach(function(a){
      h+='<div class="act seenrow"><div class="at"><b>'+esc(a.f)+'</b> — '+a.ttl+
         '<span class="seenb" onclick="netUnsee(\''+a.key+'\')" title="bring it back to the top">↩ unsee</span></div>'+
         '<div class="aw">'+a.why+'</div></div>';
    });
    h+='</details>';
  }
  h+='<div class="foot">📲 = also sent once on Telegram. Only three things interrupt you: a bundle dying while it strands a guest, dying within two days, or a renewal tomorrow. <b>✓ seen</b> folds an item away until its facts change — it is remembered on this device, never deleted.</div></div>';
  flatsWithNet().forEach(function(f){
    var c=netCalc(f), b=c.bundle, over=overageThisMonth(f);
    h+='<div class="card"><h3>'+esc(f)+(b?'<span class="rt">'+esc(b.name)+' · '+b.quota+' GB</span>':'<span class="rt">no bundle</span>')+'</h3>';

    if(c.state==='nobundle'){ h+='<div class="wait2">No bundle set — add one below.</div>'; }
    else {
      var cs=pdt(b.cycleStart), ce=cs?new Date(cs.getTime()+30*DAYMS):null;   // cycle end / renewal — 30 days
      h+='<div class="sub">cycle '+ (cs?dmon(cs)+' '+cs.toTimeString().slice(0,5):esc(b.cycleStart)) + (ce?' → renews <b>'+dmon(ce)+'</b>':'') +' · '+b.price+' EGP</div>';
      if(over) h+='<div class="ov">⚠ 2 cycle-starts this month → overage (VAR)</div>';
      if(c.state==='waiting'){ h+='<div class="dep wait">Waiting on reading — enter the remaining GB from the WE app. '+
        'Expected pace: <b>'+fmtGB(c.rate)+' GB/day</b> '+rateChip(c)+'</div>'; }
      else {
        var pctW=Math.round(c.pct*100), col=pctW<20?'#cc5f5f':(pctW<45?'#e8b45f':'#3a7d4d');
        h+='<div class="bar"><i style="width:'+pctW+'%;background:'+col+'"></i></div>';
        /* THREE NUMBERS, NOT FOUR — and the middle one is days to RENEWAL unless the bundle will
           actually die first, in which case that is the number that matters and it is red. The old
           card showed "days left" from a projection that ignored the renewal, plus a "depletes"
           date that was often past it: two figures that could not both be true. */
        var pb=paceBadge(c.pace);
        h+='<div class="stat"><div class="s"><div class="sv">'+fmtGB(c.remaining)+'</div><div class="sl">GB left of '+b.quota+'</div></div>'+
           '<div class="s'+(c.dies?' dep-b':'')+'"><div class="sv">'+(c.spent?'0':(c.dies?c.daysToDeplete:c.daysToRenew))+'</div>'+
             '<div class="sl">'+(c.spent?'should be empty':(c.dies?'days till it runs out':'days till renewal'))+'</div></div>'+
           '<div class="s"><div class="sv">'+(Math.round(c.pace*10)/10)+'×</div><div class="sl">pace vs fair share</div></div></div>';
        var co=nextCheckout(f,asOf);
        h+='<div class="dep '+(c.dies?'warn':'ok')+'">'+(c.dies
              ? '⚠ Runs out '+dmon(c.depletion)+', '+Math.max(1,Math.round((ce-c.depletion)/DAYMS))+' days before it renews on '+dmon(ce)+
                (co&&c.depletion<co?' — and before the guest leaves '+dmon(co):'')
              : 'Covers the cycle at '+fmtGB(c.rate)+' GB/guest-day — renews '+dmon(ce))+'</div>';
        h+='<details class="more"><summary>pace, guests &amp; last reading</summary>'+
           '<div class="pace"><span class="fb '+pb.cls+'">'+pb.txt+'</span> '+fmtGB(c.rate)+' GB/guest-day vs fair '+fmtGB(c.fairDaily)+' '+rateChip(c)+
           ' · vacant days ~'+fmtGB(c.idle)+' GB</div>'+
           '<div class="foot">Last reading '+fmtGB(c.remaining)+' GB at '+(c.at?dmon(c.at)+' '+c.at.toTimeString().slice(0,5):'')+
             (c.readingAge?' — <b>'+c.readingAge+' day'+(c.readingAge>1?'s':'')+' old</b>':' — today')+' · fair = quota ÷ '+Math.round(c.cycleDays)+' cycle-days</div>';
        // per-guest fairness — WHOLE stay, across cycles (renewals don't reset a guest's ledger)
        var usage=guestUsage(f);
        if(usage.length){
          h+='<div class="usage"><div class="uh">Consumed vs fair share — whole stay, across cycles</div>';
          usage.forEach(function(u){
            if(!u.stay){ h+='<div class="ur"><span class="un">between guests (vacant)</span><span class="um" style="color:var(--soft)">'+fmtGB(u.consumed)+' GB idle</span></div>'; return; }
            var ub=paceBadge(u.fair>0?u.consumed/u.fair:9);
            h+='<div class="ur"><span><span class="ug">'+esc((u.guest||"").split(" ")[0])+'</span>'+(u.nights?' <span class="un">'+u.nights+'n</span>':'')+'</span>'+
               '<span class="um">'+fmtGB(u.consumed)+' / '+fmtGB(u.fair)+' GB &nbsp;<span class="fb '+ub.cls+'">'+(u.over>0?'+':'')+fmtGB(u.over)+'</span></span></div>';
          });
          h+='</div>';
        }
        h+='</details>';
      }
    }

    /* --- inputs --- */
    h+='<details><summary>+ Add reading / renew bundle</summary>';
    h+='<div class="frm">'+
       '<div class="full"><label>Remaining quota now (GB) — from WE app</label><input type="number" step="0.1" id="rem_'+f+'" placeholder="e.g. 84.5"></div>'+
       '<div><label>Reading date</label><input type="date" id="rdt_'+f+'" value="'+ymd(new Date())+'"></div>'+
       '<div><label>Time</label><input type="time" id="rtm_'+f+'" value="'+new Date().toTimeString().slice(0,5)+'"></div>'+
       '<div class="full"><button class="btn" onclick="saveReading(\''+f+'\')">Save reading</button><span class="msg" id="rmsg_'+f+'"></span></div>'+
       '</div>';
    h+='<div class="frm" style="margin-top:10px">'+
       '<div><label>Bundle</label><select id="bn_'+f+'" onchange="fillFromCatalog(\''+f+'\')">'+(catalog().length?catalog().map(function(x){return '<option'+(b&&b.name===x.name?' selected':'')+'>'+esc(x.name)+'</option>';}).join(''):'<option value="">— add plans in Internet catalog tab —</option>')+'</select></div>'+
       '<div><label>Quota (GB)</label><input type="number" step="1" id="bq_'+f+'" value="'+(b?b.quota:'')+'" placeholder="GB"></div>'+
       '<div><label>Price (EGP)</label><input type="number" step="0.1" id="bp_'+f+'" value="'+(b?b.price:'')+'"></div>'+
       '<div><label>Cycle start date</label><input type="date" id="bd_'+f+'" value="'+ymd(new Date())+'"></div>'+
       '<div><label>Cycle start time</label><input type="time" id="bt_'+f+'" value="'+new Date().toTimeString().slice(0,5)+'"></div>'+
       /* §5.4: cash ≠ bundle. A new recharge writes the CASH to WeShare (pending, payer Sarah by
          default); "from balance" writes nothing. The P&L takes the BUNDLE price either way. */
       '<div class="full" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+
       '<label style="margin:0">Paid how?</label>'+
       '<label style="font-weight:400"><input type="radio" name="pay_'+f+'" value="recharge" checked onchange="payTgl(\''+f+'\')"> new recharge</label>'+
       '<label style="font-weight:400"><input type="radio" name="pay_'+f+'" value="balance" onchange="payTgl(\''+f+'\')"> from WE balance</label>'+
       '<input type="number" step="0.1" id="cash_'+f+'" placeholder="cash EGP (blank = price)" style="width:150px" title="cash actually paid — may exceed the bundle price; the excess stays as WE balance"></div>'+
       '<div style="align-self:end"><button class="btn sec" onclick="saveBundle(\''+f+'\')">Renew / set bundle</button></div>'+
       '<div class="full" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">'+
       '<button class="btn sec" onclick="prechargeNet(\''+f+'\')" title="cash paid ahead of an auto-renewal — WeShare card only; the P&L cost lands at renewal, at bundle price">💳 Pre-charge (cash ahead)</button>'+
       '<button class="btn sec" style="color:#cc5f5f" onclick="delLastBundle(\''+f+'\')" title="remove the latest bundle entry — its P&L row and pending cash card go with it">🗑 Delete latest entry</button>'+
       '</div>'+
       '<div class="full"><span class="msg" id="bmsg_'+f+'"></span></div>'+
       '</div></details>';
    h+='</div>';
  });
  /* 📞 landline — all four quarterly deadlines in one place, editable (Sarah 2026-08-04) */
  h+='<div class="card"><h3>📞 Landline — quarterly renewals<span class="rt">reminders: 2 days before + due day</span></h3><div id="phones"><span class="muted">Loading…</span></div>'+
     '<div class="foot">Dates auto-advance 3 months after each due day. Payment = a WeShare cash entry (TV/Phone/Internet) — the P&amp;L keeps its monthly accrual, so editing the price here only changes the reminder, not the books.</div></div>';
  h+='<div class="card"><div class="foot">Remaining GB is <b>read off the WE app</b> — never a GB-used subtraction. Pace = GB per <b>occupied</b> day (the current guest\'s measured rate carries across renewals; vacant days burn only the idle trickle). <b>WeShare captures the cash</b> (a new recharge → pending row, payer editable at confirm) and <b>the P&amp;L captures the bundle price</b> via the sync mirror — never both. One day before projected depletion, the Hub bot messages Sarah &amp; Khaled.</div></div>';
  document.getElementById('app').innerHTML=h;
  renderPhones();
}

/* ---------- 📞 landline panel: read/write the Script-Property maps via the two uncached endpoints */
var PHONES=null;
function loadPhones(){
  api('props_phone_bills').then(function(j){ if(j&&j.ok){ PHONES=j.bills; renderPhones(); } }).catch(function(){});
}
function renderPhones(){
  var el=document.getElementById('phones'); if(!el) return;
  if(!PHONES){ el.innerHTML='<span class="muted">Loading…</span>'; return; }
  /* compact (Sarah 2026-08-05): one tight row per line, no per-row save button — one "save changed"
     writes only the rows you actually touched. */
  var h='<table style="width:100%;border-collapse:collapse;font-size:12.5px">';
  PHONES.forEach(function(b,i){
    var days=Math.round((new Date(b.due+'T12:00:00')-day(D.meta.asOf))/DAYMS);
    var chip=days<0?'<span style="color:var(--red);font-weight:700">overdue</span>'
            :days<=2?'<span style="color:var(--red);font-weight:700">'+days+'d</span>'
            :'<span class="muted">'+days+'d</span>';
    h+='<tr'+(i?' style="border-top:1px solid var(--line)"':'')+'>'+
       '<td style="padding:4px 6px 4px 0;font-weight:700;white-space:nowrap">'+esc(b.line)+'</td>'+
       '<td style="padding:4px 6px;text-align:right;white-space:nowrap">'+chip+'</td>'+
       '<td style="padding:4px 6px"><input type="date" id="phd'+i+'" value="'+esc(b.due)+'" onchange="PH_DIRTY[\''+i+'\']=1" style="font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:3px 5px"></td>'+
       '<td style="padding:4px 0;white-space:nowrap"><input type="number" id="php'+i+'" value="'+b.price+'" step="0.1" onchange="PH_DIRTY[\''+i+'\']=1" style="width:60px;font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:3px 5px;text-align:right"> <span class="muted">EGP</span></td>'+
       '</tr>';
  });
  h+='</table><div class="btnrow" style="margin-top:6px"><button class="btn sec" onclick="savePhones()">save changed</button><span class="msg" id="phmsg"></span></div>';
  el.innerHTML=h;
}
var PH_DIRTY={};
function savePhones(){
  var idx=Object.keys(PH_DIRTY);
  var msg=document.getElementById('phmsg');
  if(!idx.length){ msg.textContent='nothing changed'; return; }
  msg.textContent='saving '+idx.length+'…';
  var chain=Promise.resolve();
  idx.forEach(function(i){
    chain=chain.then(function(){
      var b=PHONES[i];
      return api('props_set_phone_bill',{line:b.line,due:document.getElementById('phd'+i).value,
        price:document.getElementById('php'+i).value,user:(ME&&ME.user)||''}).then(function(j){
        if(!j||!j.ok)throw new Error(j&&j.error||'bad'); PHONES=j.bills; });
    });
  });
  chain.then(function(){ PH_DIRTY={}; renderPhones();
    document.getElementById('phmsg').textContent='saved ✓ — reminders follow the new dates';
  }).catch(function(e){ document.getElementById('phmsg').textContent='failed: '+(e.message||e); });
}
function fmtGB(n){ n=+n||0; return n>=100?Math.round(n):(Math.round(n*10)/10); }

function fillFromCatalog(f){ var n=document.getElementById('bn_'+f).value; catalog().forEach(function(x){ if(x.name===n){ document.getElementById('bp_'+f).value=x.price; if(x.quota)document.getElementById('bq_'+f).value=x.quota; } }); }
function saveReading(f){
  var rem=document.getElementById('rem_'+f).value; if(rem===''){ document.getElementById('rmsg_'+f).textContent='enter GB'; return; }
  var at=document.getElementById('rdt_'+f).value+' '+document.getElementById('rtm_'+f).value;
  document.getElementById('rmsg_'+f).textContent='saving…';
  post('props_add_reading', {flat:f, remaining:rem, at:at}, 'rmsg_'+f);
}
function payTgl(f){
  var mode=document.querySelector('input[name="pay_'+f+'"]:checked').value;
  document.getElementById('cash_'+f).disabled = (mode==='balance');
}
function saveBundle(f){
  var name=document.getElementById('bn_'+f).value, q=document.getElementById('bq_'+f).value, p=document.getElementById('bp_'+f).value;
  if(q===''){ document.getElementById('bmsg_'+f).textContent='enter quota GB'; return; }
  var cs=document.getElementById('bd_'+f).value+' '+document.getElementById('bt_'+f).value;
  var mode=document.querySelector('input[name="pay_'+f+'"]:checked').value;
  // from-balance sends NO cash at all — a value left in the (disabled) box must not become a row
  var cash=mode==='recharge'?document.getElementById('cash_'+f).value:'';
  document.getElementById('bmsg_'+f).textContent='saving…';
  post('props_set_bundle', {flat:f, name:name, quota:q, price:p, cycleStart:cs, payMode:mode, cashAmount:cash}, 'bmsg_'+f);
}
/* 🗑 undo a wrong renewal END-TO-END (Sarah 2026-09-01, the 3-Sep 8A entry): one act removes the
   bundles row, its NetBundle P&L row (the mirror reconciles inside the call), and its pending
   WeShare cash card — a confirmed card is only reported for review. */
function delLastBundle(f){
  var bs=(D.internet.bundles||[]).filter(function(x){return x.flat===f;})
    .sort(function(a,z){return String(a.cycleStart)<String(z.cycleStart)?-1:1;});
  if(!bs.length){ alert('no bundle entries for '+f); return; }
  var last=bs[bs.length-1];
  if(!confirm('Delete the LATEST bundle entry for '+f+'?\n\n'+(last.name||'')+' · '+(last.quota||'?')+'GB · '+(last.price||'?')+' EGP · cycle start '+last.cycleStart+
              '\n\nIts P&L row is removed with it, and its pending WeShare cash card (if any) is deleted too.')) return;
  document.getElementById('bmsg_'+f).textContent='deleting…';
  post('props_del_bundle',{flat:f, cycleStart:last.cycleStart},'bmsg_'+f);
}
/* 💳 cash ahead of an auto-renewal: money now, cost later — at the renewal pick "from balance" */
function prechargeNet(f){
  var a=prompt('Cash paid ahead for '+f+' (EGP).\n\nRecorded as a pending Internet-recharge card in WeShare (confirm the payer there). The P&L is untouched — the cost lands at the next renewal, at bundle price. When you enter that renewal, pick "from WE balance" so the cash is not counted twice.','');
  if(a===null) return; a=parseFloat(String(a).replace(/[^\d.]/g,''));
  if(!(a>0)){ alert('enter an amount'); return; }
  document.getElementById('bmsg_'+f).textContent='saving…';
  post('props_net_precharge',{flat:f, amount:a},'bmsg_'+f);
}
function post(fn, params, msgId){
  var body={user:(ME&&ME.user)||''};
  for(var k in params) body[k]=params[k];
  api(fn, body).then(function(j){
    if(!j||!j.ok)throw new Error(j&&j.error||'bad');
    /* the outcome must be VISIBLE (the missing-430 lesson): say whether the cash reached WeShare */
    var m='saved ✓';
    if(fn==='props_set_bundle'&&j.result)
      m=j.result.weshare?'saved ✓ — cash → WeShare pending (confirm payer there)':'saved ✓ — no cash row (from balance)';
    if(fn==='props_del_bundle'&&j.result)
      m=j.result.deleted?('deleted ✓'+(j.result.weshare==='deleted'?' — pending cash card removed too':(j.result.weshare==='confirmed'?' — ⚠ its cash card is already confirmed; review it in WeShare':''))):(j.result.error||'not found');
    if(fn==='props_net_precharge'&&j.result)
      m='recorded ✓ — pending cash card in WeShare; at the next renewal pick "from balance"';
    boot();
    setTimeout(function(){ var el=document.getElementById(msgId); if(el) el.textContent=m; },600);
  }).catch(function(e){ document.getElementById(msgId).textContent='failed: '+(e.message||e); });
}

AUTH_ON_LOGIN = boot; if (authGuard()) boot();   // signed in → load now; otherwise the sign-in form loads it
</script>
