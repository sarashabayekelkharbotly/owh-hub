<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hub · Monthly close</title>
<link rel="icon" href="hub-logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
:root{--blush:#f9f0f0;--red:#cc5f5f;--blue:#b8c9d9;--ink:#1a1a1a;--soft:#6b6b6b;--white:#fff;--line:#ecdede;--grey:#f6f2f2;--g:#3a7d4d;--rr:#cc5f5f;--amber:#e8b45f;--greentint:#e4efe7}
*{box-sizing:border-box}
body{margin:0;background:#dcd0d0;font-family:'Cairo',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 0 76px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:var(--white);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -3px 16px rgba(0,0,0,.08);z-index:20}
.tabbar .tab{flex:1;text-align:center;padding:7px 2px 8px;font-size:10px;color:var(--soft);text-decoration:none;font-weight:600;border-top:2px solid transparent}
.tabbar .tab .ti{display:block;font-size:17px;line-height:1.15;margin-bottom:1px}
.tabbar .tab.active{color:var(--red);border-top-color:var(--red)}
.tabbar .tab.dis{opacity:.38;pointer-events:none}
.wrap{max-width:920px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 12px}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;white-space:nowrap;flex:none}.brand .r{color:var(--red)}.brand .logo{width:26px;height:26px;border-radius:6px;flex:none}.brand .bs{font-weight:600;font-size:11.5px;color:var(--soft);border-left:1px solid var(--line);padding-left:7px}
.rib{font-size:10.5px;color:#4c4040;text-align:right;line-height:1.5}.rib b{color:#1a1a1a}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,button{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--white);color:var(--ink);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--white)}
.seg button.on{background:var(--red);color:#fff}
.spacer{flex:1}
/* frames: portrait = phone-first single column; landscape = wide, scrolls on mobile */
.frame{background:var(--blush);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.frame.port{max-width:460px}
.frame.land{max-width:920px}
.orient{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:11px;margin-left:8px;vertical-align:middle}
.o-port{background:#e2edf3;color:#2c5468}.o-land{background:#efe4d4;color:#8a6420}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:8px}
h1{font-size:17px;margin:0 0 1px}
.sub{font-size:11px;color:var(--soft);margin:0 0 7px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;vertical-align:middle;margin-left:6px}
.b-final{background:var(--greentint);color:var(--g)}.b-open{background:#efe4d4;color:#8a6420}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:3px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:10.5px;color:var(--soft);font-weight:700}
.sec td{background:var(--grey);font-weight:700;font-size:9.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;padding:2px 8px}
.tot td{font-weight:700}
.net td{font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.attr td{color:var(--soft)}
.prevcol{color:#9a8c8c}
.zero{color:#cabcbc}.pos{color:var(--g)}.neg{color:var(--rr)}
.delta.up{color:var(--g)}.delta.down{color:var(--rr)}
.checklist div{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:12.5px}
.ok{color:var(--g);font-weight:700}.warn{color:var(--amber);font-weight:700}
.fxin{width:78px;text-align:right}
.mark{background:var(--red);color:#fff;border:0;font-weight:700;padding:9px 16px;border-radius:10px;margin-top:10px}
.mark:disabled{opacity:.45;cursor:not-allowed}
.err{background:#f6e3e3;border:1px solid #e6b9b9;border-radius:10px;padding:12px;font-size:13px;margin-bottom:12px}
textarea{width:100%;min-height:90px;font-family:monospace;font-size:11px;border:1px solid var(--line);border-radius:9px;padding:8px}
.muted{color:var(--soft);font-size:11px}
.cmp-wrap{overflow-x:auto}
.cmp td,.cmp th{white-space:nowrap;padding:5px 9px}
.drillable{cursor:pointer}
.drillable:hover{background:#faf5f5}
.tri{display:inline-block;width:12px;color:var(--soft)}
.drill td{background:#fbf7f7;padding:1px 8px;border-bottom:0}
/* the earnings drill as an eye-scannable table (Sarah 2026-08-31): fixed numeric columns,
   right-aligned, one muted header — compare rows without re-reading prose */
.dtab{width:100%;border-collapse:collapse;background:#fbf7f7}
.dtab td,.dtab th{padding:3px 8px;border-bottom:1px solid #f0e9e9;font-size:12px}
.dtab .dth th{color:var(--soft);font-weight:600;font-size:10.5px;text-align:right;border-bottom:1px solid #e8dede;padding-top:5px}
.dtab .dth th:first-child{text-align:left}
.dtab .dtg{text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtab .dtn{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
/* Drill rows carry guest names in Arabic and English side by side. Left to itself the browser
   reorders a mixed line — "عبدالعزيز السعدون 5 of 7 nights" put the 5 on the wrong side of the
   name — so every name is wrapped in <bdi>, which isolates its direction from the text around it.
   The nights/portal detail also moved to its own line: one truncating line could not hold a long
   Arabic name AND its meta without cutting both. */
/* max-width:0 + hidden keeps the table's shape whatever the text: the electricity accrual's
   paragraph-length source note was stretching the whole sheet sideways (Sarah 2026-08-08).
   Each line inside truncates with … and the full text stays on hover via the title attr. */
.ditem{font-size:11px;color:#5a4d4d;padding-left:22px;line-height:1.35;padding-top:2px;padding-bottom:2px;max-width:0;overflow:hidden}
.dname{unicode-bidi:isolate;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;white-space:nowrap}
.dmeta{font-size:10px;color:#8a7a7a;margin-left:28px;unicode-bidi:isolate;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnote{font-size:10.5px;color:#8a7a7a;padding-left:22px}
.ddate{display:inline-block;width:20px;color:var(--soft);margin-right:8px;font-size:10.5px;vertical-align:bottom}
td.damt{font-size:11px;color:#5a4d4d}
.dfootr td{font-size:10px;color:var(--soft);font-weight:700;border-top:1px dashed var(--line);padding-top:2px;padding-bottom:3px}
/* other-revenue entry — data is typed in the app, never in the spreadsheet */
.orevlink{font-size:10.5px;color:var(--soft);cursor:pointer;text-decoration:underline}
.orevlink:hover{color:#5a4d4d}
.orevform{margin-top:8px;padding:8px;border:1px solid var(--line,#ddd);border-radius:9px;background:#fbf7f7}
.orevrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.orevrow label{flex:0 0 96px;font-size:11.5px;color:var(--soft)}
.orevrow input,.orevrow select{flex:1;font-family:inherit;font-size:12px;border:1px solid var(--line,#ddd);border-radius:7px;padding:4px 7px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img class="logo" src="hub-logo.png" alt="The Hub"><span class="bn">The Hub</span><span class="bs">Monthly close</span></div>
    <div class="rib" id="rib"></div>
  </div>

  <div id="err" style="display:none"></div>

  <div class="controls" id="controls" style="display:none">
    <span class="seg" id="viewSeg">
      <button data-view="review" class="on">Review one flat</button>
      <button data-view="compare">Compare all</button>
    </span>
    <select id="flatSel"></select>
    <select id="monthSel"></select>
    <span class="spacer"></span>
    <span class="seg" id="curSeg">
      <button data-cur="USD" class="on">USD</button>
      <button data-cur="EGP">EGP</button>
    </span>
    <button id="xlsBtn" onclick="exportClose()" title="the whole month, every apartment, every drill-down — opens in Excel">⬇ Export month</button>
  </div>

  <div id="app"></div>

  <div class="card" id="loader">
    <p class="muted">Connecting to the sheet…</p>
  </div>

  <!-- Debug affordance, hidden by default: it used to sit inside #loader, so "Offline / testing"
       was on screen during every normal load and read like something was wrong. showFetchHelp()
       reveals it only when the fetch actually fails. -->
  <div class="card" id="pasteFallback" style="display:none">
    <details><summary class="muted">Offline / testing — paste the <code>props_get_all</code> JSON</summary>
      <textarea id="pasteBox" placeholder="paste the endpoint JSON here"></textarea>
      <button onclick="loadPasted()">Load pasted JSON</button>
    </details>
  </div>
</div>

<script src="auth.js"></script>
<script>
/* CONFIG (ENDPOINT + session) lives in auth.js — no shared secret in this file */

var DATA=null, VIEW='review', CUR='USD', FLAT=null, MONTH=null, OPEN={};
/* P&L cost key -> the category string used in the tx feed */
var CATMAP={'electricity':'__electricity','subscription':'__subscription','laundry':'laundry','supplies':'supplies','cleaning-labor':'cleaning-labor','opsmanager':'opsManager','services-contingency':'Services','maintenance':'Maintenance','tv-phone-internet':'TV/Phone/Internet','water':'Water','heat-gas':'Heat/gas','rent':'rent','compound-maintenance':'compound maintenance','contingency':'contingency','gifts-contingency':'Gifts','general-contingency':'General'};
function esc(s){return (s||'').toString().replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
function dday(d){d=(d||'').toString();var m=d.match(/^\d{4}-\d{2}-(\d{2})/);return m?m[1]:'';}
function trunc(s,n){s=(s||'').toString();return s.length>n?s.slice(0,n-1)+'…':s;}
/* Costs bought for every apartment (WeShare Apartment = "To allocate") are filed against the
   pseudo-flat "(portfolio)" and allocated across flats by the SHEET, so a plain flat filter drops
   them and the drill-down stops matching the line above it. July 2026: 1,817.04 EGP of supplies sat
   in the pool, so 17A's line read 687.93 while this list showed only the 291.00 booked directly —
   which reads as "the entries never arrived".
   This flat's proportion is derived, never assumed: (its cost line − what was booked directly) is
   what came out of the pool, over the pool itself. Each pooled row is then shown at that share. */
var POOL_FLAT='(portfolio)';
function costLineOf(flat,ym,key){
  var r=(DATA.pnl[flat]||{})[ym]; if(!r) return null;
  var hit=null; (r.costs||[]).forEach(function(c){ if(c.key===key) hit=c.amount; });
  return hit;
}
function txFor(flat,ym,key){
  var cat=CATMAP[key]; if(!cat) return [];
  var own=(DATA.tx||[]).filter(function(t){return t.flat===flat&&t.ym===ym&&t.cat===cat;});
  var pool=(DATA.tx||[]).filter(function(t){return t.flat===POOL_FLAT&&t.ym===ym&&t.cat===cat;});
  if(!pool.length) return own;
  var poolTot=pool.reduce(function(a,t){return a+(t.amount||0);},0); if(!poolTot) return own;
  var line=costLineOf(flat,ym,key); if(line==null) return own;
  var fromPool=line-own.reduce(function(a,t){return a+(t.amount||0);},0);
  if(fromPool<=0) return own;
  var share=fromPool/poolTot;
  return own.concat(pool.map(function(t){
    var c={}; for(var k in t) c[k]=t[k];
    c.amount=Math.round((t.amount||0)*share*100)/100;
    c.desc=(t.desc||'')+' · shared ('+Math.round(share*100)+'% to '+flat+')';
    return c;
  }));
}
/* ---- Revenue drill-downs for the close review (Sarah 2026-08-06) -------------------------------
   These read the SHEET's own rows — the apportionment lines and the ledger entries — rather than
   re-deriving them here. A review screen that recomputes can agree with itself while disagreeing
   with the figure above it, which is exactly how a whole month sat in the wrong place unnoticed.
   It also means seeded stays (Yang Yang, whose split only exists in the sheet) show truthfully.
     Earnings  = accommodation apportioned + long-term rent
     Other     = the ledger, whole, in the month earned
     Revenue   = the two added
   Each list ends with its own total against the line above it, so a gap is visible, not absorbed. */
function toggleDrill(id){OPEN[id]=!OPEN[id];render();}

/* ---- Export the month to Excel (Sarah 2026-08-08) ----------------------------------------------
   The whole close for the selected month, EVERY apartment, with all three drill-downs inline:
   earnings → its stays, other → the ledger entries, each cost line → its WeShare entries. CSV with
   a UTF-8 BOM so Excel opens Arabic correctly; amounts in the currency currently selected, and the
   same toCur/txFor the screen itself uses — the file can never disagree with what's on screen. */
async function exportClose(){
  var btn=document.getElementById('xlsBtn'); if(btn){btn.disabled=true;btn.textContent='⏳ building…';}
  try{
    var ms=MONTH, flats=(DATA.meta&&DATA.meta.flatsOrder)||Object.keys(DATA.pnl||{});
    var dets={};
    for (var i=0;i<flats.length;i++){
      try{ var j=await api('props_revenue_detail',{flat:flats[i],month:ms}); if(j&&j.ok) dets[flats[i]]=j; }catch(e){}
    }
    var v=function(x,cur,mo){ x=toCur(x||0,cur||'USD',mo||ms); return Math.round(x*100)/100; };
    var rows=[['Flat','Section','Line','Detail','Date','Nights','Amount ('+CUR+')']];
    flats.forEach(function(f){
      var rec=(DATA.pnl[f]||{})[ms]; if(!rec)return;
      var d=dets[f]||{accommodation:[],other:[],rent:0};
      rows.push([f,'Revenue','Earnings','','','',v(rec.revenue.earnings)]);
      (d.accommodation||[]).slice().sort(function(a,z){return (a.checkIn||'')<(z.checkIn||'')?-1:1;}).forEach(function(a){
        rows.push([f,'Revenue','· stay',(a.guest||a.stayId||'')+(a.portal?' ('+a.portal+')':''),
                   (a.checkIn||'')+' → '+(a.checkOut||''),(a.nights===''||a.nights==null)?'':(a.nights+' of '+a.total),v(a.amount)]); });
      if(d.rent) rows.push([f,'Revenue','· long-term rent','','','',v(d.rent)]);
      rows.push([f,'Revenue','Other revenue','','','',v(rec.revenue.other)]);
      (d.other||[]).forEach(function(o){
        rows.push([f,'Revenue','· '+(o.cat||'other'),(o.guest||'')+(o.via?' · '+o.via:''),o.date||'','',v(o.amount)]); });
      rows.push([f,'Revenue','Total revenue','','','',v(rec.revenue.total)]);
      (rec.costs||[]).forEach(function(c){
        var lbl=(c.label||c.key||'').replace(/\s*\((EGP|USD)\)/,'');
        rows.push([f,'Costs',lbl,'','','',v(c.amount,c.currency)]);
        txFor(f,ms,c.key).forEach(function(t){
          rows.push([f,'Costs','· entry',t.desc||'',t.date||'','',v(t.amount,t.currency)]); });
      });
      rows.push([f,'','Net','','','',v(rec.net)]);
      if(rec.attribution){
        rows.push([f,'','Khaled','','','',v(rec.attribution.khaled)]);
        rows.push([f,'','Sarah','','','',v(rec.attribution.sarah)]);
      }
      rows.push(['','','','','','','']);
    });
    var csv='﻿'+rows.map(function(r){ return r.map(function(x){ x=String(x==null?'':x);   // BOM → Excel reads the Arabic as UTF-8
      return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(','); }).join('\r\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='OWH_close_'+ms+'_'+CUR+'.csv'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  } finally { if(btn){btn.disabled=false;btn.textContent='⬇ Export month';} }
}
var RDET={}, RDET_BUSY={};
function rdKey(){ return FLAT+'|'+MONTH; }
function loadRevDetail(){
  var k=rdKey(); if(RDET[k]||RDET_BUSY[k]) return; RDET_BUSY[k]=1;
  api('props_revenue_detail',{flat:FLAT,month:MONTH}).then(function(j){
    RDET_BUSY[k]=0; if(j&&j.ok){ RDET[k]=j; render(); }
  }).catch(function(){ RDET_BUSY[k]=0; });
}
function rdWait(){ return '<tr class="drill"><td class="dnote" colspan="3">loading…</td></tr>'; }
function rdFoot(label,shown,line){
  var gap=line-shown, h='<tr class="drill dfootr"><td class="dnote">'+label+'</td>'+
    '<td class="damt">'+fmt(toCur(shown,'USD'))+'</td><td class="prevcol"></td></tr>';
  if(Math.abs(gap)>0.005) h+='<tr class="drill"><td class="ditem"><span class="ddate"></span>'+
    '<b>not explained — check the apportionment</b></td><td class="damt">'+fmt(toCur(gap,'USD'))+'</td><td class="prevcol"></td></tr>';
  return h;
}
function earnDrillRows(){
  var d=RDET[rdKey()]; if(!d){ loadRevDetail(); return rdWait(); }
  var rec=DATA.pnl[FLAT][MONTH]||{}, rows='', sum=0;
  (d.accommodation||[]).slice().sort(function(a,b){ return (a.checkIn||'')<(b.checkIn||'')?-1:1; }).forEach(function(a){
    sum+=a.amount;
    /* COLUMNS, NOT PROSE (Sarah 2026-08-31: "a table that is readable... in a way that i can
       easily compare with my eyes when i go row by row") — total nights · nights in month · ADR ·
       earnings, aligned, one header. Uniform per-night rule → the month ADR IS the stay ADR. */
    var nn=Number(a.nights), asRec=(a.nights===''||a.nights==null);
    rows+='<tr><td class="dtg" title="'+esc((a.guest||'')+'  '+(a.checkIn||'')+' → '+(a.checkOut||'')+'  ·  '+a.accommodation+' over '+a.total+' nights')+'">'+
      '<span class="ddate">'+dday(a.checkIn)+'</span><bdi class="dname">'+esc(a.guest||a.stayId||'—')+'</bdi>'+
      (a.portal?'<span class="dmeta"> · '+esc(a.portal)+'</span>':'')+'</td>'+
      '<td class="dtn">'+(a.total||'—')+'</td>'+
      '<td class="dtn">'+(asRec?'—':nn)+'</td>'+
      '<td class="dtn">'+((!asRec&&nn>0)?fmt(toCur(a.amount/nn,'USD')):'—')+'</td>'+
      '<td class="dtn">'+fmt(toCur(a.amount,'USD'))+'</td></tr>';
  });
  if(d.rent){ sum+=d.rent;
    rows+='<tr><td class="dtg">long-term rent</td><td class="dtn">—</td><td class="dtn">—</td><td class="dtn">—</td>'+
      '<td class="dtn">'+fmt(toCur(d.rent,'USD'))+'</td></tr>'; }
  if(!rows) return '<tr class="drill"><td class="dnote" colspan="3">no stays and no rent this month</td></tr>';
  var tab='<tr class="drill"><td colspan="3" style="padding:0"><table class="dtab">'+
    '<tr class="dth"><th></th><th>total n</th><th>in month</th><th>ADR</th><th>earnings</th></tr>'+rows+'</table></td></tr>';
  return tab+rdFoot((d.accommodation||[]).length+' stay'+((d.accommodation||[]).length===1?'':'s')+
    (d.rent?' + rent':'')+' · = earnings', sum, rec.revenue?rec.revenue.earnings:sum);
}
function otherDrillRows(){
  var d=RDET[rdKey()]; if(!d){ loadRevDetail(); return rdWait(); }
  var rec=DATA.pnl[FLAT][MONTH]||{}, rows='', sum=0, list=d.other||[];
  list.forEach(function(o){
    sum+=o.amount;
    rows+='<tr class="drill"><td class="ditem" title="'+esc((o.note||'')+(o.via?' · '+o.via:''))+'">'+
      '<span class="ddate">'+dday(o.date)+'</span><bdi class="dname">'+esc(o.guest||'—')+'</bdi>'+
      '<div class="dmeta">'+esc(o.cat||'')+(o.via?' · '+esc(o.via):'')+'</div>'+
      '</td><td class="damt">'+fmt(toCur(o.amount,'USD'))+'</td><td class="prevcol"></td></tr>';
  });
  if(!rows) return '<tr class="drill"><td class="dnote" colspan="3">nothing recorded — add it in the panel below</td></tr>';
  return rows+rdFoot(list.length+' entr'+(list.length===1?'y':'ies'), sum, rec.revenue?rec.revenue.other:sum);
}

function drillRows(key){
  var list=txFor(FLAT,MONTH,key);
  if(!list.length) return '<tr class="drill"><td class="dnote" colspan="3">no itemised entries</td></tr>';
  var rows=list.map(function(t){
    return '<tr class="drill"><td class="ditem" title="'+esc(t.desc||'')+'"><span class="ddate">'+dday(t.date)+'</span>'+
      '<bdi class="dname">'+esc(t.desc||'—')+'</bdi></td><td class="damt">'+fmt(toCur(t.amount,t.currency))+'</td><td class="prevcol"></td></tr>';
  }).join('');
  var sum=list.reduce(function(a,t){return a+toCur(t.amount||0,t.currency);},0);
  var foot=key==='supplies'
    ? '<tr class="drill dfootr"><td class="dnote" colspan="3">raw logged supplies — reallocated by dry-clean share</td></tr>'
    : '<tr class="drill dfootr"><td class="dnote">'+list.length+' entr'+(list.length>1?'ies':'y')+'</td><td class="damt">'+fmt(sum)+'</td><td class="prevcol"></td></tr>';
  return rows+foot;

var fmt=function(n){return (n<0?'-':'')+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0});};

}
function tryCache(){ try{var c=localStorage.getItem('owh_close');if(c)onData(JSON.parse(c),true);}catch(e){} }
function showFetchHelp(e){ if(DATA)return; $('#err').style.display='block'; $('#err').innerHTML='<div class="err">Couldn\'t reach the endpoint'+(noAuthJs()?' — <b>auth.js did not load</b> (it must sit next to this file)':'')+'. Paste the JSON below to preview.<br><span class="muted">'+(e&&e.message||'')+'</span></div>'; var pf=document.getElementById('pasteFallback'); if(pf)pf.style.display='block'; }
function loadPasted(){ try{ var j=JSON.parse($('#pasteBox').value); onData(j.data?j:{ok:true,data:j,generatedAt:new Date().toISOString()}); }catch(e){ alert('Not valid JSON'); } }
function onData(j,fromCache){ DATA=j.data; DATA._gen=j.generatedAt; __rateCache={}; /* rates derive from the payload — never carry them across a reload */ try{ if(!fromCache) localStorage.setItem('owh_close',JSON.stringify(j)); }catch(e){} $('#loader').style.display='none'; $('#err').style.display='none'; var pf=document.getElementById('pasteFallback'); if(pf)pf.style.display='none'; initControls(); render(); }

/* ---------- currency: convert EVERYTHING to the selected display currency ---------- */
function fx(){ return (DATA.meta.fx&&DATA.meta.fx.current)||1; }
/* EVERY MONTH CONVERTS AT ITS OWN RATE (Sarah 2026-08-05, §5.1). This used to apply the CURRENT
   rate to every month, so a closed month was silently restated whenever the pound moved: May's net
   read 174,184 EGP at July's 49.26 instead of 183,450 at May's own 51.88 — and it disagreed with
   Statistics and the what-changed table, which already follow the rule.
   The rate is DERIVED from the month's own P&L figures, so it is by construction the exact rate the
   sheet used: EGP costs ÷ (costs-in-USD − USD-native costs). Falls back to the current rate only
   for a month with no EGP costs to divide by. */
var __rateCache={};
function rateFor(mo){
  if(!mo) return fx();
  if(__rateCache[mo]) return __rateCache[mo];
  var egp=0,usd=0,rev=0,net=0;
  (DATA.meta.flatsOrder||[]).forEach(function(f){
    var p=(DATA.pnl[f]||{})[mo]; if(!p) return;
    rev+=p.revenue.total; net+=p.net;
    (p.costs||[]).forEach(function(c){ if(c.currency==='USD')usd+=c.amount; else egp+=c.amount; });
  });
  var egpInUsd=(rev-net)-usd;
  return (__rateCache[mo] = (egp>0&&egpInUsd>0) ? egp/egpInUsd : fx());
}
function toCur(amount,native,mo){ if(amount==null||isNaN(amount))return amount; if(native===CUR)return amount;
  var r=rateFor(mo||MONTH); return native==='USD'?amount*r:amount/r; }
/* Money only (fmt stays whole-number for counts). Dollars carry 2 decimals: an EGP cost shown in USD
   is small — 20 EGP is $0.41 — and at whole dollars real costs printed as "0". */
function fmtMoney(v){ var d=(CUR==='USD')?2:0;
  return (v<0?'-':'')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function m(v){ if(v==null||isNaN(v))return ''; var z=Math.abs(v)<0.005; return '<span class="'+(z?'zero':(v<0?'neg':''))+'">'+fmtMoney(v)+'</span>'; }
function ribbon(){ var g=DATA._gen?new Date(DATA._gen):null;
  // show the rate THIS month is converted at, not a global one — they differ for every closed month
  $('#rib').innerHTML=authWho()+' · FX '+fmt1(typeof MONTH!=='undefined'&&MONTH?rateFor(MONTH):fx())+' <span style="color:#9a8c8c">('+(DATA.meta.fx.isCurrentMonthSet?'set':'carried')+')</span>'+(g?' · '+g.toLocaleDateString():''); }
function deltaCell(v,p){ if(p==null||isNaN(p))return ''; var d=v-p; if(Math.abs(d)<0.5)return '<span class="muted">—</span>'; var pct=p?Math.round(d/Math.abs(p)*100):null; return '<span class="delta '+(d>0?'up':'down')+'">'+(d>0?'+':'')+fmt(d)+(pct!=null?' ('+(pct>0?'+':'')+pct+'%)':'')+'</span>'; }

  /* Editable for as long as the month is open, and saveable on its own — the rate used to be
     readable only by "Mark final", so recording it and closing the month were the same act and you
     could not put a rate in early or correct one (Sarah 2026-08-14). */
  h+='<div><span class="'+((fxSet||!isOpen)?'ok':'warn')+'">'+((fxSet||!isOpen)?'✓':'!')+'</span> Closing FX '+
     (isOpen?'<input class="fxin" id="fxin" value="'+fmt1(fxOf(MONTH)||fx())+'"> '+
             '<button class="btn sec" id="fxsavebtn" onclick="saveFx()" style="padding:2px 10px;font-size:11px">Save rate</button> '+
             '<span class="muted">EGP/USD '+(fxSet?'':'(carried — confirm)')+'</span> '+
             '<span class="muted" id="fxmsg">'+esc(FXMSG)+'</span>'
            :'used '+fmt1(fxOf(MONTH)||fx()))+'</div>';
  h+='<div><span class="'+(missing?'warn':'ok')+'">'+(missing?'!':'✓')+'</span> '+(missing?'No data this month — check WeShare':'Revenue & costs present')+'</div>';
  h+='<div><span class="ok">✓</span> Reconciled from the sheet (formulas, not the app)</div>';
  h+='<button class="mark" id="markbtn" '+(isOpen?'':'disabled')+' onclick="doMarkFinal()">'+(isOpen?'Mark '+MONTH+' final':MONTH+' is final ✓')+'</button>';
  h+='<p class="muted" id="markmsg" style="margin:8px 0 0">Writes the FX rate + marks the month final in the sheet (and flips the partner view to final).</p></div>';
  return h;
}
function writeCall(fn,params){
  return api(fn, params).then(function(j){ if(!j||!j.ok) throw new Error(j&&j.error||'write failed'); return j; });
}
function doMarkFinal(){
  var btn=document.getElementById('markbtn'), msg=document.getElementById('markmsg'), fxEl=document.getElementById('fxin');
  var rate=fxEl?fxEl.value.trim().replace(/,/g,''):'';
  if(btn)btn.disabled=true; if(msg)msg.textContent='Closing '+MONTH+'…';
  var params={month:MONTH}; if(rate)params.rate=rate;
  writeCall('props_mark_final',params).then(function(){ boot(); }).catch(function(e){ if(msg)msg.textContent='Could not close: '+e.message; if(btn)btn.disabled=false; });
}

/* 4b — Compare all flats: LANDSCAPE (wide, scrolls on mobile) */
function renderCompare(){
  var flats=DATA.meta.flatsOrder, pm=prevMonth(MONTH), costKeys=[];
  for(var i=0;i<flats.length;i++){var r=DATA.pnl[flats[i]][MONTH];if(r){costKeys=r.costs.map(function(c){return{key:c.key,label:c.label.replace(/\s*\((EGP|USD)\)/,''),cur:c.currency};});break;}}
  var h='<div class="frame land"><span class="orient o-land">landscape · wide table</span><div class="card cmp-wrap"><h1>Compare · '+MONTH+'</h1><p class="sub">all flats · all values in '+CUR+' · Δ vs '+pm+'</p><table class="cmp"><thead><tr><th>Line</th>';
  flats.forEach(function(f){h+='<th>'+f+'</th>';}); h+='<th>Total</th><th>Δ</th></tr></thead><tbody>';
  h+=csec('Revenue',flats.length);
  h+=cmp('Earnings',flats,pm,function(r){return r?r.revenue.earnings:0;},'USD');
  h+=cmp('Other',flats,pm,function(r){return r?r.revenue.other:0;},'USD');
  h+=cmp('Total revenue',flats,pm,function(r){return r?r.revenue.total:0;},'USD','tot');
  h+=csec('Costs',flats.length);
  costKeys.forEach(function(ck){ h+=cmp(ck.label,flats,pm,function(r){if(!r)return 0;var c=r.costs.find(function(x){return x.key===ck.key;});return c?c.amount:0;},ck.cur); });
  h+=cmp('Net',flats,pm,function(r){return r?r.net:0;},'USD','net');
  h+=csec('Attribution',flats.length);
  h+=cmp('Khaled',flats,pm,function(r){return r&&r.attribution?r.attribution.khaled:0;},'USD','attr');
  h+=cmp('Sarah',flats,pm,function(r){return r&&r.attribution?r.attribution.sarah:0;},'USD','attr');
  h+='</tbody></table></div>';
  h+='<div class="card"><p class="muted">Attribution is a view, not a settlement — cash lives in WeShare. 8A / 28A / Zayed split net 50/50; 17A is Khaled 20% of revenue, Sarah the rest; 17B is 100% Sarah (long-let).</p></div></div>';
  return h;
}
function csec(t,n){ return '<tr class="sec"><td colspan="'+(n+3)+'">'+t+'</td></tr>'; }
function cmp(label,flats,pm,getNative,native,cls){
  var row='<tr'+(cls?' class="'+cls+'"':'')+'><td>'+label+'</td>',tot=0,ptot=0;
  flats.forEach(function(f){ var v=toCur(getNative(DATA.pnl[f][MONTH]),native), pv=toCur(getNative(DATA.pnl[f][pm]),native,pm); tot+=v||0; ptot+=pv||0; row+='<td>'+m(v)+'</td>'; });
  row+='<td><b>'+m(tot)+'</b></td><td>'+deltaCell(tot,ptot)+'</td></tr>';
  return row;
}

AUTH_ON_LOGIN = boot; if (authGuard()) boot();   // signed in → load now; otherwise the sign-in form loads it
