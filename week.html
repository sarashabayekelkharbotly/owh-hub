<script src="auth.js"></script>
<script>
/* CONFIG (ENDPOINT + session) lives in auth.js — no shared secret in this file */
var DEFAULT_IN = "15:00";

/* ---------- state ---------- */
var D=null, DAYMS=86400000, weekStart=null, cleans=[], cleans2=[], dirty=false, STAYS=[];
function day(s){ return new Date(String(s).slice(0,10)+'T00:00:00'); }
function ymd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function dm(d){ return d.getDate()+'/'+(d.getMonth()+1); }
function addD(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function hm(t){ return (t||'').toString().slice(0,5); }
function short(s){ return (s||'').toString().trim().split(' ')[0]; }
function isLive(s){ var st=(s.status||'').toLowerCase(); return st.indexOf('cancel')<0 && st.indexOf('block')<0; }
function esc(s){ return (s||'').toString().replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function airbnbFlats(){ return D.meta.flatsOrder.filter(function(f){ return D.targets.byFlat[f]; }); }
function longLets(){ return (D.flats||[]).filter(function(f){ return f.isLongLet; }).map(function(f){ return f.id; }); }
function codeOf(d){ return ('0'+d.getDate()).slice(-2)+('0'+(d.getMonth()+1)).slice(-2); }

/* RULE — logical stays: contiguous same-guest bookings (checkout = next check-in) are one continuous
   stay for CLEANING + occupancy (a same-guest extension gets no clean between). Revenue is untouched
   (that's sheet-side, per booking). STAYS holds the merged set used by all cleaning/occupancy logic. */
function mergeStays(stays){
  var live=(stays||[]).filter(function(s){ return isLive(s)&&s.checkIn&&s.checkOut; })
    .slice().sort(function(a,b){ return a.flat<b.flat?-1:(a.flat>b.flat?1:(a.checkIn<b.checkIn?-1:1)); });
  var out=[], acc=null;
  live.forEach(function(s){
    if(acc && acc.flat===s.flat && acc.guest===s.guest && acc.checkOut===s.checkIn){
      acc.checkOut=s.checkOut; acc.nights=Math.round((day(acc.checkOut)-day(acc.checkIn))/DAYMS);
      acc.guests=Math.max(acc.guests||1,s.guests||1); acc.allIn=(acc.allIn||0)+(s.allIn||0); acc.ids.push(s.id);
    } else { if(acc)out.push(acc);
      acc={ id:s.id, ids:[s.id], flat:s.flat, portal:s.portal, status:s.status, guest:s.guest,
            checkIn:s.checkIn, checkOut:s.checkOut, nights:s.nights, guests:s.guests, allIn:s.allIn, booked:s.booked }; }
  });
  if(acc)out.push(acc);
  return out;
}
/* GUARD — STAYS (merged) = CLEANING / OCCUPANCY only. rawStays() (per booking) = MONEY / CHANNEL /
   PAYMENT / STATISTICS. Never aggregate revenue-by-channel or -by-payment off the merged view. */
function rawStays(){ return D.stays || []; }

/* daily lookups — over the merged (logical) stays */
function outStayOn(f,k){ var o=null; STAYS.forEach(function(s){ if(s.flat===f&&s.checkOut===k)o=s; }); return o; }
function innStayOn(f,k){ var o=null; STAYS.forEach(function(s){ if(s.flat===f&&s.checkIn===k)o=s; }); return o; }
function occStayOn(f,dt){ var o=null; STAYS.forEach(function(s){ if(s.flat!==f)return; if(day(s.checkIn)<=dt&&dt<day(s.checkOut))o=s; }); return o; }
function repairOn(f,k){ var o=null; openRepairs().forEach(function(r){ if(r.flat===f&&r.date===k)o=r; }); return o; }
function nextCheckIn(flat,from){ var next=null; STAYS.forEach(function(s){ if(s.flat!==flat)return; var ci=day(s.checkIn); if(ci>=from&&(!next||ci<next))next=ci; }); return next; }
function prevCheckOut(flat,before){ var last=null; STAYS.forEach(function(s){ if(s.flat!==flat)return; var co=day(s.checkOut); if(co<=before&&(!last||co>last))last=co; }); return last; }
/* door code: while a guest is IN, keep the CURRENT stay's code; else the NEXT arrival's — but only if
   that arrival is within 2 days; if no check-in in the next 2 days, revert to the default 0107 */
function doorCode(flat,dt){ var cur=occStayOn(flat,dt); if(cur) return codeOf(day(cur.checkIn));
  var n=nextCheckIn(flat,dt); if(!n) return '0107';
  if((n-dt)/DAYMS > 2) return '0107';            // no check-in within 2 days → default code
  return codeOf(n); }
function sameDayIn(flat,k){ return innStayOn(flat,k); }
/* THE TIME THE GUEST ACTUALLY GAVE WINS (Sarah 2026-08-18). Dani asks every guest when they are
   arriving and ticks the answer into الكنترول; that answer now rides in the payload as
   arrivals[flat|date]. Everything else here is an assumption — the cleaning row's stored value, or
   the 15:00 house default — so a real answer outranks both, and askedIn() says which it is so the
   grid can mark a confirmed time apart from a guessed one. */
function askedIn(f,k){ return (D&&D.arrivals&&D.arrivals[f+'|'+k])||''; }
function inTimeFor(f,k){ var a=askedIn(f,k); if(a) return hm(a);
  var t=DEFAULT_IN; cleans.forEach(function(c){ if(c.flat===f&&c.date===k&&c.inTime)t=c.inTime; }); return hm(t); }
/* THE WEEK RUNS FRIDAY → THURSDAY (Sarah 2026-08-13). The schedule is built on Thursday, so a
   Saturday-start week cut the plan in half: Thursday sat at the END of the old week and the days
   she was actually planning lived in the next one. Friday-start means "the week ahead" is exactly
   what she sees while planning. getDay(): Sun 0 … Fri 5 · Sat 6, so days-since-Friday = (day+2)%7. */
/* TODAY IS CAIRO'S TODAY, NOT THIS LAPTOP'S (Sarah 2026-08-17). The business runs on Africa/Cairo
   and so does every server rule — confirmCleans keeps "elapsed" days as history using the Cairo
   date. This screen was asking the device, and the two are up to ten hours apart: the codechange
   proposed on a laptop still showing the 16th was refused by a server already on the 17th, silently
   filed as history, and came back unticked on the next load. "It doesn't stick" was exactly right.
   meta.asOf is the server's own date, so the screen and the sheet now agree on which day it is. */
function todayK(){ return (D&&D.meta&&D.meta.asOf) || ymd(day(new Date().toISOString())); }
function todayD(){ return day(todayK()); }
function friOf(d){ var x=new Date(d); x.setDate(x.getDate()-((x.getDay()+2)%7)); return x; }
function defaultWeek(){ var t=todayD(); var wd=t.getDay(); var base=friOf(t);
  if(wd===4) base=addD(base,7);    // Thursday = planning day → open the week that starts tomorrow
  return base; }
function openRepairs(){ return (D.repairs||[]).filter(function(r){ return r.status==='open'; }); }
function cleansForDay(f,k){ var o=[]; cleans.forEach(function(c,idx){ if(c.flat===f&&c.date===k)o.push({c:c,idx:idx}); }); return o; }
function primaryClean(list){ for(var i=0;i<list.length;i++)if(list[i].c.type==='checkout')return list[i]; return list[0]; }

/* ---------- proposal engine (same rules as Today / RULE A6) ---------- */
/* 📌 THE PINNED DAY WINS (Sarah 2026-08-21). The mechanical rule — ci+6, then weekly — lands on
   whatever weekday the check-in dictates: Iman arrived on a Friday, so the engine proposed
   Thursdays forever, and every re-proposal regenerated them however often Sarah moved them to the
   Friday Iman actually asked for. A stay with a pin in D.cleanPrefs gets its weeklies ON that
   weekday: first occurrence at least 4 nights in, last at least 5 before checkout — the same
   spacing the mechanical rule keeps. Proposals then land exactly on the confirmed rows, so the
   phantom Thursday twins stop appearing. */
function cleanPref(s){ var p=(D&&D.cleanPrefs)||{}; var v=p[s.id]; return (v===0||v>0)?Number(v):null; }
function cleanPlan(s){ var N=s.nights||0; if(N<=12||!s.checkIn)return []; var ci=day(s.checkIn),plan=[],j=0;
  var pin=cleanPref(s);
  if(pin!==null){
    var d0=addD(ci,4); while(d0.getDay()!==pin) d0=addD(d0,1);        // first pinned weekday ≥ ci+4
    for(var d=d0; (day(s.checkOut)-d)/DAYMS>=5; d=addD(d,7),j++) plan.push({d:d,type:j===0?'midstay':'weekly'});
    return plan;
  }
  for(var off=6; N-off>4; off+=7,j++){ var dd=addD(ci,off); plan.push({d:dd,type:j===0?'midstay':'weekly'}); } return plan; }
function mk(flat,d,type,s){
  var k=ymd(d), inn=(type==='checkout')?sameDayIn(flat,k):null;
  return { date:k, flat:flat, type:type, time:'12:00', code:doorCode(flat,d),
           inTime: inn?DEFAULT_IN:'', stayId:s?s.id:'', booked:s?String(s.booked||'').slice(0,10):'',
           on:true, src:'auto', cleaner:'amal' };
}
/* who cleans (2026-08-03): أمل = in-house (salary, no per-session row) · جيني = paid per session →
   confirming writes a pending WeShare row per جيني session (payer default Sarah) */
var CLEANERS=['amal','jinny','both'];
var CLEANER_LBL={ amal:'أمل', jinny:'جيني', both:'أمل + جيني' };
function proposeWeek(ws){
  var we=addD(ws,7), out=[];
  function inWk(d){ return d>=ws && d<we; }
  airbnbFlats().forEach(function(f){
    STAYS.forEach(function(s){ if(s.flat!==f)return;
      var co=day(s.checkOut);
      if(inWk(co)) out.push(mk(f,co,'checkout',s));
      cleanPlan(s).forEach(function(p){ if(inWk(p.d)) out.push(mk(f,p.d,p.type,s)); });
    });
    STAYS.forEach(function(s){ if(s.flat!==f)return;
      var ci=day(s.checkIn), pco=prevCheckOut(f,ci); if(!pco)return;
      var gap=Math.round((ci-pco)/DAYMS);
      if(gap>2){ var rev=addD(ci,-1); if(inWk(rev)) out.push(mk(f,rev,'revision',s)); }
    });
    /* AN ARRIVAL NOBODY WILL LET IN (Sarah 2026-08-16). A WhatsApp line was not enough: Emad's
       schedule, Dani's comms grid and الكنترول all read the Cleaning schedule, so an arrival with
       no visit carrying its code existed nowhere they could see it — Mona was sent the old 0107.
       The week now PROPOSES the trip, so confirming it puts a real row in front of all three. Test
       is the code, matching الكنترول's watcher exactly: covered only when some confirmed visit in
       the two-day window carries this arrival's code. */
    STAYS.forEach(function(s){ if(s.flat!==f)return;
      var ci=day(s.checkIn), co=day(s.checkOut), tk=todayK(), td=todayD();
      /* The trip is dated THE DAY IT BELONGS TO — the arrival day — even when that day has passed
         (Sarah 2026-08-17: "the code change happened on the 16th not the 17th"). Recording it today
         would put a true event on a false date. The server accepts a past-dated line as long as
         nothing is already filed for that day+flat+type, so history gains a record without any
         existing one being restated.
         The catch-up reaches back ONE day, no further: 8A's guest checked in on the 11th with no
         visit carrying 1108 and has been inside ever since — they plainly got in, and changing a
         lock under a settled guest locks them out. */
      var when = (ci>=td || (co>td && (td-ci)/DAYMS<=1)) ? ci : null;
      if(!when||!inWk(when)) return;
      /* THE REVISION OWNS THE ARRIVAL (Sarah 2026-08-21: Mohannad, 8A 28/08 — "they should have
         been a revision clean including a lockcode change", not a bare code trip). When the gap
         since the previous checkout is >2 days, the ci−1 revision is already the designated visit
         and it CARRIES the code (§5.5, waLine prints it). Proposing a codechange beside it offered
         Sarah two trips for one arrival — and because the revision lives in the PREVIOUS week's
         list, on next week's screen the codechange was the only one visible and read as the plan.
         The codechange stays for what it was built for: an arrival close behind a checkout that
         already happened with the wrong code (Mona), where no future revision exists to carry it. */
      var pcoC=prevCheckOut(f,ci);
      if(pcoC && Math.round((ci-pcoC)/DAYMS)>2 && ymd(addD(ci,-1))>=tk) return;
      var need=codeOf(ci), from=ymd(addD(ci,-2)), upto=(ci>=td)?ymd(ci):tk;
      /* A HAND-SET CODE IS COVERAGE (Sarah 2026-08-22: she set 2108 deliberately and the engine
         kept generating 2208 beside it — her decision lost to the default). The DDMM code is only
         a DEFAULT; a visit whose code Sarah edited by hand covers the arrival with whatever she
         chose, and proposing the mechanical code next to it manufactures a second trip and a
         second task for Emad. */
      var set=(D.cleans||[]).some(function(c){ return c.flat===f&&c.date>=from&&c.date<=upto&&
        ((c.code||'')===need || (c.codeEdited && ['codechange','revision','checkout'].indexOf(c.type)>-1)); });
      if(!set) out.push(mk(f,when,'codechange',s));
    });
  });
  out.sort(function(a,b){ return (a.date+a.flat)<(b.date+b.flat)?-1:1; });
  return out;
}
function ckey(c){ return c.date+'|'+c.flat+'|'+c.type; }
/* A MOVED ROW IS STILL THE SAME TRIP (Sarah 2026-08-22: she moved 28A's checkout clean to 30/08 to
   stage the staff — the guest still leaves the 29th — and every reload re-added the engine's 29/08
   proposal, "the old version comes back"). Proposals match by exact date, so an edited date makes
   the original look missing. A proposal is therefore suppressed when a row for the SAME STAY and
   TYPE already exists nearby — she did not reject that trip, she rescheduled it, and her date wins.
   Windows: ±3 days for the weekly rhythm, ±7 for one-off trips (checkout/revision/codechange). */
/* THE LEGITIMATE RANGE PER TRIP TYPE (Sarah 2026-08-22, verbatim spec — these are business rules,
   not tuning): a checkout clean happens on the departure day or +1 at most, because an apartment
   cannot sit dirty for days; a lockcode change at most 2 days before check-in and NEVER after; a
   revision at most 2 days before check-in; mid-stay/weekly moves ±3 around the rhythm. A manual
   row INSIDE its range is a legitimate rescheduling and covers the trip; a row OUTSIDE it is not a
   preference — it is stale, because only a booking change (extension, cancellation) can put it
   there, and the booking is the referee. */
function validFor_(c,st){
  if(!st) return false;
  if(c.type==='checkout')  return c.date>=ymd(day(st.checkOut)) && c.date<=ymd(addD(day(st.checkOut),1));
  if(c.type==='revision'||c.type==='codechange')

function coveredByExisting_(p,list){

    var ok=(p.type==='midstay'||p.type==='weekly')
      ? Math.abs((day(c.date)-day(p.date))/DAYMS)<=3      // the rhythm bends ±3

/* SUPPRESSED ≠ INVISIBLE (Sarah 2026-08-22: "the proposals are included somewhere so that i can see
   if there is a conflict… they stay dimmed, unless something changes i can turn it on"). A proposal
   whose trip Sarah rescheduled joins the list as a SHADOW: off, dimmed, labelled with the manual row
   it defers to. It never reaches the WhatsApp, never auto-switches on, never re-saves into the
   draft (it regrows fresh from the engine every load) — but it is on screen, and one tap turns it
   on if she decides the engine was right after all. */
function shadowOf_(p,match){ p.src='shadow'; p.on=false; p.shadowOf=match.date; return p; }
/* …AND THE BOOKING ITSELF IS THE REFEREE (same message: "if another booking or a booking change —
   an extension or a cancellation — the system doesn't solely rely on my manual inputs which could
   be outdated"). Every ON row with a stay behind it is checked against the CURRENT stays on every
   render: the stay vanished (cancelled) → red; a checkout clean now sits BEFORE the guest actually
   leaves (an extension moved the checkout past her manual date) → red. Flags only — her row stays
   hers until she acts — but they cannot be missed. */
function findStay_(id){ if(!id) return null;
  for(var i=0;i<STAYS.length;i++){ var s=STAYS[i];
    if(s.id===id || (s.ids&&s.ids.indexOf(id)>-1)) return s; }

/* A BOOKING CHANGE CHANGES THE CALENDAR — it is not an alert (Sarah 2026-08-22). Rows whose stay
   was cancelled switch OFF; one-off rows pushed outside their legitimate range by an extension or
   a moved arrival switch OFF, and the engine's corrected proposal arrives ON in their place. The
   red banner exists for a different reason: to say the schedule changed underneath what was
   already communicated, so Sarah/Khaled review and RE-CONFIRM. The server does the same
   reconciliation at sync time; this is the same rule applied between syncs, on screen. */
function applyBookingFacts_(list){
  var changed=[];
  list.forEach(function(c){
    if(!c.stayId||c.src==='shadow') return;
    var st=findStay_(c.stayId);
    if(!st){ if(c.on){ c.on=false; c.stale='الحجز اتلغى'; changed.push(c); } return; }
    if((c.type==='checkout'||c.type==='revision'||c.type==='codechange') && !validFor_(c,st) && c.on){
      c.on=false;
      c.stale=(c.type==='checkout')
        ? 'الضيف بيمشي '+ymd(day(st.checkOut))+' — الميعاد ده بقى غلط'
        : 'ميعاد الوصول '+ymd(day(st.checkIn))+' — الميعاد ده بره المدى المسموح';
      changed.push(c);
    }
  });
  return changed;
}
/* A week is a RANGE OF DAYS, never a label (Sarah 2026-08-13). Rows carry the Week key they were
   confirmed under, and the day the week starts on has changed (Saturday → Friday) — so matching on
   that label made every previously confirmed clean invisible the moment the start moved, and let a
   re-confirm write a second row for the same day under the new label. Matching on the DATE heals
   both: old-label rows show up, and the server replaces by date so nothing can double. Two rows for
   the same day+flat+type (one per label) collapse to the LATEST confirm. */
function weekRows(ws){
  var a=ymd(ws), b=ymd(addD(ws,7)), best={};
  (D.cleans||[]).forEach(function(c){
    var k=c.date||''; if(!(k>=a&&k<b)) return;
    var kk=ckey(c), p=best[kk];
    if(!p || (+new Date(c.confirmedAt||0)) >= (+new Date(p.confirmedAt||0))) best[kk]=c;

}
function mergeWeek(ws){
  var confirmed=weekRows(ws);

  /* A visit that has ALREADY HAPPENED is a record, not a plan (Sarah 2026-08-16). Healing re-derives
     the door code from today's bookings, which is right for a trip still to come and wrong for one
     already made: the 15-Aug Zayed checkout was confirmed — and carried out — carrying 0107, then
     Mona booked on the 16th and the heal quietly restated that past trip as 1608. The screen then
     believed her arrival was covered by a visit that had physically set a different code. Elapsed
     days keep the code they were confirmed with; only today-forward heals. */
  var tK=todayK();
  var seen={}, out=confirmed.map(function(c){ seen[ckey(c)]=1;
    // door code is derived from current bookings — recompute so stale values heal on the next
    // confirm. EXCEPT a hand-set code (§5.5): the 'Code edited' flag marks it, and it must stick.
    /* inTime heals like the door code (bug 2026-08-04, the 6-Aug turnover): a booking that landed
       AFTER the week was confirmed left the stored inTime empty, so the WhatsApp never said the
       guest arrives the same day — while a clean confirmed after the booking (7-Aug 17A) did. */
    var healIn = hm(c.inTime) || ((c.type==='checkout'&&sameDayIn(c.flat,c.date)) ? DEFAULT_IN : '');
    return { date:c.date, flat:c.flat, type:c.type, time:hm(c.time)||'12:00',
             code: ((c.codeEdited||c.date<tK)&&(c.code||'').trim()) ? c.code : doorCode(c.flat,day(c.date)),
             codeEdited: !!c.codeEdited,
             inTime:healIn, stayId:c.stayId, on:true, src:'confirmed', cleaner:c.cleaner||'amal' }; });
  /* A BOOKING MADE AFTER THE DECISION ARRIVES SWITCHED ON (Sarah 2026-08-21: Afefy booked 8A on
     the 21st, after the week was confirmed — his 23/08 checkout appeared as an unticked 'new' row
     and never reached the WhatsApp, which read as "not generated at all"). Off-by-default exists
     so a clean Sarah deliberately removed cannot resurrect itself — but she cannot have removed a
     clean for a booking that did not exist when she decided. Booked after the latest confirm →
     on, loud, in the message; booked before → off as ever, because its absence may be a choice. */
  var confD=''; confirmed.forEach(function(c){ var d=String(c.confirmedAt||'').slice(0,10); if(d>confD) confD=d; });
  applyBookingFacts_(out);                        // the booking is the referee — stale rows switch off HERE
  props.forEach(function(p){ if(seen[ckey(p)]) return;
    var cov=coveredByExisting_(p,out);
    if(cov){ out.push(shadowOf_(p,cov)); return; }
    // replacing a row the booking-change just invalidated → arrives ON, it IS the correction
    var repl=out.some(function(c){ return c.stale&&c.stayId===p.stayId&&c.type===p.type; });
    p.src='new'; p.on=repl||!!(p.booked&&confD&&p.booked>=confD); out.push(p); });

function loadWeek(){ cleans=mergeWeek(weekStart); cleans2=mergeWeek(addD(weekStart,7)); dirty=false; }
function weekConfirmedFor(ws){ var at=null;

  return at; }
function weekConfirmed(){ return weekConfirmedFor(weekStart); }
function bookedAfterConfirm(){
  var at=weekConfirmed(); if(!at)return [];
  var ws=weekStart, we=addD(ws,7), cf=new Date(at);
  return rawStays().filter(function(s){ if(!isLive(s)||!s.booked||!s.checkIn||!s.checkOut)return false;   // per-booking arrival detection → rawStays()
    var b=day(s.booked); if(!(b>cf))return false;
    return day(s.checkIn)<we && day(s.checkOut)>ws; });
}

/* ---------- fetch ---------- */
function boot(){
  /* Which week we are on needs only today's date, so the drafts can be asked for BEFORE the payload
     comes back — both requests overlap and the first paint is already complete. The date used here
     is the DEVICE's (no payload yet), so onData re-picks the week once the server's own date has
     arrived; on a laptop in another timezone those are different days. */
  if(!weekStart){ weekStart=defaultWeek(); WEEK_AUTO=true; }
  BOOT_DRAFTS_WK=ymd(weekStart);
  BOOT_DRAFTS=Promise.all([draftRaw(weekStart),draftRaw(addD(weekStart,7))]);
  fetchOnce().then(onData).catch(function(){ setTimeout(function(){ fetchOnce().then(onData).catch(function(e){ showErr(e); }); },800); });
}
function fetchOnce(){ return api('props_get_all',{scope:'live'}).then(function(j){ if(!j||!j.ok)throw new Error(j&&j.error||'bad'); return j; }); }
function onData(j){ D=j.data; STAYS=mergeStays(D.stays);
  if(!weekStart) weekStart=defaultWeek();
  else if(WEEK_AUTO) weekStart=defaultWeek();   // now dated by the server; the user has not paged
  loadWeek();
  loadDrafts().then(function(){ render();
    document.getElementById('rib').innerHTML='data <b>'+new Date().toTimeString().slice(0,5)+'</b>'; }); }
function showErr(e){ document.getElementById('app').innerHTML='<div class="err"><b>Couldn\'t load.</b> '+esc(e.message||e)+'</div>'; }

/* ---------- grid model ---------- */
/* per-day type: a check-out, a cleaning, OR a repair each get their OWN fully-coloured cell (they
   cut a stay's merge); only pure occupied nights merge into a green span */
function dayType(f,days,i){
  var k=ymd(days[i]);
  var cod=cleansForDay(f,k).filter(function(x){ return x.c.on; });   // ACTIVE cleans only — a removed clean leaves no trace on the grid
  var rep=repairOn(f,k);
  /* A repair and a clean on the SAME day used to be a contest the clean always won, so the repair
     disappeared from the grid entirely (Sarah 2026-08-13) — dangerous, because that is exactly the
     day someone must be let in twice. The clean cell now carries the repair too. */
  if(cod.length) return { t:'clean', out:outStayOn(f,k), inn:innStayOn(f,k), list:cod, rep:rep };
  if(rep) return { t:'repair', rep:rep };
  var occ=occStayOn(f,days[i]);
  if(occ) return { t:'stay', stay:occ };
  return { t:'vacant' };
}
function buildRow(f,days){
  var ty=[]; for(var i=0;i<7;i++)ty.push(dayType(f,days,i));
  var segs=[], d=0;
  while(d<7){
    var t=ty[d];
    if(t.t==='stay'){
      var span=1; while(d+span<7 && ty[d+span].t==='stay' && ty[d+span].stay===t.stay) span++;
      segs.push({kind:'stay',stay:t.stay,di:d,span:span}); d+=span;
    } else if(t.t==='clean'){ segs.push({kind:'clean',di:d,out:t.out,inn:t.inn,list:t.list,rep:t.rep}); d++; }
    else if(t.t==='repair'){ segs.push({kind:'repair',di:d,rep:t.rep}); d++; }
    else { segs.push({kind:'vacant',di:d}); d++; }
  }
  return segs;
}

var TYPES=['checkout','revision','midstay','weekly','custom','codechange'];

/* §5.5 lock-code rule. The lockbox code = the check-in date (codeOf) and is physically set by Emad
   during a visit. A checkout clean within 2 days of the next arrival already sets it; a longer gap
   gets the proposed ci−1 revision, which now CARRIES the code. 'codechange' is the standalone
   trip for when no visit covers an arrival — addable by hand, and the WhatsApp emits a derived
   safety-net line for any still-uncovered arrival (see waSection). */
/* A visit covers an arrival only if it will actually SET that arrival's code (Sarah 2026-08-16).
   Two days' proximity is not enough: a visit that has already happened carried whatever code it
   carried on the day, and a booking made after it cannot be served by it. Mona Alqahtani booked
   Zayed 2000 on the morning of her own check-in — the 15-Aug checkout had been and gone, leaving
   the default 0107 — and because that trip sat inside the two-day window the screen called her
   arrival covered and said nothing. A PAST visit therefore only counts when the code it carries is
   already the code this arrival needs; a future visit still counts, because its code heals on the
   next confirm and the person going has not gone yet. */
function coveringVisit(flat,ci){                  // the ON visit (either week) that will set this arrival's code
  var lists=[cleans||[],cleans2||[]], hit=null, tK=todayK(), need=codeOf(ci);
  lists.forEach(function(L){ L.forEach(function(c){
    if(!c.on||c.flat!==flat) return;
    if(isStayClean(c)) return;                    // in-stay cleans can't set the lock (guest is in) — 2026-08-04
    var dd=day(c.date), diff=(ci-dd)/DAYMS;
    if(!(diff>=0&&diff<=2)) return;
    /* A visit already in the past only counts if it actually set THIS arrival's code. The old test
       assumed that code is always DDMM — but a HAND-SET code (✎) IS the arrival's code by decision
       (Amina 2026-08-22: Emad set 2108 yesterday per the schedule, and the cell claimed 2208). */
    if(c.date<tK && !c.codeEdited && (c.code||'')!==need) return;   // already done, and not with this code
    if(!hit||dd>day(hit.date)) hit=c;
  }); });
  return hit;
}
function arrivalCode(flat,ci){ var v=coveringVisit(flat,ci); return v?v.code:codeOf(ci); }
var DAY_AR=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
/* Flat names as written in the ARABIC WhatsApp message. Only names containing real English words
   need an entry — 8A / 17A / 28A / 17B are apartment codes, not words, and read the same in Arabic.
   ⚠️ If Emad calls it 401 (its apartment number) rather than زايد 2000, change the value here. */
var FLAT_AR={ 'Zayed 2000':'زايد 2000' };
function flatAr(f){ return FLAT_AR[f] || f; }
/* Times in the ARABIC message: 12-hour with the part of day named the way it's said in Egypt —
   صباحاً / ظهراً / عصراً / مساءً / ليلاً — not just morning-or-evening (4pm is عصراً, not مساءً,
   and noon is ظهراً, not مساءً). Boundaries below; adjust them here if you'd shift any.
   The app's own UI stays 24-hour, and the time SORT key stays 24-hour too (hm()) — sorting on a
   12-hour string would put "1 مساءً" before "9 صباحاً". Whole hours drop the ":00". */
function partOfDayAr(H){
  if(H < 5)  return 'ليلاً';      // after midnight
  if(H < 12) return 'صباحاً';     // 5:00 – 11:59
  if(H < 15) return 'ظهراً';      // 12:00 – 14:59
  if(H < 18) return 'عصراً';      // 15:00 – 17:59
  return 'مساءً';                 // 18:00 – 23:59
}

  var s=hm(t); if(!s) return '';
  var p=s.split(':'), H=parseInt(p[0],10), M=parseInt(p[1]||'0',10);
  if(isNaN(H)) return s;
  var h12=H%12; if(h12===0) h12=12;
  return h12 + (M ? ':'+('0'+M).slice(-2) : '') + ' ' + partOfDayAr(H);
}

       (c.src==='shadow'?' <span class="badge" style="background:#eee;color:#888" title="الاقتراح الآلي — عندك نسخة معدّلة يوم '+esc(c.shadowOf||'')+'. شغّليه لو الآلي أصح">آلي</span>':'')+

       '<td><input class="codei" value="'+esc(c.code)+'" maxlength="4" onchange="edit('+idx+',\'code\',this.value)" '+
         (c.codeEdited?'style="border-color:#8a6fa8" title="hand-set — will not be recomputed"':'')+'>'+(c.codeEdited?'<span title="hand-set">✎</span>':'')+'</td>'+

  if(DRAFT2_AT) h+='<div class="legend" style="color:#8a6fa8">✎ the second week (from '+dm(addD(ws,7))+

  document.getElementById('app').innerHTML=h;
  /* Fill the WhatsApp box AFTER the HTML is in place, rather than inlining the text in the markup:

/* ---------- interactions ---------- */
/* 📌 pin/unpin a stay's weekly cleaning day — saved on the SERVER so it survives every re-proposal
   and every device. Ticking the same pin again clears it (back to the mechanical rule). */
function pinDay(i){
  var c=cleans[i]; if(!c||!c.stayId) return;
  var wd=day(c.date).getDay(), cur=(D.cleanPrefs||{})[c.stayId];
  var clearing=(cur===wd);
  api('props_clean_pref',{user:(ME&&ME.user)||'',stayId:c.stayId,weekday:clearing?'':String(wd)}).then(function(j){
    if(!j||!j.ok) throw new Error((j&&j.error)||'failed');
    D.cleanPrefs=j.prefs||{};
    loadWeek(); render();
    var m=document.getElementById('cmsg'); if(m) m.textContent=clearing?'📌 الغي التثبيت — رجعنا للقاعدة الآلية':'📌 اتثبّت يوم '+DAY_AR[wd]+' — كل الاقتراحات الجاية هتنزل عليه';
  }).catch(function(e){ var m=document.getElementById('cmsg'); if(m) m.textContent='📌 فشل: '+(e.message||e); });
}
function tog(i){ var c=cleans[i]; c.on=!c.on;
  if(c.on&&c.src==='shadow') c.src='manual';   // an adopted shadow becomes a real row — it must save
  dirty=true; render(); }
function edit(i,field,v){
  var c=cleans[i]; c[field]=v;
  if(field==='code') c.codeEdited=true;                    // §5.5: a hand-set code sticks from now on
  if(field==='date'||field==='flat'||field==='type'){
    var d=day(c.date);
    if(!c.codeEdited) c.code=doorCode(c.flat,d);
    if(c.type!=='checkout') c.inTime='';
    else if(sameDayIn(c.flat,c.date)) c.inTime=c.inTime||DEFAULT_IN;
    else c.inTime='';
    if(c.src==='auto') c.src='manual';
  }
  dirty=true; render();
}
function addClean(){
  var f=document.getElementById('addFlat').value, d=document.getElementById('addDay').value,
      ty=document.getElementById('addType').value, t=document.getElementById('addTime').value;
  var miss=[]; if(!f)miss.push('flat'); if(!d)miss.push('day'); if(!ty)miss.push('type'); if(!t)miss.push('time');
  if(miss.length){ var m=document.getElementById('addmsg');
    if(m){ m.textContent='pick '+miss.join(' · ')+' first — nothing added'; m.style.color='#cc5f5f'; }
    return; }
  var dup=cleans.filter(function(c){ return c.date===d&&c.flat===f&&c.type===ty&&c.on; }).length;
  if(dup && !confirm(f+' already has a '+ty+' on '+d+' — add a second one?')) return;
  var inn=(ty==='checkout')?sameDayIn(f,d):null, inTime='';
  if(inn){ inTime=prompt('Same-day check-in ('+(inn.guest||'guest')+') — what time does the guest arrive?',DEFAULT_IN)||DEFAULT_IN; }
  cleans.push({ date:d, flat:f, type:ty, time:t, code:doorCode(f,day(d)), inTime:inTime, stayId:inn?inn.id:'', on:true, src:'manual', cleaner:'amal' });
  cleans.sort(function(a,b){ return (a.date+a.flat)<(b.date+b.flat)?-1:1; });
  dirty=true; render();
}

/* ---------- WhatsApp: two-week, bold, no blank lines; in-stay clean = نظافة اثناء وجود ضيف (once);
   code only on check-out; same-day arrival appends دخول ضيف ---------- */
function isStayClean(c){ return c.type==='midstay'||c.type==='weekly'||(c.type==='custom'&&occStayOn(c.flat,day(c.date))); }
/* TWO AUDIENCES, ONE SCHEDULE (Sarah 2026-08-21: "i have to always manually delete from the screen
   the lockcode and the repairs because they are not shared with Amal"). عماد gets everything —
   codes, code-change trips, repairs. أمل gets the cleaning schedule alone: what, where, when, who
   cleans, when the guest walks in — never a lock code and never a repair, because those are not
   hers to know. The toggle above the box picks the audience; edits are kept per week PER AUDIENCE. */
var WA_AUD=(function(){ try{ return localStorage.getItem('owh_wa_aud')||'emad'; }catch(e){ return 'emad'; } })();
function setWaAud(a){ WA_AUD=a; try{ localStorage.setItem('owh_wa_aud',a); }catch(e){} render(); }
function waForAmal(){ return WA_AUD==='amal'; }
function waLine(c){
  // §5.5: the standalone code-change trip — approved wording, no cleaning implied.
  /* «غدا» was hardcoded from when this trip always sat the day BEFORE the arrival. Since 2026-08-16
     the proposal lands ON the arrival day (and the catch-up can too), so the message said a guest
     comes tomorrow who was walking in that same day (Sarah 2026-08-21). Worded relative to the
     VISIT's date now: same day · tomorrow · or the named day. */
  if(c.type==='codechange'){
    if(waForAmal()) return '';
    var nn=nextCheckIn(c.flat,day(c.date)), dfC=nn?Math.round((nn-day(c.date))/DAYMS):null;
    var whenTxt=dfC===0?'نفس اليوم':dfC===1?'غدا':(nn?'يوم '+DAY_AR[nn.getDay()]+' '+dm(nn):'');
    return '• شقة '+flatAr(c.flat)+': تغيير كود الباب إلى '+c.code+(whenTxt?' — دخول ضيف '+whenTxt:'')+'\n';
  }
  var label = isStayClean(c) ? 'نظافة اثناء وجود ضيف'
            : c.type==='checkout' ? 'تنظيف خروج'
            : c.type==='revision' ? 'إعادة' : 'تنظيف إضافي';
  var t='• شقة '+flatAr(c.flat)+': '+label+' الساعة '+hmAr(c.time);
  t+=' — النظافة: '+CLEANER_LBL[c.cleaner||'amal'];               // من ينظف — أمل / جيني / الاثنين (2026-08-03)
  if(!waForAmal()){
    if(c.type==='checkout') t+=' — كود الباب '+c.code;
    /* §5.5: a non-checkout visit covers an arrival within 2 days → it carries the code change —
       but NEVER an in-stay clean (Sarah 2026-08-04): while a guest is in, the lock keeps THEIR
       code, so a mid-stay/custom clean can't announce a future guest's code. The uncovered
       arrival then gets its own standalone code-change line via waCodeFallback. */
    else if(!isStayClean(c)){ var n=nextCheckIn(c.flat,day(c.date));
          if(n&&(n-day(c.date))/DAYMS<=2) t+=' — تغيير كود الباب إلى '+c.code; }
  }
  if(c.inTime) t+=' — دخول ضيف الساعة '+hmAr(c.inTime);
  return t+'\n';
}
/* §5.5 safety net: an arrival TOMORROW with no ON visit in the 2 days before it means nobody is
   scheduled to set the guest's code — emit the code-change line anyway, derived at message time so
   toggling a revision off can never silently drop the arrival's code. */
/* The safety-net line for an arrival no visit will serve. It used to look only at TOMORROW, so a
   booking that lands on its own check-in day could never produce one: the day before is elapsed and
   elapsed days are skipped entirely (Sarah 2026-08-16). Today's arrivals are now checked in today's
   own section, worded النهارده and marked ⚠️ — it is the same trip, but it is late. No duplication:
   the "tomorrow" line for today's arrival would have lived in yesterday's section, which is never
   printed. */
function waCodeFallback(d){
  var out='', k0=ymd(d), tK=todayK(), k1=addD(d,1);
  function lines(target, word, warn){
    airbnbFlats().forEach(function(f){
      STAYS.forEach(function(s){
        if(s.flat!==f||day(s.checkIn).getTime()!==target.getTime()) return;
        if(coveringVisit(f,target)) return;
        out+=(warn?'⚠️ ':'')+'• شقة '+flatAr(f)+': تغيير كود الباب إلى '+arrivalCode(f,target)+' — دخول ضيف '+word+'\n';
      });
    });
  }
  if(k0===tK) lines(d, 'النهارده', true);
  lines(k1, 'غدا', false);
  return out;
}
/* Every line starts with an invisible RIGHT-TO-LEFT MARK: WhatsApp aligns each line by its first
   strong character, so a line starting with "8A" flips to the left while Arabic lines sit right —
   the zigzag Sarah saw. The mark sits BEFORE the *bold* asterisk, so formatting is untouched. */
/* The RTL mark alone is NOT enough (the Telegram lesson, relearned here 2026-08-21: "the last line
   does not have the proper right to left direction"). A line whose tail is Latin or digits — a
   flat token, a code, a time — lets the renderer flip the ending however the mark opened it. Every
   Latin/digit run is wrapped in its own LTR isolate (U+2066…U+2069) so it reads left-to-right
   INSIDE a line that stays right-to-left. Idempotent: old marks/isolates are stripped first, so
   regenerating never stacks them. */
function waRtl(t){
  return t.split('\n').map(function(l){
    if(!l) return l;
    l=l.replace(/^‏+/,'').replace(/[⁦⁩]/g,'');
    l=l.replace(/[A-Za-z0-9][A-Za-z0-9:.\/\- ]*[A-Za-z0-9]|[A-Za-z0-9]/g,function(m){ return '⁦'+m+'⁩'; });
    return '‏'+l;
  }).join('\n');
}
function waSection(ws,list){
  var days=[]; for(var i=0;i<7;i++)days.push(addD(ws,i));
  var todayW=todayK();
  var on=list.filter(function(c){return c.on;}), reps=waForAmal()?[]:openRepairs();   // repairs are Emad's, never Amal's
  /* Pass 1 — gather each day's lines. Done BEFORE the title so the title can name the first and
     last day that actually has work: a heading reading "من السبت … إلى الجمعة" when nothing happens
     until Monday and nothing after Wednesday just confuses the reader. */
  var perDay=[];
  days.forEach(function(d){
    var k=ymd(d);
    /* mid-week regenerate (2026-08-03): elapsed days are history, not instructions — the message
       starts from today and the title follows (the sheet keeps the past rows untouched) */
    if(k<todayW){ perDay.push(null); return; }
    var dayCleans=on.filter(function(c){return c.date===k;}), dayReps=reps.filter(function(r){return r.date===k;});
    var fallback=waForAmal()?'':waCodeFallback(d);                      // §5.5 — code lines are Emad-only
    if(!dayCleans.length&&!dayReps.length&&!fallback){ perDay.push(null); return; }
    /* Everything on one day is ordered BY TIME — cleans and repairs interleaved, not cleans
       first then repairs. hm() gives zero-padded HH:MM so a plain string sort is correct;
       an entry with no time sorts last (99:99) rather than jumping to the top. */
    var items=[];
    dayCleans.forEach(function(c){ items.push({ at: hm(c.time) || '99:99', line: waLine(c) }); });
    dayReps.forEach(function(r){
      var line='• شقة '+flatAr(r.flat)+': صيانة '+r.trade+(r.time?' الساعة '+hmAr(r.time):'')+(r.what?' — '+r.what:'');
      if(occStayOn(r.flat,d)) line+=' — الضيف موجود';
      items.push({ at: hm(r.time) || '99:99', line: line+'\n' });
    });
    items.sort(function(a,b){ return a.at<b.at?-1:(a.at>b.at?1:0); });
    perDay.push({ d: d, lines: items.map(function(it){ return it.line; }).join('')+fallback });
  });

  var firstI=-1, lastI=-1;
  for(var i=0;i<7;i++) if(perDay[i]){ if(firstI<0) firstI=i; lastI=i; }

  // nothing scheduled → keep the full Fri→Thu span so the reader still knows which week it is
  if(firstI<0) return waRtl('*جدول النظافة — من '+DAY_AR[days[0].getDay()]+' '+dm(days[0])+
                      ' إلى '+DAY_AR[days[6].getDay()]+' '+dm(days[6])+'*\nلا توجد نظافة مجدولة.\n');

  /* One working day in the span → name the day, not a from/to (it read "من الجمعة 21/8 إلى الجمعة
     21/8", which looks like a mistake in a message Emad and the cleaners read). */
  var t=(firstI===lastI)
        ? '*جدول النظافة — '+DAY_AR[days[firstI].getDay()]+' '+dm(days[firstI])+'*\n'
        : '*جدول النظافة — من '+DAY_AR[days[firstI].getDay()]+' '+dm(days[firstI])+
          ' إلى '+DAY_AR[days[lastI].getDay()]+' '+dm(days[lastI])+'*\n';
  for(var j=firstI;j<=lastI;j++){
    if(!perDay[j]) continue;
    t+='*'+DAY_AR[perDay[j].d.getDay()]+' '+dm(perDay[j].d)+':*\n'+perDay[j].lines;
  }
  return waRtl(t);
}

/* ---------- WhatsApp edits are KEPT, per week ----------
 * The message spans two weeks. Edits are stored against the week they belong to (not against the
 * whole message), so a note typed while looking at week N is still there when week N is the SECOND
 * half of the message on week N-1, and when it's the FIRST half on week N. That mirroring is the
 * point: notes written by hand must never vanish because you paged to another week.
 * Stored in localStorage, so a reload keeps them too. Only "Regenerate" discards them, and only
 * for the two weeks on screen. */
var WA_KEY='owh_wa_edits';
function waEdits(){ try{ return JSON.parse(localStorage.getItem(WA_KEY)||'{}')||{}; }catch(e){ return {}; } }
function waEditsSave(o){ try{ localStorage.setItem(WA_KEY,JSON.stringify(o)); }catch(e){} }
var WA_MARK='*جدول النظافة';
/* Split the edited message back into its two week-sections on the section heading. Falls back to
   treating the whole thing as week 1 rather than losing text. */
function waSplit(txt){
  var first=txt.indexOf(WA_MARK);
  var second=first<0?-1:txt.indexOf(WA_MARK,first+WA_MARK.length);
  if(second<0) return [txt];
  return [txt.slice(0,second).replace(/\s+$/,'')+'\n', txt.slice(second)];
}
function waAudKey(ws){ return ymd(ws)+(waForAmal()?'|amal':''); }   // legacy keys stay Emad's, so old notes survive
function waSectionText(ws,list){
  var k=waAudKey(ws), e=waEdits();
  return (typeof e[k]==='string' && e[k].length) ? e[k] : waSection(ws,list);
}
function waText(){
  return waSectionText(weekStart,cleans)+'\n'+waSectionText(addD(weekStart,7),cleans2);   // blank line between the two weeks
}
/* Called on every keystroke in the textarea — stores each half against its own week. */
function waCapture(){
  var ta=document.getElementById('wa'); if(!ta) return;
  var parts=waSplit(ta.value), e=waEdits();
  e[waAudKey(weekStart)]=parts[0];
  if(parts.length>1) e[waAudKey(addD(weekStart,7))]=parts[1];
  waEditsSave(e);
  var m=document.getElementById('wamsg'); if(m) m.textContent='edits kept';
}
/* Rebuild from the schedule, discarding saved notes for the two weeks on screen only. */
function regenWa(){
  if(!confirm('Rebuild the message from the schedule?\n\nAny notes you typed for these two weeks will be lost.')) return;
  var e=waEdits(); delete e[waAudKey(weekStart)]; delete e[waAudKey(addD(weekStart,7))]; waEditsSave(e);
  document.getElementById('wa').value=waText();
  var m=document.getElementById('wamsg'); if(m){ m.textContent='rebuilt from the schedule'; setTimeout(function(){ m.textContent=''; },4000); }
}
function copyWa(){
  var ta=document.getElementById('wa'); ta.select();
  var done=function(ok){ document.getElementById('wamsg').textContent=ok?'copied ✓':'select & copy manually'; };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(function(){done(true);},function(){ done(document.execCommand('copy')); }); }
  else done(document.execCommand('copy'));
}
/* ---------- drafts (2026-08-03): the full editing state, server-side per week ---------- */
var DRAFT_AT=null, DRAFT2_AT=null;   // DRAFT2_AT: the NEXT week is on the message too, from its own draft
var BOOT_DRAFTS=null, BOOT_DRAFTS_WK='';   // both drafts, requested at boot in parallel with the payload
var WEEK_AUTO=false;                       // the week was picked for her, not chosen — re-pick it on the server's date
function draftPayload(){
  return cleans.filter(function(c){ return c.src!=='shadow'; }).map(function(c){ return { date:c.date, flat:c.flat, type:c.type, time:hm(c.time), code:c.code,
    codeEdited:!!c.codeEdited, inTime:hm(c.inTime), stayId:c.stayId, cleaner:c.cleaner||'amal', on:!!c.on, src:c.src }; });
}
function saveDraft(){
  return api('props_save_draft',{user:(ME&&ME.user)||'',week:ymd(weekStart),cleans:JSON.stringify(draftPayload())})
    .then(function(j){ if(!j||!j.ok)throw new Error(j&&j.error||'bad'); DRAFT_AT=new Date().toISOString(); dirty=false; });
}
function saveDraftBtn(){
  document.getElementById('cmsg').textContent='saving draft…';
  saveDraft().then(function(){ render(); document.getElementById('cmsg').textContent='draft saved ✓ (no alerts sent)'; })
    .catch(function(e){ document.getElementById('cmsg').textContent='draft failed: '+(e.message||e); });
}
/* A restored draft heals + merges like a normal load (bug 2026-08-04: a draft froze the state
   from BEFORE a booking landed — empty guest-in times and missing proposal cleans survived
   every Regenerate, because the draft replaced the healed list verbatim). Hand-set codes and
   everything the draft says stay; only derived facts refresh, and new bookings' proposed
   cleans appear as off-by-default 'new' rows, exactly like mergeWeek. */
function healDraftList(ws,list,savedAt){
  var out=list.map(function(c){
    c.on=(c.on!==false); c.cleaner=c.cleaner||'amal';
    if(!c.codeEdited && (c.src!=='manual')) c.code=doorCode(c.flat,day(c.date));
    if(!hm(c.inTime) && c.type==='checkout' && sameDayIn(c.flat,c.date)) c.inTime=DEFAULT_IN;
    return c;
  });
  var seen={}; out.forEach(function(c){ seen[ckey(c)]=1; });
  // same rule as mergeWeek: a stay booked AFTER this draft was saved cannot have been rejected
  // by it — its cleans arrive ON (Sarah 2026-08-21, the Mohannad revision that a stale draft hid)
  var savD=String(savedAt||'').slice(0,10);
  applyBookingFacts_(out);
  proposeWeek(ws).forEach(function(p){ if(seen[ckey(p)]) return;
    var cov=coveredByExisting_(p,out);
    if(cov){ out.push(shadowOf_(p,cov)); return; }
    var repl=out.some(function(c){ return c.stale&&c.stayId===p.stayId&&c.type===p.type; });
    p.src='new'; p.on=repl||!!(p.booked&&savD&&p.booked>=savD); out.push(p); });
  out.sort(function(a,b){ return (a.date+a.flat)<(b.date+b.flat)?-1:1; });
  return out;
}
function draftRaw(ws){        // the stored draft, or null — no judgement, the payload may not be here yet
  return api('props_get_draft',{week:ymd(ws)})
    .then(function(j){ return (j&&j.ok&&j.draft&&j.draft.cleans&&j.draft.cleans.length)?j.draft:null; })
    .catch(function(){ return null; });
}
function applyDraft(ws,d,second){
  if(!d) return false;
  var confAt=weekConfirmedFor(ws);
  if(confAt && new Date(d.savedAt) <= new Date(confAt)) return false;   // an older draft never beats a newer confirm
  if(second){ cleans2=healDraftList(ws,d.cleans,d.savedAt); DRAFT2_AT=d.savedAt; }
  else      { cleans =healDraftList(ws,d.cleans,d.savedAt); DRAFT_AT =d.savedAt; dirty=false; }
  return true;
}
/* ONE paint, not two (Sarah 2026-08-14: "whenever i refresh i see the old version first and then it
   refreshes to the new version"). The screen used to render from the sheet and re-render when the
   draft landed, so every reload flashed a week that was missing your unconsigned work — long enough
   to read, and long enough to copy the wrong message. Both draft calls now fly ALONGSIDE the
   payload (boot launches them before the fetch) and the first render waits for them; they are tiny
   next to props_get_all, so nothing got slower. Paging between weeks still paints immediately —
   there the old content is visibly a different week, not a stale version of this one.
   The SECOND week's draft matters as much as the first: it is half the WhatsApp. */
function loadDrafts(){
  DRAFT_AT=null; DRAFT2_AT=null;
  var ws=weekStart, ws2=addD(ws,7), late=false;
  // the boot pair is only usable if it was asked for THIS week (onData may have re-picked it)
  var got=(BOOT_DRAFTS&&BOOT_DRAFTS_WK===ymd(ws))?BOOT_DRAFTS:Promise.all([draftRaw(ws),draftRaw(ws2)]); BOOT_DRAFTS=null;
  var p=got.then(function(ds){
    if(ws!==weekStart) return;                       // paged again while waiting — a stale answer must not land
    applyDraft(ws,ds[0],false); applyDraft(ws2,ds[1],true);
    if(late) render();                               // arrived after we stopped holding the page
  }).catch(function(){});
  // a hung draft call must never leave the screen on "Loading…" — give up holding after 6s
  return Promise.race([p,new Promise(function(r){ setTimeout(function(){ late=true; r(); },6000); })]);
}
function confirmWeek(){
  var btn=document.getElementById('confirmBtn'); btn.disabled=true;
  document.getElementById('cmsg').textContent='confirming…';
  var payload=cleans.filter(function(c){return c.on;}).map(function(c){
    return { date:c.date, flat:c.flat, type:c.type, time:hm(c.time), code:c.code, codeEdited:!!c.codeEdited, inTime:hm(c.inTime), stayId:c.stayId, cleaner:c.cleaner||'amal' }; });
  api('props_confirm_cleans',{user:(ME&&ME.user)||'',week:ymd(weekStart),cleans:JSON.stringify(payload)}).then(function(j){
    if(!j||!j.ok)throw new Error(j&&j.error||'bad');
    DRAFT_AT=null;
    var jy=j.result&&j.result.jinny;
    // no telegram for jinny money (2026-08-04) — this line + WeShare's pending list are the record
    var sk=(j.result&&j.result.skipped)||[], lt=(j.result&&j.result.late)||[];
    document.getElementById('cmsg').textContent='confirmed ✓ ('+j.result.count+' cleans'+
      (lt.length?' · recorded '+lt.length+' past visit: '+lt.join(', '):'')+
      (sk.length?' · '+sk.length+' past day already on record: '+sk.join(', '):'')+
      (jy&&jy.created.length?' · '+jy.created.length+' جيني → WeShare pending':'')+
      (jy&&jy.locked.length?' · ⚠️ '+jy.locked.length+' cancelled جيني already confirmed in WeShare — fix there by hand':'')+')';
    return fetchOnce().then(onData);
  }).catch(function(e){ btn.disabled=false; document.getElementById('cmsg').textContent='failed: '+ (e.message||e); });
}
/* switching weeks silently keeps your work as a draft — no prompt, no alert (Sarah 2026-08-03) */
function guardNav(go){
  if(!dirty){ go(); return; }
  saveDraft().then(go).catch(function(){ if(confirm('Draft save failed — leave anyway and lose the changes?')) go(); });
}
document.getElementById('wprev').onclick=function(){ WEEK_AUTO=false; guardNav(function(){ weekStart=addD(weekStart,-7); loadWeek(); render(); loadDrafts(); }); };
document.getElementById('wnext').onclick=function(){ WEEK_AUTO=false; guardNav(function(){ weekStart=addD(weekStart,7); loadWeek(); render(); loadDrafts(); }); };

AUTH_ON_LOGIN = boot; if (authGuard()) boot();   // signed in → load now; otherwise the sign-in form loads it
</script>
