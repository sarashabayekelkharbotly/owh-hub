<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hub · Statistics</title>
<link rel="icon" href="hub-logo.png">
<!-- home-screen install: iOS reads apple-touch-icon, Android reads the manifest (the owner's own manifest starts at partner.html) -->
<link rel="apple-touch-icon" href="hub-logo.png">
<link rel="manifest" href="manifest-partner.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Hub">
<meta name="theme-color" content="#f9f0f0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
:root{--blush:#f9f0f0;--red:#cc5f5f;--ink:#1a1a1a;--soft:#6b6b6b;--white:#fff;--line:#ecdede;--grey:#f6f2f2;--g:#3a7d4d;
--d-air:#e0798a;--d-book:#4a7fb5;--d-dir:#6f9a76;--adr:#8a6fa8;--occ:#cc5f5f}
*{box-sizing:border-box}
body{margin:0;background:#dcd0d0;font-family:'Cairo',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 0 40px}
.frame{max-width:1120px;margin:16px auto;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 24px rgba(0,0,0,.10);overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;white-space:nowrap;flex:none}
.brand .logo{width:26px;height:26px;border-radius:6px;flex:none}
.brand .bs{font-weight:600;font-size:11.5px;color:var(--soft);border-left:1px solid var(--line);padding-left:7px}
.rib{font-size:10px;color:#4c4040;text-align:right;line-height:1.5}
.body{padding:13px;background:var(--blush)}
.h1{font-size:18px;font-weight:700;margin:0 0 10px}
.h1 .sub{font-size:12px;font-weight:400;color:var(--soft)}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
.card h3{margin:0;font-size:13px;font-weight:700}
.chead{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.csub{font-size:10.5px;color:var(--soft);margin:-4px 0 8px}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;font-family:inherit;font-size:11px;font-weight:700;color:var(--soft);padding:4px 9px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--red);color:#fff}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.wrap{overflow-x:auto}
table.d{width:100%;border-collapse:collapse;font-size:12px}
table.d th,table.d td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.d th:first-child,table.d td:first-child{text-align:left;position:sticky;left:0;background:var(--white)}
table.d th{font-size:9.5px;color:var(--soft);font-weight:700}
table.d tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
table.d tr.head td{font-weight:700}
table.d tr.sub td{color:#7a6a6a;font-size:11px;background:#fbf7f7}
table.d tr.sub td:first-child{padding-left:20px;background:#fbf7f7}
.drillable{cursor:pointer}.drillable:hover td{background:#faf5f5}
.drillable:hover td:first-child{background:#faf5f5}
.g{color:var(--g)}.neg{color:var(--red)}
.btn{border:1px solid var(--line);background:var(--white);color:var(--ink);font-family:inherit;font-weight:700;font-size:12px;border-radius:9px;padding:6px 13px;cursor:pointer}
.btn:hover{background:var(--grey)}
.ctit{font-size:11.5px;font-weight:700;color:var(--soft);margin:10px 0 2px}
.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.kg{grid-template-columns:1fr 1fr}}
.kt{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.kpi-l{font-size:10px;color:var(--soft)}.kpi-v{font-size:19px;font-weight:700;line-height:1.1;margin:1px 0}.kpi-s{font-size:10px;color:var(--soft)}
.dl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.dl label{font-size:11px;color:var(--soft);display:flex;gap:5px;align-items:center}
.dl input[type=month]{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--white)}
.legend{font-size:10.5px;color:var(--soft);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:10px;color:var(--soft);line-height:1.55;margin:8px 0 0}
.muted{color:var(--soft);font-size:11px}
.err{background:#f6e3e3;border:1px solid #e6b9b9;border-radius:10px;padding:12px;font-size:13px}
.demo{background:#efe9f5;border:1px solid #d9cbe8;border-radius:10px;padding:7px 11px;font-size:10.5px;color:#5c4a72;margin-bottom:10px}
.tabbar{display:flex;background:var(--white);border-top:1px solid var(--line)}
.tabbar .tab{flex:1;text-align:center;padding:7px 2px 8px;font-size:10px;color:var(--soft);text-decoration:none;font-weight:600;border-top:2px solid transparent}
.tabbar .tab .ti{display:block;font-size:17px;line-height:1.15;margin-bottom:1px}
.tabbar .tab.active{color:var(--red);border-top-color:var(--red)}
.tabbar .tab{min-width:0;white-space:nowrap}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="brand"><img class="logo" src="hub-logo.png" alt="The Hub"><span class="bn">The Hub</span><span class="bs">Statistics</span></div>
    <div class="rib" id="rib"></div>
  </div>
  <div class="body"><div id="app"><div class="card"><span class="muted">Loading…</span></div></div></div>
  <nav class="tabbar">
    <a class="tab" href="partner.html#overview"><span class="ti">🏠</span>Overview</a>
    <a class="tab" href="partner.html#bookings"><span class="ti">📅</span>Bookings</a>
    <a class="tab" href="partner.html#statement"><span class="ti">📄</span>Statement</a>
    <a class="tab active" href="partner-history.html"><span class="ti">📊</span>Statistics</a>
    <a class="tab" href="partner.html#contract"><span class="ti">📜</span>Contract</a>
  </nav>
</div>

<script src="auth.js?v=ccb277f8"></script>
<script src="partner-core.js?v=6"></script>
<script>
/* SCREEN 7 — Partner, history & statistics.
   Each card carries its own time range, the same 3M/6M/YTD/12M/all control the Statistics screen uses,
   so a partner can look at one chart closely without disturbing the others. Server-side scoping is the
   security boundary; this page only ever holds their own flat. */
AUTH_ROLE = 'partner';

var DATA=null, CUR='USD', OPEN={cost:true}, CHAN='revenue';      // the cost categories are open by default, like the statement
var R={sum:'12M', occ:'12M', chan:'12M'};
try{ CUR=localStorage.getItem('owh_cur')||'USD'; }catch(e){}

var $=function(s){return document.querySelector(s);};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function esc(s){return (s||'').toString().replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
/* Dollars carry 2 decimals, EGP none — see the note in partner.html. `fmtN` is for things that are
   not money (nights, bookings), which must never grow decimals. */
function fmt(n){ if(n==null||!isFinite(n)) return '—';
  var d=(CUR==='USD')?2:0;
  return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtN(n){ if(n==null||!isFinite(n)) return '—'; return Math.round(n).toLocaleString('en-US'); }
function fmt2(n){ if(n==null||!isFinite(n)) return '—'; return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function monShort(ym){ var p=(ym||'').split('-'); return p.length===2 ? MON[(+p[1])-1] : ym; }
function monLabel(ym){ var p=(ym||'').split('-'); return p.length===2 ? MON[(+p[1])-1]+' '+p[0] : ym; }

/* ---- currency: each month at ITS OWN rate, recovered from the sheet's own figures ---- */
function fxNow(){ return (DATA.meta.fx&&DATA.meta.fx.current)||1; }
function rateFor(r){
  if(!r) return fxNow();
  var egp=0, usd=0;
  (r.costs||[]).forEach(function(c){ if(!c.amount) return; if(c.currency==='EGP') egp+=c.amount; else usd+=c.amount; });
  var allCostsUsd=r.revenue.total-r.net, egpAsUsd=allCostsUsd-usd;
  return (egp>0 && egpAsUsd>0.01) ? egp/egpAsUsd : fxNow();
}
function cv(v,rate){ if(v==null||!isFinite(v)) return null; return CUR==='USD' ? v : v*rate; }
function cvCost(v,cur,rate){ if(v==null||!isFinite(v)) return null;      // a cost line in its own currency
  if(CUR===cur) return v; return CUR==='USD' ? v/rate : v*rate; }
function sym(){ return CUR==='USD' ? '$' : 'EGP '; }
function setCur(c){ CUR=c; try{ localStorage.setItem('owh_cur',c); }catch(e){} render(); }

function boot(){ fetchOnce().then(onData).catch(function(e){ if(e&&e.message==='AUTH')return;
  setTimeout(function(){ fetchOnce().then(onData).catch(function(e2){ if(e2&&e2.message==='AUTH')return; showErr(e2); }); },800); }); }
/* 👁 VIEW AS PARTNER (Sarah 2026-10-11). An admin opens this screen as a partner home of their choice — ?as=<home>
   (remembered for this tab, so This month ⇄ History keep it), or ?as=demo for the demo. The server builds the very
   payload that home's partner gets (asPartner), and keeps the admin signed in as themselves. With no choice yet, the
   admin is shown the list of partner homes. */
var PREVIEW=(function(){ var q=null; try{ q=new URLSearchParams(location.search).get('as'); }catch(e){}
  try{ if(q!==null){ sessionStorage.setItem('owh_preview_as',q); return q; } return sessionStorage.getItem('owh_preview_as')||''; }catch(e){ return q||''; } })();
function chk_(j){ if(!j||!j.ok)throw new Error(j&&j.error||'bad'); return j; }
function fetchOnce(){
  if(!isAdmin()) return api('props_get_all',null).then(chk_);
  if(PREVIEW==='demo') return api('props_get_all',{scope:'demo'}).then(chk_);
  if(PREVIEW) return api('props_get_all',{asPartner:PREVIEW}).then(function(j){
    if(j&&j.ok===false&&/Not a partner home/.test(j.error||'')){ try{ sessionStorage.removeItem('owh_preview_as'); }catch(e){} PREVIEW=''; return api('props_get_all',{asPartner:'*'}).then(chk_); }
    return chk_(j); });
  return api('props_get_all',{asPartner:'*'}).then(chk_);
}
function previewChoose(id){ try{ sessionStorage.setItem('owh_preview_as',id); }catch(e){} location.href=location.pathname+'?as='+encodeURIComponent(id); }
function renderChooser(list){
  $('#rib').innerHTML=authWho();
  $('#app').innerHTML='<div class="card"><h3>👁 View as partner</h3><p class="note">Pick a home to see its partner page exactly as the partner sees it. You stay signed in as yourself.</p>'+
    ((list||[]).length ? (list||[]).map(function(x){ return '<button class="pvbtn" onclick="previewChoose(\''+(x.demo?'demo':esc(x.id))+'\')" style="display:block;width:100%;margin:6px 0;padding:10px;border:1px solid #ecdede;border-radius:10px;background:#fff;font:inherit;font-weight:700;cursor:pointer;text-align:left">'+esc(x.name)+(x.demo?' <span class="muted">(demo)</span>':'')+'</button>'; }).join('')
      : '<p class="muted">No home has a partner yet.</p>')+
    '<p style="margin-top:10px"><a href="today.html">← Back to the Hub</a></p></div>';
}
function previewBar(){
  if(!isAdmin()||!DATA||!DATA.meta) return;
  var f=(DATA.meta.preview&&DATA.meta.preview.flat)||(DATA.meta.demo&&DATA.meta.demo.active&&DATA.meta.demo.flat)||''; if(!f) return;
  var b=document.getElementById('pvBar');
  if(!b){ b=document.createElement('div'); b.id='pvBar'; var app=document.getElementById('app'); app.parentNode.insertBefore(b,app); }
  b.innerHTML='<div style="background:#fdf1d8;border:1px solid #ecd39a;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:12.5px;font-weight:700">👁 Viewing as the partner of <b>'+esc(flatName())+'</b> — a preview, read-only. You are signed in as '+esc((ME&&ME.user)||'')+'. '+
    '<a href="#" onclick="try{sessionStorage.removeItem(\'owh_preview_as\')}catch(e){};location.href=location.pathname;return false">Switch home</a> · <a href="today.html">← Back to the Hub</a></div>';
}
function isAdmin(){ return !!(ME && ME.role==='admin'); }
function showErr(e){ if(DATA)return; $('#app').innerHTML='<div class="err">Couldn\'t load your statistics.<br><span class="muted">'+esc(e&&e.message||'')+'</span></div>'; }
function onData(j){ if(j.partners){ renderChooser(j.partners); return; } DATA=j.data; if(j.me) ME=j.me; render(); previewBar(); }

function myFlat(){ return (ME&&ME.flat) || (DATA.meta.preview&&DATA.meta.preview.flat) || (DATA.meta.flatsOrder&&DATA.meta.flatsOrder[0]) || ''; }
function flatName(){ var f=myFlat(), m=(DATA.flats||[]).filter(function(x){return x.id===f;})[0]; return (m&&m.name)||f; }
/* the sheet carries empty rows far into the future; every table, chart and download here stops at next month */
function allMonths(){ var f=myFlat(), lim=chipLimit(); return DATA.pnl&&DATA.pnl[f] ? Object.keys(DATA.pnl[f]).sort().filter(function(m){ return m<=lim; }) : []; }
function recFor(m){ var f=myFlat(); return (DATA.pnl&&DATA.pnl[f]&&DATA.pnl[f][m])||null; }
function daysIn(ym){ return new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(); }

/* ---- ranges, matching the Statistics screen ---- */
function inRange(rng){
  var all=allMonths(); if(rng==='all') return all;
  if(rng==='YTD'){ var y=(all[all.length-1]||'').slice(0,4); return all.filter(function(m){ return m.slice(0,4)===y; }); }
  var n=rng==='3M'?3:(rng==='6M'?6:12); return all.slice(-n);
}
function seg(opts,cur,fn){ return '<div class="seg">'+opts.map(function(o){
  var v=Array.isArray(o)?o[0]:o, lbl=Array.isArray(o)?o[1]:o;
  return '<button class="'+(cur===v?'on':'')+'" onclick="'+fn+'(\''+v+'\')">'+lbl+'</button>'; }).join('')+'</div>'; }
function timeSeg(k){ return seg(['3M','6M','YTD','12M','all'], R[k], 'setR_'+k); }
function setR_sum(v){ R.sum=v; render(); }
function chipLimit(){ var c=(DATA&&DATA.meta&&DATA.meta.currentMonth)||''; if(!c) return '9999'; var y=+c.slice(0,4), mo=+c.slice(5,7)+1; if(mo>12){ y++; mo=1; } return y+'-'+('0'+mo).slice(-2); }
function setR_occ(v){ R.occ=v; render(); }
function setR_chan(v){ R.chan=v; render(); }
function setChan(v){ CHAN=v; render(); }
function toggle(k){ OPEN[k]=!OPEN[k]; render(); }

/* ---- their stays ---- */
function liveStays(){
  var f=myFlat();
  return (DATA.stays||[]).filter(function(s){
    var st=(s.status||'').toLowerCase();
    return s.flat===f && s.portal!=='Blocked' && st.indexOf('cancel')<0 && st.indexOf('block')<0 && s.checkIn && s.checkOut;
  });
}
/* Nights of one stay inside one month — a stay crossing a month boundary belongs to both, and the
   P&L splits it the same way, so every per-month figure here is built on this. */
function nightsOf(s,ym){
  var lo=new Date(ym+'-01T00:00:00'), hi=new Date(+ym.slice(0,4), +ym.slice(5,7), 1), n=0;
  var ci=new Date(s.checkIn.slice(0,10)+'T00:00:00'), co=new Date(s.checkOut.slice(0,10)+'T00:00:00');
  for(var d=new Date(Math.max(ci,lo)); d<co && d<hi; d.setDate(d.getDate()+1)) n++;
  return n;
}
function earnedIn(s,ym){ var tot=s.nights||nightsOf(s,ym)||1; return (s.allIn||0)*nightsOf(s,ym)/tot; }
function chKey(p){ var s=(p||'').toLowerCase();
  return s.indexOf('airbnb')>-1?'Airbnb':(s.indexOf('booking')>-1?'Booking':'Direct'); }
var CH=[['Airbnb','var(--d-air)'],['Booking','var(--d-book)'],['Direct','var(--d-dir)']];
function nightsIn(ym){ return liveStays().reduce(function(a,s){ return a+nightsOf(s,ym); },0); }

/* ---- cost categories ---- */
var ORDER=PC.ORDER, LABEL=PC.LABEL;

/* ---- one row of the history table ---- */
function rowFor(m){
  var r=recFor(m); if(!r) return null;
  var pv=r.partnerView||{}, rate=rateFor(r);
  return { m:m, rate:rate,
    rev:cv(r.revenue.total,rate), earn:cv(r.revenue.earnings||0,rate), other:cv(r.revenue.other||0,rate),
    costs:cv(r.revenue.total-r.net,rate), fee:cv(pv.managementFee||0,rate),
    net:cv((pv.netPayout!=null?pv.netPayout:r.net)+(pv.reviewReturn||0),rate),
    pct:pv.managementFeePct||0, open:(r.status!=='final') };
}

/* The table and the CSV are the statement's own rows (partner-core.js) laid over the months in range, so «Statistics»
   can never show a different set of lines than «This month» (Sarah 2026-10-13). */
function modelsIn(ms){ return ms.map(function(m){ return PC.model(DATA,myFlat(),m); }).filter(Boolean); }
function cellTxt(d,m){ var v=d.get(m); if(v==null||!isFinite(v)) return '—';
  if(d.t==='n') return fmtN(v); if(d.t==='p') return Math.round(v*100)+'%'; if(d.t==='r') return v.toFixed(2); return fmt(CUR==='USD'?v:v*m.rate); }
/* ---- charts. They are drawn at the size they are SHOWN — the old ones were drawn 980 units wide and shrunk, so on a phone the labels came out 3px tall.
   Each month gets at least 50px (the chart scrolls sideways if there are more months than fit); labels are 12px; a month with nothing to show says so. ---- */
function chartW(n){ var host=document.getElementById('app'); var w=(host&&host.clientWidth?host.clientWidth:340)-28; return Math.max(w,n*50+54); }
function monAxis(ms,i,cx,y){
  var newYr=(i===0||ms[i].slice(0,4)!==ms[i-1].slice(0,4));
  return '<text x="'+cx+'" y="'+y+'" font-size="12" text-anchor="middle" fill="#6b6b6b">'+monShort(ms[i])+'</text>'+
         (newYr?'<text x="'+cx+'" y="'+(y+13)+'" font-size="10" text-anchor="middle" fill="#9a8a8a">'+ms[i].slice(0,4)+'</text>':'');
}
/* a value label is centred on its bar but never allowed past the chart's edge */
function lx(cx,t,fs,W){ var hw=String(t).length*fs*0.58/2+2; return Math.max(hw,Math.min(W-hw,cx)); }
function svgWrap(W,H,inner){ return '<div style="overflow-x:auto"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;max-width:none">'+inner+'</svg></div>'; }

/* occupancy: one bar per month, the percentage written on it */
function occChart(){
  var ms=inRange(R.occ); if(!ms.length) return '<div class="muted">No data in range.</div>';
  var n=ms.length, W=chartW(n), H=190, pl=40, pr=10, pt=22, pb=40, iw=(W-pl-pr)/n, ph=H-pt-pb, g='', b='';
  [0,0.5,1].forEach(function(f){ var y=pt+ph*(1-f);
    g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="'+(f===0?'#cdbcbc':'#efe6e6')+'"></line><text x="'+(pl-6)+'" y="'+(y+4)+'" font-size="11" text-anchor="end" fill="#6b6b6b">'+Math.round(f*100)+'%</text>'; });
  ms.forEach(function(m,i){
    var md=PC.model(DATA,myFlat(),m), occ=md?md.k.occ:0, nn=md?md.k.nights:0, bw=Math.min(iw*0.62,44), x=pl+i*iw+(iw-bw)/2, bh=ph*Math.min(occ,1), y=pt+ph-bh;
    b+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="var(--occ)" opacity=".85"><title>'+monLabel(m)+' · '+Math.round(occ*100)+'% · '+nn+' nights</title></rect>'+
       '<text x="'+lx(x+bw/2,Math.round(occ*100)+'%',12,W)+'" y="'+(y-5)+'" font-size="12" font-weight="700" text-anchor="middle" fill="#4c4040">'+Math.round(occ*100)+'%</text>'+monAxis(ms,i,x+bw/2,H-pb+16);
  });
  return svgWrap(W,H,g+b);
}
/* average nightly rate: one bar per month with the amount written on it; a month with no priced nights shows a dash, not a drop to zero */
function adrChart(){
  var ms=inRange(R.occ); if(!ms.length) return '<div class="muted">No data in range.</div>';
  var n=ms.length, W=chartW(n), H=190, pl=10, pr=10, pt=22, pb=40, iw=(W-pl-pr)/n, ph=H-pt-pb, g='', b='';
  var vals=ms.map(function(m){ var md=PC.model(DATA,myFlat(),m); return (md&&md.k.adr!=null)?cv(md.k.adr,md.rate):null; });
  var max=Math.max.apply(null,vals.map(function(v){ return v||0; }).concat([1]))*1.12;
  g+='<line x1="'+pl+'" y1="'+(pt+ph)+'" x2="'+(W-pr)+'" y2="'+(pt+ph)+'" stroke="#cdbcbc"></line>';
  ms.forEach(function(m,i){
    var v=vals[i], bw=Math.min(iw*0.62,44), x=pl+i*iw+(iw-bw)/2, cx=x+bw/2;
    if(v==null) b+='<text x="'+cx+'" y="'+(pt+ph-6)+'" font-size="12" text-anchor="middle" fill="#9a8a8a">—</text>';
    else { var bh=ph*(v/max), y=pt+ph-bh;
      b+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="var(--adr)" opacity=".85"><title>'+monLabel(m)+' · '+sym()+fmt2(v)+' a night</title></rect>'+
         '<text x="'+lx(cx,sym()+fmt(v),12,W)+'" y="'+(y-5)+'" font-size="12" font-weight="700" text-anchor="middle" fill="#4c4040">'+sym()+fmt(v)+'</text>'; }
    b+=monAxis(ms,i,cx,H-pb+16);
  });
  return svgWrap(W,H,g+b);
}

/* ---- by channel: revenue / stays / nights (stacked by channel), or the MONTH RESULT of the statement (which no channel owns) ---- */
function chanData(ms){
  var out={};
  ms.forEach(function(m){ out[m]={Airbnb:0,Booking:0,Direct:0}; });
  if(CHAN==='result'){ ms.forEach(function(m){ var md=PC.model(DATA,myFlat(),m); out[m]={Result:md?(CUR==='USD'?md.v.res:md.v.res*md.rate):0}; }); return out; }
  liveStays().forEach(function(s){
    ms.forEach(function(m){
      var n=nightsOf(s,m); if(!n) return;
      var k=chKey(s.portal), r=recFor(m);
      if(CHAN==='nights')       out[m][k]+=n;
      else if(CHAN==='stays'){ if((s.checkOut||'').slice(0,7)===m) out[m][k]+=1; }
      else                      out[m][k]+=cv(earnedIn(s,m), rateFor(r));
    });
  });
  return out;
}
function chanChart(){
  var ms=inRange(R.chan); if(!ms.length) return '<div class="muted">No data in range.</div>';
  var data=chanData(ms), isRes=(CHAN==='result'), series=isRes?[['Result','var(--g)']]:CH;
  var money=(CHAN==='revenue'||isRes), val=function(v){ return money ? (v<0?'− ':'')+sym()+fmt(Math.abs(v)) : fmtN(v); };
  var n=ms.length, W=chartW(n), H=236, pl=10, pr=10, pt=24, pb=40, iw=(W-pl-pr)/n;
  var maxPos=1, maxNeg=0;
  ms.forEach(function(m){ var pos=0, neg=0; series.forEach(function(c){ var v=data[m][c[0]]||0; if(v>0) pos+=v; else neg+=v; }); if(pos>maxPos) maxPos=pos; if(neg<maxNeg) maxNeg=neg; });
  /* a clear band is kept for the value labels at BOTH ends of the bars — above the tallest bar and, when a month is negative, below the deepest — so a label can never sit on the month names under the chart (Sarah 2026-10-14) */
  var LAB=20, barsTop=pt+LAB, barsBottom=H-pb-(maxNeg<0?LAB:0);
  var span=maxPos+Math.abs(maxNeg), unit=(barsBottom-barsTop)/span, zeroY=barsTop+maxPos*unit, out='';
  out+='<line x1="'+pl+'" y1="'+zeroY+'" x2="'+(W-pr)+'" y2="'+zeroY+'" stroke="#cdbcbc"></line>';
  ms.forEach(function(m,i){
    var bw=Math.min(iw*0.62,46), x=pl+i*iw+(iw-bw)/2, cx=x+bw/2, up=zeroY, tot=0;
    series.forEach(function(c){
      var v=data[m][c[0]]||0; if(v===0) return; tot+=v;
      var bh=Math.abs(v)*unit, y=v>0?(up-bh):zeroY, col=(isRes&&v<0)?'var(--red)':c[1];
      if(v>0){ up-=bh; }
      out+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" fill="'+col+'" opacity=".88"><title>'+monLabel(m)+' · '+c[0]+' · '+val(v)+'</title></rect>';
      if(!isRes && bh>=17) out+='<text x="'+cx+'" y="'+(y+bh/2+4)+'" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">'+val(v)+'</text>';
    });
    if(isRes){ var vv=data[m].Result||0, ty=vv>=0?(zeroY-Math.abs(vv)*unit-5):(zeroY+Math.abs(vv)*unit+15);
      out+='<text x="'+lx(cx,val(vv),12,W)+'" y="'+(Math.abs(vv)<0.005?zeroY-5:ty)+'" font-size="12" font-weight="700" text-anchor="middle" fill="'+(vv<0?'#a33':'#2d6a3e')+'">'+val(vv)+'</text>'; }
    else if(tot>0) out+='<text x="'+lx(cx,val(tot),12,W)+'" y="'+(zeroY-tot*unit-5)+'" font-size="12" font-weight="700" text-anchor="middle" fill="#4c4040">'+val(tot)+'</text>';
    out+=monAxis(ms,i,cx,H-pb+16);
  });
  return svgWrap(W,H,out)+
    '<div class="legend">'+(isRes?'<span><i style="background:var(--g)"></i>a month that earned</span><span><i style="background:var(--red)"></i>a month still recovering set-up costs</span>'
                               :series.map(function(c){ return '<span><i style="background:'+c[1]+'"></i>'+c[0]+'</span>'; }).join(''))+'</div>';
}

function render(){
  if(!DATA) return;
  if(isAdmin() && !(DATA.meta.demo&&DATA.meta.demo.active) && !DATA.meta.preview){
    $('#app').innerHTML='<div class="card"><h3>Partner preview</h3><p class="note">Switch the demo on to preview this: OWH Properties sheet → <b>The Hub</b> menu → <b>Demo mode — turn ON</b>, then reload.</p></div>'; return; }
  var f=flatName();
  $('#rib').innerHTML=authWho()+' · '+esc(f);
  if(!allMonths().length){ $('#app').innerHTML='<div class="card"><span class="muted">No history yet.</span></div>'; return; }

  var h='';
  if(DATA.meta.demo&&DATA.meta.demo.active) h+='<div class="demo"><b>Sample.</b> Real figures from a running apartment, on the terms we are discussing.</div>';
  h+='<p class="h1">'+esc(f)+' <span class="sub">· statistics</span></p>';

  /* ---- the SHORT table (Sarah 2026-10-13: "the statement without breakdowns and the settlement without breakdowns, so the table is just shorter"):
     the operational KPIs, the statement's main lines and the settlement's end results — the SAME rows as «Statement», one column per month.
     Every breakdown (cost categories, settlement steps, cost entries, bookings) is in the Excel download below. ---- */
  var sms=inRange(R.sum), smodels=modelsIn(sms), bdefs=PC.rowDefs(smodels,{brief:true}), sncol=smodels.length+1;
  var anyOpen=smodels.some(function(m){ return m.status!=='final'; });
  h+='<div class="card"><div class="chead"><h3>Your statement, month by month</h3><div class="rowbtns">'+timeSeg('sum')+seg([['USD','USD'],['EGP','EGP']],CUR,'setCur')+'</div></div>'+
     '<div class="wrap"><table class="d"><thead><tr><th>Line</th>'+smodels.map(function(m){ return '<th>'+monShort(m.ym)+(m.ym.slice(0,4)!==(smodels[smodels.length-1]||{ym:''}).ym.slice(0,4)?' '+m.ym.slice(2,4):'')+(m.status!=='final'?'*':'')+'</th>'; }).join('')+'</tr></thead><tbody>';
  bdefs.forEach(function(d){
    if(d.sec){ h+='<tr class="head"><td colspan="'+sncol+'" style="background:#f6f2f2;font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.04em">'+d.sec+'</td></tr>'; return; }
    var cls=(d.cls==='cat'?'sub':(d.cls||''));
    h+='<tr class="'+cls+'"><td>'+d.label+'</td>'+smodels.map(function(m){ var v=d.get(m); return '<td class="'+(v!=null&&d.t==='m'&&v<0?'neg':'')+'">'+cellTxt(d,m)+'</td>'; }).join('')+'</tr>';
  });
  h+='</tbody></table></div>'+
     '<p class="note">Minus on the balance means owed to OWH. All figures '+CUR+', each month converted at the rate shown above (the rate for that month)'+(anyOpen?' · <b>*</b> still open, may change until the month is closed':'')+
     '. This is the short version: every cost category, the settlement steps, every cost entry and every booking are in the Excel download on the <a href="partner.html#statement">Statement</a> tab.</p></div>';

  /* ---- occupancy & average nightly rate ---- */
  h+='<div class="card"><div class="chead"><h3>Occupancy and average nightly rate</h3>'+timeSeg('occ')+'</div>'+
     '<div class="csub">Occupancy is the share of the month\'s nights that were booked. The nightly rate is earnings ÷ nights; review-booking nights are left out of it.</div>'+
     '<div class="ctit">Occupancy</div>'+occChart()+
     '<div class="ctit">Average nightly rate ('+CUR+')</div>'+adrChart()+'</div>';

  /* ---- by channel, or the monthly result ---- */
  var lbl={revenue:'revenue',stays:'stays',nights:'nights',result:'monthly result'}[CHAN];
  h+='<div class="card"><div class="chead"><h3>Your flat — '+(CHAN==='result'?lbl:lbl+' by month')+'</h3>'+
     '<div class="rowbtns">'+seg([['revenue','Revenue'],['stays','Stays'],['nights','Nights'],['result','Monthly result']],CHAN,'setChan')+
     timeSeg('chan')+'</div></div>'+
     '<div class="csub">'+(CHAN==='result'
        ? 'the Month result of your statement — your share after costs, plus any review bookings you paid that are returned to you. It is negative while set-up costs are still being recovered.'
        : 'split by the channel each booking came through')+'</div>'+
     chanChart()+'</div>';

  $('#app').innerHTML=h;
}

AUTH_ON_LOGIN = boot; if (authGuard()) boot();
</script>
