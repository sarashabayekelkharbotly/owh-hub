<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hub · History &amp; statistics</title>
<link rel="icon" href="hub-logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
:root{--blush:#f9f0f0;--red:#cc5f5f;--ink:#1a1a1a;--soft:#6b6b6b;--white:#fff;--line:#ecdede;--grey:#f6f2f2;--g:#3a7d4d;
--d-air:#e0798a;--d-book:#4a7fb5;--d-dir:#6f9a76;--adr:#8a6fa8;--occ:#cc5f5f}
*{box-sizing:border-box}
body{margin:0;background:#dcd0d0;font-family:'Cairo',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 0 40px}
.frame{max-width:1120px;margin:16px auto;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 24px rgba(0,0,0,.10);overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;white-space:nowrap;flex:none}
.brand .logo{width:26px;height:26px;border-radius:6px;flex:none}
.brand .bs{font-weight:600;font-size:11.5px;color:var(--soft);border-left:1px solid var(--line);padding-left:7px}
.rib{font-size:10px;color:#4c4040;text-align:right;line-height:1.5}
.body{padding:13px;background:var(--blush)}
.h1{font-size:18px;font-weight:700;margin:0 0 10px}
.h1 .sub{font-size:12px;font-weight:400;color:var(--soft)}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
.card h3{margin:0;font-size:13px;font-weight:700}
.chead{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.csub{font-size:10.5px;color:var(--soft);margin:-4px 0 8px}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;font-family:inherit;font-size:11px;font-weight:700;color:var(--soft);padding:4px 9px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--red);color:#fff}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.wrap{overflow-x:auto}
table.d{width:100%;border-collapse:collapse;font-size:12px}
table.d th,table.d td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.d th:first-child,table.d td:first-child{text-align:left;position:sticky;left:0;background:var(--white)}
table.d th{font-size:9.5px;color:var(--soft);font-weight:700}
table.d tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
table.d tr.head td{font-weight:700}
table.d tr.sub td{color:#7a6a6a;font-size:11px;background:#fbf7f7}
table.d tr.sub td:first-child{padding-left:20px;background:#fbf7f7}
.drillable{cursor:pointer}.drillable:hover td{background:#faf5f5}
.drillable:hover td:first-child{background:#faf5f5}
.g{color:var(--g)}.neg{color:var(--red)}
.btn{border:1px solid var(--line);background:var(--white);color:var(--ink);font-family:inherit;font-weight:700;font-size:12px;border-radius:9px;padding:6px 13px;cursor:pointer}
.btn:hover{background:var(--grey)}
.legend{font-size:10.5px;color:var(--soft);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:10px;color:var(--soft);line-height:1.55;margin:8px 0 0}
.muted{color:var(--soft);font-size:11px}
.err{background:#f6e3e3;border:1px solid #e6b9b9;border-radius:10px;padding:12px;font-size:13px}
.demo{background:#efe9f5;border:1px solid #d9cbe8;border-radius:10px;padding:7px 11px;font-size:10.5px;color:#5c4a72;margin-bottom:10px}
.tabbar{display:flex;background:var(--white);border-top:1px solid var(--line)}
.tabbar .tab{flex:1;text-align:center;padding:7px 2px 8px;font-size:10px;color:var(--soft);text-decoration:none;font-weight:600;border-top:2px solid transparent}
.tabbar .tab .ti{display:block;font-size:17px;line-height:1.15;margin-bottom:1px}
.tabbar .tab.active{color:var(--red);border-top-color:var(--red)}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="brand"><img class="logo" src="hub-logo.png" alt="The Hub"><span class="bn">The Hub</span><span class="bs">History &amp; statistics</span></div>
    <div class="rib" id="rib"></div>
  </div>
  <div class="body"><div id="app"><div class="card"><span class="muted">Loading…</span></div></div></div>
  <nav class="tabbar">
    <a class="tab" href="partner.html"><span class="ti">📄</span>This month</a>
    <a class="tab active" href="partner-history.html"><span class="ti">📊</span>History</a>
  </nav>
</div>

<script src="auth.js"></script>
<script>
/* SCREEN 7 — Partner, history & statistics.
   Each card carries its own time range, the same 3M/6M/YTD/12M/all control the Statistics screen uses,
   so a partner can look at one chart closely without disturbing the others. Server-side scoping is the
   security boundary; this page only ever holds their own flat. */
AUTH_ROLE = 'partner';

var DATA=null, CUR='USD', OPEN={rev:false,cost:false}, CHAN='revenue';
var R={hist:'12M', occ:'12M', chan:'12M'};
try{ CUR=localStorage.getItem('owh_cur')||'USD'; }catch(e){}

var $=function(s){return document.querySelector(s);};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function esc(s){return (s||'').toString().replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
/* Dollars carry 2 decimals, EGP none — see the note in partner.html. `fmtN` is for things that are
   not money (nights, bookings), which must never grow decimals. */
function fmt(n){ if(n==null||!isFinite(n)) return '—';
  var d=(CUR==='USD')?2:0;
  return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtN(n){ if(n==null||!isFinite(n)) return '—'; return Math.round(n).toLocaleString('en-US'); }
function fmt2(n){ if(n==null||!isFinite(n)) return '—'; return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function monShort(ym){ var p=(ym||'').split('-'); return p.length===2 ? MON[(+p[1])-1] : ym; }
function monLabel(ym){ var p=(ym||'').split('-'); return p.length===2 ? MON[(+p[1])-1]+' '+p[0] : ym; }

/* ---- currency: each month at ITS OWN rate, recovered from the sheet's own figures ---- */
function fxNow(){ return (DATA.meta.fx&&DATA.meta.fx.current)||1; }
function rateFor(r){
  if(!r) return fxNow();
  var egp=0, usd=0;
  (r.costs||[]).forEach(function(c){ if(!c.amount) return; if(c.currency==='EGP') egp+=c.amount; else usd+=c.amount; });
  var allCostsUsd=r.revenue.total-r.net, egpAsUsd=allCostsUsd-usd;
  return (egp>0 && egpAsUsd>0.01) ? egp/egpAsUsd : fxNow();
}
function cv(v,rate){ if(v==null||!isFinite(v)) return null; return CUR==='USD' ? v : v*rate; }
function cvCost(v,cur,rate){ if(v==null||!isFinite(v)) return null;      // a cost line in its own currency
  if(CUR===cur) return v; return CUR==='USD' ? v/rate : v*rate; }
function sym(){ return CUR==='USD' ? '$' : 'EGP '; }
function setCur(c){ CUR=c; try{ localStorage.setItem('owh_cur',c); }catch(e){} render(); }

function boot(){ fetchOnce().then(onData).catch(function(e){ if(e&&e.message==='AUTH')return;
  setTimeout(function(){ fetchOnce().then(onData).catch(function(e2){ if(e2&&e2.message==='AUTH')return; showErr(e2); }); },800); }); }
function fetchOnce(){ return api('props_get_all', isAdmin()?{scope:'demo'}:null)
  .then(function(j){ if(!j||!j.ok)throw new Error(j&&j.error||'bad'); return j; }); }
function isAdmin(){ return !!(ME && ME.role==='admin'); }
function showErr(e){ if(DATA)return; $('#app').innerHTML='<div class="err">Couldn\'t load your history.<br><span class="muted">'+esc(e&&e.message||'')+'</span></div>'; }
function onData(j){ DATA=j.data; if(j.me) ME=j.me; render(); }

function myFlat(){ return (ME&&ME.flat) || (DATA.meta.flatsOrder&&DATA.meta.flatsOrder[0]) || ''; }
function flatName(){ var f=myFlat(), m=(DATA.flats||[]).filter(function(x){return x.id===f;})[0]; return (m&&m.name)||f; }
function allMonths(){ var f=myFlat(); return DATA.pnl&&DATA.pnl[f] ? Object.keys(DATA.pnl[f]).sort() : []; }
function recFor(m){ var f=myFlat(); return (DATA.pnl&&DATA.pnl[f]&&DATA.pnl[f][m])||null; }
function daysIn(ym){ return new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(); }

/* ---- ranges, matching the Statistics screen ---- */
function inRange(rng){
  var all=allMonths(); if(rng==='all') return all;
  if(rng==='YTD'){ var y=(all[all.length-1]||'').slice(0,4); return all.filter(function(m){ return m.slice(0,4)===y; }); }
  var n=rng==='3M'?3:(rng==='6M'?6:12); return all.slice(-n);
}
function seg(opts,cur,fn){ return '<div class="seg">'+opts.map(function(o){
  var v=Array.isArray(o)?o[0]:o, lbl=Array.isArray(o)?o[1]:o;
  return '<button class="'+(cur===v?'on':'')+'" onclick="'+fn+'(\''+v+'\')">'+lbl+'</button>'; }).join('')+'</div>'; }
function timeSeg(k){ return seg(['3M','6M','YTD','12M','all'], R[k], 'setR_'+k); }
function setR_hist(v){ R.hist=v; render(); }
function setR_occ(v){ R.occ=v; render(); }
function setR_chan(v){ R.chan=v; render(); }
function setChan(v){ CHAN=v; render(); }
function toggle(k){ OPEN[k]=!OPEN[k]; render(); }

/* ---- their stays ---- */
function liveStays(){
  var f=myFlat();
  return (DATA.stays||[]).filter(function(s){
    var st=(s.status||'').toLowerCase();
    return s.flat===f && s.portal!=='Blocked' && st.indexOf('cancel')<0 && st.indexOf('block')<0 && s.checkIn && s.checkOut;
  });
}
/* Nights of one stay inside one month — a stay crossing a month boundary belongs to both, and the
   P&L splits it the same way, so every per-month figure here is built on this. */
function nightsOf(s,ym){
  var lo=new Date(ym+'-01T00:00:00'), hi=new Date(+ym.slice(0,4), +ym.slice(5,7), 1), n=0;
  var ci=new Date(s.checkIn.slice(0,10)+'T00:00:00'), co=new Date(s.checkOut.slice(0,10)+'T00:00:00');
  for(var d=new Date(Math.max(ci,lo)); d<co && d<hi; d.setDate(d.getDate()+1)) n++;
  return n;
}
function earnedIn(s,ym){ var tot=s.nights||nightsOf(s,ym)||1; return (s.allIn||0)*nightsOf(s,ym)/tot; }
function chKey(p){ var s=(p||'').toLowerCase();
  return s.indexOf('airbnb')>-1?'Airbnb':(s.indexOf('booking')>-1?'Booking':'Direct'); }
var CH=[['Airbnb','var(--d-air)'],['Booking','var(--d-book)'],['Direct','var(--d-dir)']];
function nightsIn(ym){ return liveStays().reduce(function(a,s){ return a+nightsOf(s,ym); },0); }

/* ---- cost categories ---- */
var ORDER=['cleaning-labor','laundry','supplies','electricity','tv-phone-internet','water','heat-gas','maintenance','compound-maintenance','opsmanager','services-contingency','contingency','gifts-contingency','general-contingency','subscription'];
var LABEL={'cleaning-labor':'cleaning','laundry':'laundry','supplies':'supplies','electricity':'electricity','tv-phone-internet':'internet',
  'water':'water','heat-gas':'gas','maintenance':'maintenance','compound-maintenance':'compound','opsmanager':'operations',
  'services-contingency':'services','contingency':'contingency','gifts-contingency':'contingency','general-contingency':'contingency','subscription':'booking software'};
function usedCostKeys(ms){
  var seen={}, keys=[];
  ms.forEach(function(m){ var r=recFor(m); if(!r) return;
    (r.costs||[]).forEach(function(c){ if(c.amount) seen[c.key]=1; }); });
  ORDER.forEach(function(k){ if(seen[k]){ keys.push(k); delete seen[k]; } });
  for(var k in seen) keys.push(k);
  return keys;
}
function costCell(m,key){
  var r=recFor(m); if(!r) return null;
  var c=(r.costs||[]).filter(function(x){return x.key===key;})[0];
  return c ? cvCost(c.amount, c.currency, rateFor(r)) : null;
}

/* ---- one row of the history table ---- */
function rowFor(m){
  var r=recFor(m); if(!r) return null;
  var pv=r.partnerView||{}, rate=rateFor(r);
  return { m:m, rate:rate,
    rev:cv(r.revenue.total,rate), earn:cv(r.revenue.earnings||0,rate), other:cv(r.revenue.other||0,rate),
    costs:cv(r.revenue.total-r.net,rate), fee:cv(pv.managementFee||0,rate),
    net:cv(pv.netPayout!=null?pv.netPayout:r.net,rate),
    pct:pv.managementFeePct||0, open:(r.status!=='final') };
}

function csv(){
  var ms=inRange(R.hist), rs=ms.map(rowFor).filter(Boolean);
  var line=function(lbl,pick){ return [lbl].concat(rs.map(function(r){ var v=pick(r); return v==null?'':v.toFixed(2); })).join(','); };
  var out=[['Line'].concat(ms.map(monLabel)).join(',')];
  out.push(line('Total revenue ('+CUR+')',function(r){return r.rev;}));
  out.push(line('  Earnings',function(r){return r.earn;}));
  out.push(line('  Other revenue',function(r){return r.other;}));
  out.push(line('Costs ('+CUR+')',function(r){return r.costs;}));
  usedCostKeys(ms).forEach(function(k){
    out.push(['  '+(LABEL[k]||k)].concat(ms.map(function(m){ var v=costCell(m,k); return v==null?'':v.toFixed(2); })).join(','));
  });
  out.push(line('Management fee ('+CUR+')',function(r){return r.fee;}));
  out.push(line('Net to you ('+CUR+')',function(r){return r.net;}));
  out.push(['Nights'].concat(ms.map(function(m){ return nightsIn(m); })).join(','));
  out.push(['Status'].concat(rs.map(function(r){ return r.open?'in progress':'final'; })).join(','));
  var blob=new Blob([out.join('\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=flatName().replace(/\s+/g,'-')+'-history-'+(ms[0]||'')+'-to-'+(ms[ms.length-1]||'')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ---- occupancy bars + ADR line ---- */
function occChart(){
  var ms=inRange(R.occ);
  if(!ms.length) return '<div class="muted">No data in range.</div>';
  var w=980,h=250,pl=52,pr=62,pt=26,pb=30, iw=(w-pl-pr)/ms.length, adrMax=1, ih=h-pt-pb;
  var pts=ms.map(function(m){
    var r=recFor(m), n=nightsIn(m), adr=n?cv((r&&r.revenue.earnings)||0,rateFor(r))/n:0;
    if(adr>adrMax) adrMax=adr;
    return {m:m, occ:n/daysIn(m), adr:adr, n:n};
  });
  var ny=function(f){ return h-pb-ih*f; };                       // 0..1 -> y
  /* No axis scales: every value is written on the mark it belongs to, which is one less thing to
     read across. Faint gridlines stay for shape. */
  var grid='';
  [0.25,0.5,0.75,1].forEach(function(f){
    grid+='<line x1="'+pl+'" y1="'+ny(f)+'" x2="'+(w-pr)+'" y2="'+ny(f)+'" stroke="#f7efef"></line>';
  });
  var bars=pts.map(function(p,i){
    var bh=ih*Math.min(p.occ,1), x=pl+i*iw+iw*0.24, bw=Math.max(iw*0.52,3);
    var pctTxt=Math.round(p.occ*100)+'%';
    // inside the bar when it is tall enough to hold the text, just above it when it is not
    var lbl = bh>=17
      ? '<text x="'+(x+bw/2)+'" y="'+(h-pb-bh+12)+'" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">'+pctTxt+'</text>'
      : '<text x="'+(x+bw/2)+'" y="'+(h-pb-bh-4)+'" font-size="9" font-weight="700" text-anchor="middle" fill="var(--occ)">'+pctTxt+'</text>';
    return '<rect x="'+x+'" y="'+(h-pb-bh)+'" width="'+bw+'" height="'+bh+'" rx="2" fill="var(--occ)" opacity=".82">'+
           '<title>'+monLabel(p.m)+' · '+pctTxt+' occupied · '+p.n+' nights</title></rect>'+lbl+
           '<text x="'+(x+bw/2)+'" y="'+(h-pb+13)+'" font-size="9" text-anchor="middle" fill="#6b6b6b">'+monShort(p.m)+'</text>';
  }).join('');
  // the nightly rate written above each point
  var adrLbl=pts.map(function(p,i){
    return '<text x="'+(pl+i*iw+iw/2)+'" y="'+(ny(p.adr/adrMax)-7)+'" font-size="9" font-weight="700" '+
           'text-anchor="middle" fill="var(--adr)">'+sym()+fmt(p.adr)+'</text>';
  }).join('');
  var line=pts.map(function(p,i){ return (i?'L':'M')+(pl+i*iw+iw/2)+','+ny(p.adr/adrMax); }).join(' ');
  var circles=pts.map(function(p,i){
    return '<circle cx="'+(pl+i*iw+iw/2)+'" cy="'+ny(p.adr/adrMax)+'" r="2.6" fill="var(--adr)">'+
           '<title>'+monLabel(p.m)+' · '+sym()+fmt2(p.adr)+' a night</title></circle>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:250px" preserveAspectRatio="xMidYMid meet">'+
    grid+
    '<text x="'+pl+'" y="13" font-size="10" font-weight="700" fill="var(--occ)" text-anchor="start">bars · occupancy %</text>'+
    '<text x="'+(w-pr)+'" y="13" font-size="10" font-weight="700" fill="var(--adr)" text-anchor="end">line · nightly rate ('+CUR+')</text>'+
    '<line x1="'+pl+'" y1="'+(h-pb)+'" x2="'+(w-pr)+'" y2="'+(h-pb)+'" stroke="#e0d0d0"></line>'+
    bars+'<path d="'+line+'" fill="none" stroke="var(--adr)" stroke-width="1.9"></path>'+circles+adrLbl+'</svg>'+
    '<div class="legend"><span><i style="background:var(--occ)"></i>occupancy % — share of the month\'s nights booked</span>'+
    '<span><i style="background:var(--adr)"></i>ADR — earnings ÷ nights, in '+CUR+'</span></div>';
}

/* ---- the bottom chart: revenue / stays / nights by channel, or net (which no channel owns) ---- */
function chanData(ms){
  var out={};
  ms.forEach(function(m){ out[m]={Airbnb:0,Booking:0,Direct:0}; });
  if(CHAN==='net'){ ms.forEach(function(m){ var r=rowFor(m); out[m]={Net:r?r.net:0}; }); return out; }
  liveStays().forEach(function(s){
    ms.forEach(function(m){
      var n=nightsOf(s,m); if(!n) return;
      var k=chKey(s.portal), r=recFor(m);
      if(CHAN==='nights')       out[m][k]+=n;
      else if(CHAN==='stays'){ if((s.checkOut||'').slice(0,7)===m) out[m][k]+=1; }
      else                      out[m][k]+=cv(earnedIn(s,m), rateFor(r));
    });
  });
  return out;
}
function chanChart(){
  var ms=inRange(R.chan);
  if(!ms.length) return '<div class="muted">No data in range.</div>';
  var data=chanData(ms), series=(CHAN==='net')?[['Net','var(--g)']]:CH;
  var money=(CHAN==='revenue'||CHAN==='net');
  var unit={revenue:CUR,net:CUR,stays:'bookings',nights:'nights'}[CHAN];
  var val=function(v){ return money ? sym()+fmt(v) : fmtN(v); };      // counts never grow decimals
  var w=980,h=245,pl=22,pr=16,pt=26,pb=30, iw=(w-pl-pr)/ms.length, max=1, ih=h-pt-pb;
  ms.forEach(function(m){ var t=series.reduce(function(a,c){ return a+(data[m][c[0]]||0); },0); if(t>max)max=t; });
  var ny=function(f){ return h-pb-ih*f; };
  var grid='';                                    // shape only — every number is written on its own segment
  [0.25,0.5,0.75,1].forEach(function(f){
    grid+='<line x1="'+pl+'" y1="'+ny(f)+'" x2="'+(w-pr)+'" y2="'+ny(f)+'" stroke="#f7efef"></line>';
  });
  var body=ms.map(function(m,i){
    var y=h-pb, x=pl+i*iw+iw*0.22, bw=Math.max(iw*0.56,3), out='', lbls='';
    series.forEach(function(c){
      var v=data[m][c[0]]||0; if(v<=0) return;
      var bh=ih*(v/max); y-=bh;
      out+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" fill="'+c[1]+'" opacity=".88">'+
           '<title>'+monLabel(m)+' · '+c[0]+' · '+val(v)+'</title></rect>';
      /* the split written on the segment itself — the point of a stacked bar is the breakdown, and
         reading it off a shared axis is guesswork. Skipped when the slice is too thin to hold text. */
      if(bh>=13) lbls+='<text x="'+(x+bw/2)+'" y="'+(y+bh/2+3.5)+'" font-size="9" font-weight="700" '+
                       'text-anchor="middle" fill="#fff">'+val(v)+'</text>';
    });
    var tot=series.reduce(function(a,c){ return a+(data[m][c[0]]||0); },0);
    if(tot>0) out+='<text x="'+(x+bw/2)+'" y="'+(y-5)+'" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4c4040">'+val(tot)+'</text>';
    out+=lbls;
    out+='<text x="'+(x+bw/2)+'" y="'+(h-pb+13)+'" font-size="9" text-anchor="middle" fill="#6b6b6b">'+monShort(m)+'</text>';
    return out;
  }).join('');
  var title={revenue:'revenue',net:'net paid to you',stays:'bookings completed',nights:'nights booked'}[CHAN];
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:245px" preserveAspectRatio="xMidYMid meet">'+
    grid+
    '<text x="'+pl+'" y="13" font-size="10" font-weight="700" fill="#6b6b6b">'+title+' per month'+(money?' ('+CUR+')':' ('+unit+')')+'</text>'+
    '<line x1="'+pl+'" y1="'+(h-pb)+'" x2="'+(w-pr)+'" y2="'+(h-pb)+'" stroke="#e0d0d0"></line>'+body+'</svg>'+
    '<div class="legend">'+series.map(function(c){ return '<span><i style="background:'+c[1]+'"></i>'+c[0]+'</span>'; }).join('')+
    '<span>figures above each bar are the month total</span></div>';
}

function render(){
  if(!DATA) return;
  if(isAdmin() && !(DATA.meta.demo&&DATA.meta.demo.active)){
    $('#app').innerHTML='<div class="card"><h3>Partner preview</h3><p class="note">Switch the demo on to preview this: OWH Properties sheet → <b>The Hub</b> menu → <b>Demo mode — turn ON</b>, then reload.</p></div>'; return; }
  var f=flatName();
  $('#rib').innerHTML=authWho()+' · '+esc(f);
  if(!allMonths().length){ $('#app').innerHTML='<div class="card"><span class="muted">No history yet.</span></div>'; return; }

  var ms=inRange(R.hist), rs=ms.map(rowFor).filter(Boolean);
  var anyOpen=rs.some(function(r){ return r.open; });
  var pct=(rs[rs.length-1]||{}).pct||0;
  var keys=usedCostKeys(ms);

  var h='';
  if(DATA.meta.demo&&DATA.meta.demo.active) h+='<div class="demo"><b>Sample.</b> Real figures from a running apartment, on the terms we are discussing.</div>';
  h+='<p class="h1">'+esc(f)+' <span class="sub">· history &amp; statistics</span></p>';

  /* ---- history table ---- */
  h+='<div class="card"><div class="chead"><h3>Your history — all months</h3>'+
     '<div class="rowbtns">'+timeSeg('hist')+
     seg([['USD','USD'],['EGP','EGP']],CUR,'setCur')+'</div></div>';
  h+='<div class="wrap"><table class="d"><thead><tr><th>Line</th>'+
     ms.map(function(m){ var r=rowFor(m); return '<th>'+monShort(m)+(r&&r.open?'*':'')+'</th>'; }).join('')+'</tr></thead><tbody>';

  var line=function(lbl,pick,cls,click){
    return '<tr'+(cls?' class="'+cls+'"':'')+(click?' onclick="toggle(\''+click+'\')"':'')+'><td>'+lbl+'</td>'+
      rs.map(function(r){ var v=pick(r); return '<td class="'+(v<0?'neg':'')+'">'+fmt(v)+'</td>'; }).join('')+'</tr>';
  };
  h+=line('Total revenue '+(OPEN.rev?'▾':'▸'),function(r){return r.rev;},'head drillable','rev');
  if(OPEN.rev){
    h+=line('earnings',function(r){return r.earn;},'sub');
    h+=line('other revenue',function(r){return r.other;},'sub');
  }
  h+=line('Costs '+(OPEN.cost?'▾':'▸'),function(r){return r.costs;},'head drillable','cost');
  if(OPEN.cost){
    keys.forEach(function(k){
      h+='<tr class="sub"><td>'+(LABEL[k]||k)+'</td>'+
         ms.map(function(m){ return '<td>'+fmt(costCell(m,k))+'</td>'; }).join('')+'</tr>';
    });
  }
  h+=line('Management fee — '+Math.round(pct*100)+'%',function(r){return r.fee;});
  h+=line('Net to you',function(r){return r.net;},'tot');
  h+='</tbody></table></div>';
  h+='<div class="rowbtns" style="margin-top:9px"><button class="btn" onclick="csv()">Export CSV</button></div>';
  h+='<p class="note">All figures '+CUR+', each month converted at that month\'s own rate'+
     (anyOpen?' · <b>*</b> still open, may change until the month is closed':'')+
     '. Tap <b>Total revenue</b> to split it into earnings and other revenue, or <b>Costs</b> to see the categories. '+
     'The column adds up: Net = Total revenue − Costs − Fee.</p></div>';

  /* ---- occupancy & ADR ---- */
  h+='<div class="card"><div class="chead"><h3>Your flat — occupancy &amp; ADR</h3>'+timeSeg('occ')+'</div>'+
     '<div class="csub">bars = share of nights booked · line = average nightly rate, earnings ÷ nights</div>'+
     occChart()+'</div>';

  /* ---- by channel ---- */
  var lbl={revenue:'revenue',stays:'stays',nights:'nights',net:'net profit'}[CHAN];
  h+='<div class="card"><div class="chead"><h3>Your flat — '+lbl+' by month</h3>'+
     '<div class="rowbtns">'+seg([['revenue','Revenue'],['stays','Stays'],['nights','Nights'],['net','Net profit']],CHAN,'setChan')+
     timeSeg('chan')+'</div></div>'+
     '<div class="csub">'+(CHAN==='net'
        ? 'what you were paid after costs and the management share — a month total, not something any one channel earns'
        : 'split by the channel each booking came through')+'</div>'+
     chanChart()+'</div>';

  $('#app').innerHTML=h;
}

AUTH_ON_LOGIN = boot; if (authGuard()) boot();
</script>
</body>
</html>
