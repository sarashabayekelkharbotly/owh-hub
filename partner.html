<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hub · Your numbers</title>
<link rel="icon" href="hub-logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
:root{--blush:#f9f0f0;--red:#cc5f5f;--ink:#1a1a1a;--soft:#6b6b6b;--white:#fff;--line:#ecdede;--grey:#f6f2f2;--g:#3a7d4d;--greentint:#e4efe7;
--d-air:#e0798a;--d-book:#4a7fb5;--d-dir:#6f9a76}
*{box-sizing:border-box}
body{margin:0;background:#dcd0d0;font-family:'Cairo',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 0 40px}
.frame{max-width:460px;margin:16px auto;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 24px rgba(0,0,0,.10);overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;white-space:nowrap;flex:none}
.brand .logo{width:26px;height:26px;border-radius:6px;flex:none}
.brand .bs{font-weight:600;font-size:11.5px;color:var(--soft);border-left:1px solid var(--line);padding-left:7px}
.rib{font-size:10px;color:#4c4040;text-align:right;line-height:1.5}
.body{padding:13px;background:var(--blush)}
.h1{font-size:18px;font-weight:700;margin:0 0 9px}
.h1 .sub{font-size:12px;font-weight:400;color:var(--soft)}
.kpis{width:100%;border-collapse:separate;border-spacing:6px 0}
.kpis td{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:8px 10px;width:50%;vertical-align:top}
.kpi-l{font-size:10px;color:var(--soft)}
.kpi-v{font-size:20px;font-weight:700;line-height:1.1;margin:1px 0}
.kpi-s{font-size:10px;color:var(--soft)}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:9px}
.card h3{margin:0 0 7px;font-size:13px;font-weight:700}
.pill{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.pa{background:#efe4d4;color:#8a6420}.pf{background:var(--greentint);color:var(--g)}
table.d{width:100%;border-collapse:collapse;font-size:12px}
table.d th,table.d td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
table.d th{font-size:9.5px;color:var(--soft);font-weight:700}
table.d .r{text-align:right}table.d .c{text-align:center}
table.d tr.tot td{font-weight:700}
table.d tr.subrow td{color:#7a6a6a;font-size:11px;background:#fbf7f7}
table.d tr.subrow td:first-child{padding-left:18px}
table.d tr.net td{font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.g{color:var(--g)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.d-air{background:var(--d-air)}.d-book{background:var(--d-book)}.d-dir{background:var(--d-dir)}
.drillable{cursor:pointer}.drillable:hover{background:#faf5f5}
.drill{background:#fbf7f7;border:1px solid var(--line);border-radius:8px;margin:2px 0 4px}
.drill table{width:100%;border-collapse:collapse;font-size:10.5px}
.drill td{padding:2px 7px;border:0;color:#5a4d4d}
.drill tr.foot td{font-weight:700;color:var(--soft);font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;padding-top:5px}
tr.cat td:first-child{padding-left:16px}
.btn{font-family:inherit;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{background:#faf5f5}
.drill tr.foot2 td{font-weight:700;border-top:1px solid var(--line);padding-bottom:4px}
.note{font-size:10px;color:var(--soft);line-height:1.55;margin:7px 0 0}
.muted{color:var(--soft);font-size:11px}
.err{background:#f6e3e3;border:1px solid #e6b9b9;border-radius:10px;padding:12px;font-size:13px}
.demo{background:#efe9f5;border:1px solid #d9cbe8;border-radius:10px;padding:7px 11px;font-size:10.5px;color:#5c4a72;margin-bottom:9px}
select{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--white)}
.ctl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{font-family:inherit;font-size:12px;font-weight:600;border:0;background:var(--white);color:var(--soft);padding:5px 11px;cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.tabbar{display:flex;background:var(--white);border-top:1px solid var(--line)}
.tabbar .tab{min-width:0;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin:0 0 6px;-webkit-overflow-scrolling:touch}
.chips button{font-family:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--white);color:var(--soft);border-radius:16px;padding:4px 12px;white-space:nowrap;cursor:pointer;flex:none}
.chips button.on{background:var(--red);color:#fff;border-color:var(--red)}
.chips button.pre{font-style:italic}
.pls{display:flex;gap:6px;margin:9px 0 0;flex-wrap:wrap}
.pls button{font-family:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--white);color:var(--soft);border-radius:16px;padding:4px 12px;cursor:pointer}
.pls button.on{background:#f3e0e0;color:var(--red);border-color:#e6b9b9}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.kt{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.kt .kpi-v{font-size:19px}
.pbar{height:8px;border-radius:5px;background:#efe6e6;margin:5px 0 3px;overflow:hidden}.pbar i{display:block;height:8px;border-radius:5px;background:var(--red)}
.cal{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:6px}.cal i{display:block;height:13px;border-radius:3px;background:#efe6e6}.cal i.b{background:var(--red)}.cal i.r{background:#e0b25c}
.tabbar .tab{flex:1;text-align:center;padding:7px 2px 8px;font-size:10px;color:var(--soft);text-decoration:none;font-weight:600;border-top:2px solid transparent}
.tabbar .tab .ti{display:block;font-size:17px;line-height:1.15;margin-bottom:1px}
.tabbar .tab.active{color:var(--red);border-top-color:var(--red)}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="brand"><img class="logo" src="hub-logo.png" alt="The Hub"><span class="bn">The Hub</span><span class="bs">Your numbers</span></div>
    <div class="rib" id="rib"></div>
  </div>
  <div class="body"><div id="app"><div class="card"><span class="muted">Loading…</span></div></div></div>
  <nav class="tabbar" id="tabbar">
    <a class="tab" id="tb-overview" href="#overview" onclick="setTab('overview');return false"><span class="ti">🏠</span>Overview</a>
    <a class="tab" id="tb-bookings" href="#bookings" onclick="setTab('bookings');return false"><span class="ti">📅</span>Bookings</a>
    <a class="tab" id="tb-statement" href="#statement" onclick="setTab('statement');return false"><span class="ti">📄</span>Statement</a>
    <a class="tab" href="partner-history.html"><span class="ti">📊</span>Statistics</a>
    <a class="tab" id="tb-ask" href="#ask" onclick="setTab('ask');return false"><span class="ti">💬</span>Ask OWH</a>
  </nav>
</div>

<script src="auth.js"></script>
<script src="partner-core.js?v=3"></script>
<script>
/* SCREEN 6 — Partner, this month. Built to the mock-up (OWH_final_2.html §6):
   4 KPIs · the month's stays · statement with this month beside last month · drill-down per cost line.
   The wall is enforced on the SERVER — a partner session returns only their flat, rent stripped, the
   internal split nulled, every open month forced to in-progress. This page never holds what it must
   not show. Costs stay in EGP and revenue in USD, exactly as the sheet holds them and as the close
   screen displays them — converting would invent precision the sheet doesn't have. */
AUTH_ROLE = 'partner';

var DATA=null, MONTH=null, OPEN={}, CUR='USD';
var TAB='overview', SUB='stmt';          // which of the five tabs is open, and which switch inside «Statement»
(function(){ try{ var hh=(location.hash||'').replace('#','').split('/'); if(['overview','bookings','statement','ask'].indexOf(hh[0])>-1){ TAB=hh[0]; if(hh[1]==='settlement') SUB='settle'; else if(hh[1]==='months') SUB='months'; } }catch(e){} })();
function setTab(t){ TAB=t; try{ history.replaceState(null,'','#'+t+(t==='statement'&&SUB!=='stmt'?'/'+(SUB==='settle'?'settlement':'months'):'')); }catch(e){} render(); try{ window.scrollTo(0,0); }catch(e){} }
function setSub(x){ SUB=x; try{ history.replaceState(null,'','#statement'+(x==='stmt'?'':'/'+(x==='settle'?'settlement':'months'))); }catch(e){} render(); }
/* the month chips stop at next month — the sheet carries empty rows far into the future that would only be noise */
function chipLimit(){ var c=(DATA&&DATA.meta&&DATA.meta.currentMonth)||''; if(!c) return '9999'; var y=+c.slice(0,4), mo=+c.slice(5,7)+1; if(mo>12){ y++; mo=1; } return y+'-'+('0'+mo).slice(-2); }
function setMonth(m){ MONTH=m; OPEN={}; render(); }
function openMonth(m){ MONTH=m; OPEN={}; TAB='statement'; SUB='stmt'; try{ history.replaceState(null,'','#statement'); }catch(e){} render(); try{ window.scrollTo(0,0); }catch(e){} }
var OBJS=null, OBJ_DRAFT='', OBJ_TYPE='question', OBJ_MSG='', OBJ_BUSY=false;     // her questions & objections: the log, the unsent draft, the last result
try{ CUR=localStorage.getItem('owh_cur')||'USD'; }catch(e){}          // the choice sticks between visits

/* ---- one currency, everywhere ----------------------------------------------------------------
   The sheet holds revenue in USD and costs in EGP, each month converted at THAT month's rate. Using
   today's rate on a cost paid in February would quietly restate a closed month, so instead we recover
   the month's own rate from its own numbers: the P&L's Net already has the EGP costs converted, so
   (EGP costs) ÷ (their USD value) gives back exactly the rate the sheet used. No rate is hardcoded
   and none is guessed — if a month has no EGP costs to divide by, we fall back to the current rate. */
function fxNow(){ return (DATA.meta.fx&&DATA.meta.fx.current)||1; }
function rateFor(r){
  if(!r) return fxNow();
  var egp=0, usd=0;
  (r.costs||[]).forEach(function(c){ if(!c.amount) return; if(c.currency==='EGP') egp+=c.amount; else usd+=c.amount; });
  var allCostsUsd=r.revenue.total-r.net, egpAsUsd=allCostsUsd-usd;
  return (egp>0 && egpAsUsd>0.01) ? egp/egpAsUsd : fxNow();
}
function conv(v,cur,r){ if(v==null||!isFinite(v)) return null; if(CUR===cur) return v;
  var rate=rateFor(r); return CUR==='USD' ? v/rate : v*rate; }
function sym(){ return CUR==='USD' ? '$' : 'EGP '; }
function setCur(c){ CUR=c; try{ localStorage.setItem('owh_cur',c); }catch(e){} render(); }
var $=function(s){return document.querySelector(s);};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function esc(s){return (s||'').toString().replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
/* Dollars carry 2 decimals, EGP none. An EGP cost converted to dollars is small — a 20 EGP line is
   $0.41 — and at whole dollars a column of perfectly real costs printed as "0". */
function fmt(n){ if(n==null||!isFinite(n)) return '—';
  var d=(CUR==='USD')?2:0;
  return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmt2(n){ if(n==null||!isFinite(n)) return '—'; return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function monLabel(ym){ var p=(ym||'').split('-'); return p.length===2 ? MON[(+p[1])-1]+' '+p[0] : ym; }
function monShort(ym){ var p=(ym||'').split('-'); return p.length===2 ? MON[(+p[1])-1] : ym; }
function dayLabel(d){ var m=(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[3])+' '+MON[(+m[2])-1] : (d||''); }

function boot(){ fetchOnce().then(onData).catch(function(e){ if(e&&e.message==='AUTH')return;
  setTimeout(function(){ fetchOnce().then(onData).catch(function(e2){ if(e2&&e2.message==='AUTH')return; showErr(e2); }); },800); }); }
/* 👁 VIEW AS PARTNER (Sarah 2026-10-11). An admin opens this screen as a partner home of their choice — ?as=<home>
   (remembered for this tab, so This month ⇄ History keep it), or ?as=demo for the demo. The server builds the very
   payload that home's partner gets (asPartner), and keeps the admin signed in as themselves. With no choice yet, the
   admin is shown the list of partner homes. */
var PREVIEW=(function(){ var q=null; try{ q=new URLSearchParams(location.search).get('as'); }catch(e){}
  try{ if(q!==null){ sessionStorage.setItem('owh_preview_as',q); return q; } return sessionStorage.getItem('owh_preview_as')||''; }catch(e){ return q||''; } })();
function chk_(j){ if(!j||!j.ok)throw new Error(j&&j.error||'bad'); return j; }
function fetchOnce(){
  if(!isAdmin()) return api('props_get_all',null).then(chk_);
  if(PREVIEW==='demo') return api('props_get_all',{scope:'demo'}).then(chk_);
  if(PREVIEW) return api('props_get_all',{asPartner:PREVIEW}).then(function(j){
    if(j&&j.ok===false&&/Not a partner home/.test(j.error||'')){ try{ sessionStorage.removeItem('owh_preview_as'); }catch(e){} PREVIEW=''; return api('props_get_all',{asPartner:'*'}).then(chk_); }
    return chk_(j); });
  return api('props_get_all',{asPartner:'*'}).then(chk_);
}
function previewChoose(id){ try{ sessionStorage.setItem('owh_preview_as',id); }catch(e){} location.href=location.pathname+'?as='+encodeURIComponent(id); }
function renderChooser(list){
  $('#rib').innerHTML=authWho();
  $('#app').innerHTML='<div class="card"><h3>👁 View as partner</h3><p class="note">Pick a home to see its partner page exactly as the partner sees it. You stay signed in as yourself.</p>'+
    ((list||[]).length ? (list||[]).map(function(x){ return '<button class="pvbtn" onclick="previewChoose(\''+(x.demo?'demo':esc(x.id))+'\')" style="display:block;width:100%;margin:6px 0;padding:10px;border:1px solid #ecdede;border-radius:10px;background:#fff;font:inherit;font-weight:700;cursor:pointer;text-align:left">'+esc(x.name)+(x.demo?' <span class="muted">(demo)</span>':'')+'</button>'; }).join('')
      : '<p class="muted">No home has a partner yet.</p>')+
    '<p style="margin-top:10px"><a href="today.html">← Back to the Hub</a></p></div>';
}
function previewBar(){
  if(!isAdmin()||!DATA||!DATA.meta) return;
  var f=(DATA.meta.preview&&DATA.meta.preview.flat)||(DATA.meta.demo&&DATA.meta.demo.active&&DATA.meta.demo.flat)||''; if(!f) return;
  var b=document.getElementById('pvBar');
  if(!b){ b=document.createElement('div'); b.id='pvBar'; var app=document.getElementById('app'); app.parentNode.insertBefore(b,app); }
  b.innerHTML='<div style="background:#fdf1d8;border:1px solid #ecd39a;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:12.5px;font-weight:700">👁 Viewing as the partner of <b>'+esc(flatName())+'</b> — a preview, read-only. You are signed in as '+esc((ME&&ME.user)||'')+'. '+
    '<a href="#" onclick="try{sessionStorage.removeItem(\'owh_preview_as\')}catch(e){};location.href=location.pathname;return false">Switch home</a> · <a href="today.html">← Back to the Hub</a></div>';
}
function isAdmin(){ return !!(ME && ME.role==='admin'); }
function showErr(e){ if(DATA)return; $('#app').innerHTML='<div class="err">Couldn\'t load your numbers.<br><span class="muted">'+esc(e&&e.message||'')+'</span></div>'; }
function onData(j){ if(j.partners){ renderChooser(j.partners); return; } DATA=j.data; DATA._gen=j.generatedAt; if(j.me) ME=j.me; initMonth(); render(); previewBar(); loadObjs(); }

function myFlat(){ return (ME&&ME.flat) || (DATA.meta.preview&&DATA.meta.preview.flat) || (DATA.meta.flatsOrder&&DATA.meta.flatsOrder[0]) || ''; }
function flatName(){ var f=myFlat(), m=(DATA.flats||[]).filter(function(x){return x.id===f;})[0]; return (m&&m.name)||f; }
function monthsAvailable(){ var f=myFlat(); return DATA.pnl&&DATA.pnl[f] ? Object.keys(DATA.pnl[f]).sort() : []; }
function initMonth(){ var ms=monthsAvailable(); if(MONTH&&ms.indexOf(MONTH)>=0) return;
  /* open on TODAY's month, never a future one (Sarah 2026-09-17: the P&L carries pre-built rows
     into December, so "latest" opened the statement on a month that hasn't happened yet).
     Future months stay in the dropdown for whoever wants to peek. */
  var cm=(DATA.meta&&DATA.meta.currentMonth)||'';
  if(cm&&ms.indexOf(cm)>=0){ MONTH=cm; return; }
  var past=cm?ms.filter(function(m){ return m<=cm; }):ms;
  MONTH=past.length?past[past.length-1]:(ms.length?ms[ms.length-1]:null); }
function recFor(m){ var f=myFlat(); return (DATA.pnl&&DATA.pnl[f]&&DATA.pnl[f][m])||null; }
function prevMonth(){ var ms=monthsAvailable(), i=ms.indexOf(MONTH); return i>0?ms[i-1]:null; }
function daysIn(ym){ return new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(); }

/* ---- the month's stays (mock-up: Guest · In · Out · N · Channel · Paid) ---- */
function staysIn(ym){
  var f=myFlat();
  return (DATA.stays||[]).filter(function(s){
    var st=(s.status||'').toLowerCase();
    if(s.flat!==f || s.portal==='Blocked') return false;
    if(st.indexOf('cancel')>-1||st.indexOf('block')>-1) return false;
    if(!s.checkIn||!s.checkOut) return false;
    return s.checkIn.slice(0,7)<=ym && s.checkOut.slice(0,7)>=ym;      // any stay touching the month
  }).sort(function(a,b){ return a.checkIn<b.checkIn?-1:1; });
}
/* Nights of ONE stay that fall inside the month. A stay running 3 Jun → 19 Jul belongs to both
   months, and the P&L recognises each month's share separately — so the screen must too. */
function nightsOf(s,ym){
  var lo=new Date(ym+'-01T00:00:00'), hi=new Date(+ym.slice(0,4), +ym.slice(5,7), 1), n=0;
  var ci=new Date(s.checkIn.slice(0,10)+'T00:00:00'), co=new Date(s.checkOut.slice(0,10)+'T00:00:00');
  for(var d=new Date(Math.max(ci,lo)); d<co && d<hi; d.setDate(d.getDate()+1)) n++;
  return n;
}
function nightsIn(ym){ return staysIn(ym).reduce(function(a,s){ return a+nightsOf(s,ym); },0); }
/* This month's share of a stay's value, apportioned by nights — the same basis the sheet uses, so
   the column adds up to the revenue line instead of overstating it by the part earned elsewhere. */
function earnedIn(s,ym){ var tot=s.nights||nightsOf(s,ym)||1; return (s.allIn||0)*nightsOf(s,ym)/tot; }

/* The statement's money and rows are defined ONCE, in partner-core.js, and shared with the Statistics screen and both CSVs.
   A stay's money for one month (gross / fees / net) is PC.parts. */
function stayParts(s,ym){ return PC.parts(s,ym); }
function fmtN(n){ if(n==null||!isFinite(n)) return '—'; return Math.round(n).toLocaleString('en-US'); }

/* ---- the Operating Costs Budget (clause 6.5.1): US$45 × turnovers in the month + US$60, a CEILING not a charge.
   A turnover = a cleaning that actually took place, i.e. a cleaning (laundry) SUBMISSION for the home that month — the record Annex C
   divides the cleaning cost by (Sarah 2026-10-13). Not the schedule and not the number of stays. Furniture is the purchase of items (5.2/5.3), not an operating cost (6.4), so it never counts against the ceiling. ---- */
function turnoversIn(ym){ var m=PC.model(DATA,myFlat(),ym); return m&&m.k.turn!=null?m.k.turn:0; }
function budgetFor(ym){
  var r=recFor(ym); if(!r) return null;
  var tn=turnoversIn(ym), ceil=45*tn+60, spent=0;
  (r.costs||[]).forEach(function(c){ if(!c.amount||c.key==='furniture') return; spent+=(c.currency==='USD')?c.amount:c.amount/rateFor(r); });
  return { r:r, tn:tn, ceil:ceil, spent:spent, left:ceil-spent };
}
/* ---- publication and objection (clauses 8.2.2, 8.4): binding unless she objects within 7 Business Days of
   publication; a Business Day is any day but Friday, Saturday or an Egyptian public holiday (holidays are not
   counted here, so the real deadline can be a day or two later). ---- */
function addBizDays(ymd,n){
  var d=new Date(ymd.slice(0,10)+'T12:00:00');
  while(n>0){ d.setDate(d.getDate()+1); var w=d.getDay(); if(w!==5 && w!==6) n--; }
  return d;
}
function longDay(d){ return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
/* a supporting-document request (clause 8.3) goes through the same written form as a question, so it is logged too */
function askDoc(enc){ OBJ_DRAFT=decodeURIComponent(enc); OBJ_TYPE='question'; TAB='ask'; try{ history.replaceState(null,'','#ask'); }catch(e){} render(); var t=document.getElementById('objText'); if(t){ t.scrollIntoView({behavior:'smooth',block:'center'}); t.focus(); } }

/* ---- questions & objections (Sarah 2026-10-13: written INSIDE the Hub, kept in a log, alerting OWH and confirming to her) ---- */
function loadObjs(){ if(isAdmin()) return;                         // an admin preview never writes or reads her log
  api('props_objections_mine').then(function(j){ if(j&&j.ok){ OBJS=j.items||[]; render(); } }).catch(function(){}); }
function sendObjection(){
  if(OBJ_BUSY||isAdmin()) return;
  var ta=document.getElementById('objText'); if(ta) OBJ_DRAFT=ta.value;
  var ty=document.getElementById('objType'); if(ty) OBJ_TYPE=ty.value;
  if((OBJ_DRAFT||'').trim().length<3){ OBJ_MSG='Please write your message first.'; render(); return; }
  OBJ_BUSY=true; OBJ_MSG='Sending…'; render();
  api('props_objection_submit',{month:MONTH,type:OBJ_TYPE,text:OBJ_DRAFT}).then(function(j){
    OBJ_BUSY=false;

  var blob=new Blob(['\uFEFF'+out],{type:'text/csv;charset=utf-8;'});       // BOM so Excel reads any Arabic correctly
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=flatName().replace(/\s+/g,'-')+'-'+name+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

/* Cost descriptions are our internal working notes. A partner wants "what was this", not our
   reasoning — so drop bracketed asides and keep the opening clause. */
function shortDesc(t){
  var s=(t||'').replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  if(s.length>52){
    var cut=s.slice(0,52), b=Math.max(cut.lastIndexOf(', '), cut.lastIndexOf(' — '), cut.lastIndexOf('; '));
    s=(b>18 ? cut.slice(0,b) : cut.replace(/\s+\S*$/,''))+'…';
  }
  return s||'—';
}

function balWords(v,r){ var s=sym()+fmt(conv(Math.abs(v),'USD',r));

/* WHERE THE BALANCE COMES FROM (Sarah 2026-10-10: "a breakdown drop down for the balance with OWH").
   Month by month from the start, each block adds up on its own:
     brought forward + prepayments + the month's result (revenue − each cost − fee) ± float = balance after
   and the next block starts from this block's "balance after", so the chain reconciles to the figure on
   the Settlement card. "Float" is the part of a good month that was kept back (or of a bad month that the
   float absorbed) rather than moved against the balance. Every cost line opens onto its entries. */
function balanceBreakdown(upTo){
  var f=myFlat(), byM=(DATA.pnl&&DATA.pnl[f])||{};
  var ms=Object.keys(byM).sort().filter(function(m){ return m<=upTo && byM[m].partnerLedger; });
  var prev=0, out='', R=function(a,b,cls){ return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+a+'</td><td style="text-align:right;white-space:nowrap">'+b+'</td></tr>'; };
  var S=function(v,r){ return (v>0.005?'+ ':(v<-0.005?'− ':''))+sym()+fmt(conv(Math.abs(v),'USD',r)); };      // signed, in the chosen currency
  ms.forEach(function(m){
    var r=byM[m], pl=r.partnerLedger, rev=(r.revenue&&r.revenue.total)||0, opening=prev, prep=pl.prepay||0, res=pl.monthResult||0;
    var adj=Math.round((pl.balanceAfter-opening-prep-res)*100)/100;
    prev=pl.balanceAfter;
    var costs=(r.costs||[]).filter(function(c){ return c.amount; });
    if(!prep && !rev && !costs.length && Math.abs(adj)<0.005 && Math.abs(res)<0.005) return;     // a month that moved nothing says nothing
    out+='<tr class="foot"><td colspan="2">'+monLabel(m)+'</td></tr>';
    if(Math.abs(opening)>0.005) out+=R('brought forward',S(opening,r));
    if(prep) out+=R('your prepayments received',S(prep,r));
    if(rev) out+=R('revenue',S(rev,r));
    costs.forEach(function(c){
      var usd=conv(c.amount,c.currency,r), list=txFor(m,c.key);
      out+=R(LABEL[c.key]||c.key,'− '+sym()+fmt(usd));
      list.forEach(function(t){ out+='<tr><td style="padding-left:16px;color:#7a6a6a">'+dayLabel(t.date)+' · '+esc(shortDesc(t.desc))+'</td>'+
        '<td style="text-align:right;color:#7a6a6a;white-space:nowrap">'+fmt(conv(t.amount,t.currency,r))+'</td></tr>'; });
    });
    if(pl.fee>0.005) out+=R('management fee — '+Math.round((pl.feePct||0)*100)+'%','− '+sym()+fmt(conv(pl.fee,'USD',r)));
    out+=R('<b>month result</b>','<b>'+(res<0?'− ':'')+sym()+fmt(conv(Math.abs(res),'USD',r))+'</b>');
    if(Math.abs(adj)>0.005) out+=R(adj<0?'kept in the float / payable to you':'covered from the float',(adj<0?'− ':'+ ')+sym()+fmt(conv(Math.abs(adj),'USD',r)));
    out+=R('<b>balance after '+monShort(m)+'</b>','<b>'+balWords(pl.balanceAfter,r)+'</b>','foot2');
  });
  if(!out) return '<table><tr><td>Nothing has moved the balance yet.</td></tr></table>';
  return '<table>'+out+'</table><p class="note" style="padding:0 7px 5px">Minus = owed to OWH, plus = held for you. Each cost line lists the entries it is made of.</p>';
}

         '<td class="c">'+nm+'</td><td style="white-space:nowrap"><span class="dot '+dotFor(s.portal)+'"></span>'+esc(s.portal||'Direct')+'</td>'+
         (rv?'<td class="r">—</td><td class="r">—</td><td class="r">—</td></tr>'
            :'<td class="r">'+fmt(conv(p.gross,'USD',r))+'</td><td class="r">'+(p.fees>0.005?fmt(-conv(p.fees,'USD',r)):'—')+'</td><td class="r">'+fmt(conv(p.net,'USD',r))+'</td></tr>');
    });
    vb+='<tr class="tot"><td colspan="4">Total</td><td class="r">'+fmt(conv(tG,'USD',r))+'</td><td class="r">'+(tF>0.005?fmt(-conv(tF,'USD',r)):'—')+'</td><td class="r">'+fmt(conv(tN,'USD',r))+'</td></tr>';
    vb+='</table>';
    vb+='<p class="note" style="margin-top:5px">Gross = what the guest paid; Fees = platform commission, card/processing charges and taxes on them; Net = gross − fees.'+
       (spans?' A stay crossing into another month is counted here only for the nights inside '+monLabel(MONTH)+'.':'')+' The Net column is the earnings line of the statement.'+(anyReview?' A <b>review booking</b> is a booking made to earn a review: it is outside revenue, so it carries no fee and no money in the columns; its nights still count for occupancy but not for the average nightly rate. If you paid for it, what you paid is returned to you on the statement.':'')+'</p>';
  }
  vb+='</div>';


    vb+='<div class="card"><h3>Nights booked in '+monLabel(MONTH)+' <span class="muted" style="float:right">'+Math.round(cm.k.occ*100)+'% occupied</span></h3><div class="cal">'+(function(){
         var n=PC.daysIn(MONTH), out='', sts=staysIn(MONTH);
         for(var d=1;d<=n;d++){ var ds=MONTH+'-'+('0'+d).slice(-2), cls='';
           sts.forEach(function(s){ if(s.checkIn.slice(0,10)<=ds && ds<s.checkOut.slice(0,10)) cls=(s.review?'r':(cls==='r'?'r':'b')); });
           out+='<i class="'+cls+'" title="'+d+' '+monShort(MONTH)+'"></i>'; }
         return out; })()+'</div><p class="note">Filled squares are booked nights, one per day of the month; amber is a review booking.</p></div>';
    var chN={Airbnb:0,Booking:0,Direct:0}, chT=0;
    staysIn(MONTH).forEach(function(s){ var n=nightsOf(s,MONTH), k=dotFor(s.portal)==='d-air'?'Airbnb':(dotFor(s.portal)==='d-book'?'Booking':'Direct'); chN[k]+=n; chT+=n; });
    var chP={}; (function(){ var ks=['Airbnb','Booking','Direct'], fl=0, rem=[]; ks.forEach(function(k){ var ex=chT?100*chN[k]/chT:0; chP[k]=Math.floor(ex); fl+=chP[k]; rem.push([k,ex-Math.floor(ex)]); }); rem.sort(function(a,b){ return b[1]-a[1]; }); for(var q=0;q<100-fl&&chT;q++) chP[rem[q%3][0]]++; })();
    if(chT) vb+='<div class="card"><h3>Channel mix <span class="muted" style="float:right">by nights</span></h3><table class="d">'+
       [['Airbnb','d-air'],['Booking','d-book'],['Direct','d-dir']].map(function(c){ return chN[c[0]]?'<tr><td><span class="dot '+c[1]+'"></span>'+c[0]+(c[0]==='Booking'?'.com':'')+'</td><td class="r">'+fmtN(chN[c[0]])+' nights</td><td class="r">'+chP[c[0]]+'%</td></tr>':''; }).join('')+'</table></div>';
    vb+='<div class="card"><h3>Download</h3><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="exportBookings()">All bookings</button></div><p class="note">A CSV with every booking: dates, nights, channel, gross, fees, net, and which are review bookings.</p></div>';

  } else if(TAB==='statement'){
    /* ============ STATEMENT — the statement, how it settles, all months ============ */
    vb+='<div class="pls"><button class="'+(SUB==='stmt'?'on':'')+'" onclick="setSub(\'stmt\')">Statement</button><button class="'+(SUB==='settle'?'on':'')+'" onclick="setSub(\'settle\')">Settlement</button><button class="'+(SUB==='months'?'on':'')+'" onclick="setSub(\'months\')">All months</button></div>';
    if(SUB==='stmt'){
  vb+='<div class="card"><h3>Statement — '+monShort(MONTH)+(pm?' vs '+monShort(pm):'')+'</h3><table class="d">'+
     '<tr><th>Line</th><th class="r">'+monShort(MONTH)+'</th>'+(pm?'<th class="r">'+monShort(pm)+'</th>':'')+'</tr>';
  stDefs.forEach(function(d){
    if(d.sec){ vb+='<tr class="subrow"><td colspan="'+ncol+'" style="font-weight:700">'+d.sec+'</td></tr>'; return; }
    if(d.cat && !cOpen) return;
    var cls=(d.cls==='sub'?'subrow':(d.cls||'')), lab=d.label, click='';
    if(d.id==='costs'){ cls+=' drillable'; click=' onclick="toggleCosts()"'; lab+=' '+(cOpen?'▾':'▸'); }
    if(d.cat){ var can=txFor(MONTH,d.key).length>0 || (pm&&txFor(pm,d.key).length>0);
      if(can){ cls+=' drillable'; click=' onclick="toggleDrill(\''+d.key+'\')"'; lab+=' '+(OPEN[d.key]?'▾':'▸'); } }
    vb+='<tr class="'+cls+'"'+click+'><td>'+lab+'</td><td class="r">'+cellOf(d,cm)+'</td>'+(pm?'<td class="r">'+cellOf(d,cp)+'</td>':'')+'</tr>';
    if(d.cat && OPEN[d.key]) vb+=drillBlock(d.key);
  });
  vb+='</table>';


      vb+='<p class="note">Tap a cost category to see what it is made of — date, description, amount. '+
         'Everything is shown in <b>'+CUR+'</b>, each month converted at that month\'s own rate ('+
         fmt(rateFor(r))+' EGP/USD for '+monLabel(MONTH)+'), so a closed month never changes when the rate moves.'+
         (isFinal?'':' This month is still open, so figures can change until it is closed.')+'</p></div>';
  vb+='<div class="card"><h3>Download</h3><div style="display:flex;gap:6px;flex-wrap:wrap">'+
     '<button class="btn" onclick="exportStatement()">This month\'s statement</button>'+
     '<button class="btn" onclick="exportBookings()">All bookings</button>'+
     '<button class="btn" onclick="exportCosts()">All cost entries</button></div>'+
     '<p class="note">CSV files that open in Excel or Google Sheets — the statement, every booking with its gross, fees and net, and every cost entry.</p></div>';


    } else if(SUB==='settle'){
      vb+='<div class="card">';
      if(cm.led){
        var pbF=cm.led.target>0?Math.max(0,Math.min(100,100*cm.led.floatAfter/cm.led.target)):0;
        vb+='<h3>Security float <span class="muted" style="float:right">'+mv(cm.led.floatAfter)+' of '+mv(cm.led.target)+'</span></h3><div class="pbar"><i style="width:'+pbF.toFixed(0)+'%"></i></div>';
      }
  /* ---- Clause 7 — what happens to the month result: the waterfall, every step shown. The SAME partnerLedger the admin Close shows. ---- */
  if(cm.led){
    var sL=function(v){ return (v>0.005?'+ ':(v<-0.005?'− ':''))+sym()+fmt(conv(Math.abs(v),'USD',cm.r)); };
    var pL=function(v){ return sym()+fmt(conv(v,'USD',cm.r)); };
    var PLAIN={f_open:1,f_after:1,p_pay:1,p_paid:1,p_still:1};
    vb+='<h3 style="margin:12px 0 6px">Settlement — what happens to the month result</h3><table class="d">';
    seDefs.forEach(function(d){
      if(d.sec) return;
      if(d.sub){ vb+='<tr><th colspan="2">'+d.sub+'</th></tr>'; return; }
      var v=d.get(cm), cls=(d.cls==='sub'?'subrow':(d.cls||'')), val=PLAIN[d.id]?pL(v):sL(v);
      if(d.id==='f_after') val=pL(v)+' of '+pL(cm.led.target);
      if(d.id==='bal'){
        vb+='<tr class="net drillable" onclick="toggleDrill(\'__bal\')"><td>'+d.label+' '+(OPEN['__bal']?'▾':'▸')+'</td><td class="r">'+balWords(v,cm.r)+'</td></tr>';
        if(OPEN['__bal']) vb+='<tr><td colspan="2" style="padding:2px 4px"><div class="drill">'+balanceBreakdown(MONTH)+'</div></td></tr>';
        return;
      }
      vb+='<tr class="'+cls+'"><td>'+(d.cls==='sub'?'<span class="muted">'+d.label+'</span>':d.label)+'</td><td class="r">'+val+'</td></tr>';
    });
    vb+='</table><p class="note">Minus = owed to OWH. Per clause 7: each month\'s result first pays down what you owe (set-up costs and advances), then fills the security float to its target; only the remainder is paid to you. In a loss month any prepayment absorbs it first, then the float. The float stays yours and is returned at the end, less anything properly owing (7.1.4).</p>';
  }

      if(!cm.led) vb+='<p class="note" style="margin:0">The settlement for this month will appear once the month has a result to settle.</p>';
      vb+='</div>';
  /* ---- operating costs budget — clause 6.5.1 ---- */
  var bg=budgetFor(MONTH);
  if(bg && preLaunch(MONTH)){
    vb+='<div class="card"><h3>Operating costs budget — '+monShort(MONTH)+'</h3><p class="note" style="margin:0;font-size:11.5px;color:var(--ink)">'+
       (commenceOf()?'This month is before the commencement date ('+longDay(new Date(commenceOf()+'T12:00:00'))+'): costs now are set-up costs, repayable under clause 5.3, and the monthly ceiling does not apply yet.'
                    :'The commencement date has not been set yet. Costs so far are set-up costs, repayable under clause 5.3; the monthly operating-costs ceiling (clause 6.5.1) starts on the commencement date.')+'</p></div>';
  } else if(bg){
    var bL=function(v){ return sym()+fmt(conv(v,'USD',bg.r)); }, over=bg.left<-0.005;
    vb+='<div class="card"><h3>Operating costs budget — '+monShort(MONTH)+'</h3><table class="d">'+
       '<tr><td>Turnovers this month</td><td class="r">'+bg.tn+'</td></tr>'+
       '<tr><td>Ceiling — $45 × '+bg.tn+' + $60</td><td class="r">'+bL(bg.ceil)+'</td></tr>'+
       '<tr><td>Operating costs so far</td><td class="r">'+bL(bg.spent)+'</td></tr>'+
       '<tr class="net"><td>'+(over?'Above the ceiling by':'Room left under the ceiling')+'</td><td class="r '+(over?'':'g')+'"'+(over?' style="color:var(--red)"':'')+'>'+bL(Math.abs(bg.left))+'</td></tr></table>'+
       '<p class="note">'+(over
         ? 'Costs above the ceiling need your written approval (clause 6.5.3); anything needed for safety, habitability or a confirmed booking can be paid first and is explained to you within 48 hours (6.5.4). '
         : 'This is a ceiling on what OWH may spend without asking you, not a charge — you pay only the costs actually incurred (6.5.2). ')+
       'Furniture and set-up purchases are not operating costs and are not counted here. The ceiling rises each anniversary of the start date.</p></div>';
  }


    } else {
      vb+='<div class="card"><h3>All months</h3><table class="d">'+ms.slice().reverse().map(function(m){
           var mm=PC.model(DATA,myFlat(),m); if(!mm) return '';
           var fin=mm.status==='final', pb=mm.closedAt?' · published '+dayLabel(mm.closedAt):'';
           return '<tr class="drillable" onclick="openMonth(\''+m+'\')"><td>'+monLabel(m)+(preLaunch(m)&&m<=((DATA.meta&&DATA.meta.currentMonth)||'9999')?' <span class="muted">· pre-launch</span>':'')+
                  '<div class="muted">'+(fin?'final':'in progress')+pb+'</div></td><td class="r">'+mv(mm.v.res,mm)+'<div class="muted">month result</div></td></tr>'; }).join('')+'</table>'+
         '<p class="note">Tap a month to open its statement.</p></div>';
    }

  } else {
    /* ============ ASK OWH — questions, objections, documents ============ */
    vb+=objCard(r,isFinal);
    vb+='<div class="card"><h3>Documents</h3><table class="d">'+
       '<tr><td>Management agreement</td><td class="r"><a href="#" onclick="askDoc(\''+encodeURIComponent('Please send me a copy of the management agreement.')+'\');return false">request a copy</a></td></tr>'+
       '<tr><td>Annex B — furniture and contents list</td><td class="r muted">added when furnishing is complete</td></tr>'+
       '<tr><td>Annex E — condition photos, room by room</td><td class="r muted">added at the start date</td></tr></table>'+
       '<p class="note">Documents are not stored on this page; ask for a copy and we will send it to you.</p></div>';
  }

  $('#app').innerHTML=h+vb;
  try{ var on=document.querySelector('#chips button.on'); if(on&&on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){}
}

AUTH_ON_LOGIN = boot; if (authGuard()) boot();
</script>
