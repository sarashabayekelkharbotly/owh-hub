<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hub · Your numbers</title>
<link rel="icon" href="hub-logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
:root{--blush:#f9f0f0;--red:#cc5f5f;--ink:#1a1a1a;--soft:#6b6b6b;--white:#fff;--line:#ecdede;--grey:#f6f2f2;--g:#3a7d4d;--greentint:#e4efe7;
--d-air:#e0798a;--d-book:#4a7fb5;--d-dir:#6f9a76}
*{box-sizing:border-box}
body{margin:0;background:#dcd0d0;font-family:'Cairo',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 0 40px}
.frame{max-width:460px;margin:16px auto;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 24px rgba(0,0,0,.10);overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;white-space:nowrap;flex:none}
.brand .logo{width:26px;height:26px;border-radius:6px;flex:none}
.brand .bs{font-weight:600;font-size:11.5px;color:var(--soft);border-left:1px solid var(--line);padding-left:7px}
.rib{font-size:10px;color:#4c4040;text-align:right;line-height:1.5}
.body{padding:13px;background:var(--blush)}
.h1{font-size:18px;font-weight:700;margin:0 0 9px}
.h1 .sub{font-size:12px;font-weight:400;color:var(--soft)}
.kpis{width:100%;border-collapse:separate;border-spacing:6px 0}
.kpis td{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:8px 10px;width:50%;vertical-align:top}
.kpi-l{font-size:10px;color:var(--soft)}
.kpi-v{font-size:20px;font-weight:700;line-height:1.1;margin:1px 0}
.kpi-s{font-size:10px;color:var(--soft)}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:9px}
.card h3{margin:0 0 7px;font-size:13px;font-weight:700}
.pill{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.pa{background:#efe4d4;color:#8a6420}.pf{background:var(--greentint);color:var(--g)}
table.d{width:100%;border-collapse:collapse;font-size:12px}
table.d th,table.d td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
table.d th{font-size:9.5px;color:var(--soft);font-weight:700}
table.d .r{text-align:right}table.d .c{text-align:center}
table.d tr.tot td{font-weight:700}
table.d tr.subrow td{color:#7a6a6a;font-size:11px;background:#fbf7f7}
table.d tr.subrow td:first-child{padding-left:18px}
table.d tr.net td{font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.g{color:var(--g)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.d-air{background:var(--d-air)}.d-book{background:var(--d-book)}.d-dir{background:var(--d-dir)}
.drillable{cursor:pointer}.drillable:hover{background:#faf5f5}
.drill{background:#fbf7f7;border:1px solid var(--line);border-radius:8px;margin:2px 0 4px}
.drill table{width:100%;border-collapse:collapse;font-size:10.5px}
.drill td{padding:2px 7px;border:0;color:#5a4d4d}
.drill tr.foot td{font-weight:700;color:var(--soft);font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;padding-top:5px}
.btn{font-family:inherit;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{background:#faf5f5}
.drill tr.foot2 td{font-weight:700;border-top:1px solid var(--line);padding-bottom:4px}
.note{font-size:10px;color:var(--soft);line-height:1.55;margin:7px 0 0}
.muted{color:var(--soft);font-size:11px}
.err{background:#f6e3e3;border:1px solid #e6b9b9;border-radius:10px;padding:12px;font-size:13px}
.demo{background:#efe9f5;border:1px solid #d9cbe8;border-radius:10px;padding:7px 11px;font-size:10.5px;color:#5c4a72;margin-bottom:9px}
select{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--white)}
.ctl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{font-family:inherit;font-size:12px;font-weight:600;border:0;background:var(--white);color:var(--soft);padding:5px 11px;cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.tabbar{display:flex;background:var(--white);border-top:1px solid var(--line)}
.tabbar .tab{flex:1;text-align:center;padding:7px 2px 8px;font-size:10px;color:var(--soft);text-decoration:none;font-weight:600;border-top:2px solid transparent}
.tabbar .tab .ti{display:block;font-size:17px;line-height:1.15;margin-bottom:1px}
.tabbar .tab.active{color:var(--red);border-top-color:var(--red)}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="brand"><img class="logo" src="hub-logo.png" alt="The Hub"><span class="bn">The Hub</span><span class="bs">Your numbers</span></div>
    <div class="rib" id="rib"></div>
  </div>
  <div class="body"><div id="app"><div class="card"><span class="muted">Loading…</span></div></div></div>
  <nav class="tabbar">
    <a class="tab active" href="partner.html"><span class="ti">📄</span>This month</a>
    <a class="tab" href="partner-history.html"><span class="ti">📊</span>History</a>
  </nav>
</div>

<script src="auth.js"></script>
<script>
/* SCREEN 6 — Partner, this month. Built to the mock-up (OWH_final_2.html §6):
   4 KPIs · the month's stays · statement with this month beside last month · drill-down per cost line.
   The wall is enforced on the SERVER — a partner session returns only their flat, rent stripped, the
   internal split nulled, every open month forced to in-progress. This page never holds what it must
   not show. Costs stay in EGP and revenue in USD, exactly as the sheet holds them and as the close
   screen displays them — converting would invent precision the sheet doesn't have. */
AUTH_ROLE = 'partner';

var DATA=null, MONTH=null, OPEN={}, CUR='USD';
try{ CUR=localStorage.getItem('owh_cur')||'USD'; }catch(e){}          // the choice sticks between visits

/* ---- one currency, everywhere ----------------------------------------------------------------
   The sheet holds revenue in USD and costs in EGP, each month converted at THAT month's rate. Using
   today's rate on a cost paid in February would quietly restate a closed month, so instead we recover
   the month's own rate from its own numbers: the P&L's Net already has the EGP costs converted, so
   (EGP costs) ÷ (their USD value) gives back exactly the rate the sheet used. No rate is hardcoded
   and none is guessed — if a month has no EGP costs to divide by, we fall back to the current rate. */
function fxNow(){ return (DATA.meta.fx&&DATA.meta.fx.current)||1; }
function rateFor(r){
  if(!r) return fxNow();
  var egp=0, usd=0;
  (r.costs||[]).forEach(function(c){ if(!c.amount) return; if(c.currency==='EGP') egp+=c.amount; else usd+=c.amount; });
  var allCostsUsd=r.revenue.total-r.net, egpAsUsd=allCostsUsd-usd;
  return (egp>0 && egpAsUsd>0.01) ? egp/egpAsUsd : fxNow();
}
function conv(v,cur,r){ if(v==null||!isFinite(v)) return null; if(CUR===cur) return v;
  var rate=rateFor(r); return CUR==='USD' ? v/rate : v*rate; }
function sym(){ return CUR==='USD' ? '$' : 'EGP '; }
function setCur(c){ CUR=c; try{ localStorage.setItem('owh_cur',c); }catch(e){} render(); }
var $=function(s){return document.querySelector(s);};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function esc(s){return (s||'').toString().replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
/* Dollars carry 2 decimals, EGP none. An EGP cost converted to dollars is small — a 20 EGP line is
   $0.41 — and at whole dollars a column of perfectly real costs printed as "0". */
function fmt(n){ if(n==null||!isFinite(n)) return '—';
  var d=(CUR==='USD')?2:0;
  return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmt2(n){ if(n==null||!isFinite(n)) return '—'; return (n<0?'−':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function monLabel(ym){ var p=(ym||'').split('-'); return p.length===2 ? MON[(+p[1])-1]+' '+p[0] : ym; }
function monShort(ym){ var p=(ym||'').split('-'); return p.length===2 ? MON[(+p[1])-1] : ym; }
function dayLabel(d){ var m=(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[3])+' '+MON[(+m[2])-1] : (d||''); }

function boot(){ fetchOnce().then(onData).catch(function(e){ if(e&&e.message==='AUTH')return;
  setTimeout(function(){ fetchOnce().then(onData).catch(function(e2){ if(e2&&e2.message==='AUTH')return; showErr(e2); }); },800); }); }
/* An admin on a partner screen can only mean previewing the demo — scope='demo' returns the
   identical payload the demo partner gets, never a rosier one. */
function fetchOnce(){ return api('props_get_all', isAdmin()?{scope:'demo'}:null)
  .then(function(j){ if(!j||!j.ok)throw new Error(j&&j.error||'bad'); return j; }); }
function isAdmin(){ return !!(ME && ME.role==='admin'); }
function showErr(e){ if(DATA)return; $('#app').innerHTML='<div class="err">Couldn\'t load your numbers.<br><span class="muted">'+esc(e&&e.message||'')+'</span></div>'; }
function onData(j){ DATA=j.data; DATA._gen=j.generatedAt; if(j.me) ME=j.me; initMonth(); render(); }

function myFlat(){ return (ME&&ME.flat) || (DATA.meta.flatsOrder&&DATA.meta.flatsOrder[0]) || ''; }
function flatName(){ var f=myFlat(), m=(DATA.flats||[]).filter(function(x){return x.id===f;})[0]; return (m&&m.name)||f; }
function monthsAvailable(){ var f=myFlat(); return DATA.pnl&&DATA.pnl[f] ? Object.keys(DATA.pnl[f]).sort() : []; }
function initMonth(){ var ms=monthsAvailable(); if(MONTH&&ms.indexOf(MONTH)>=0) return;
  /* open on TODAY's month, never a future one (Sarah 2026-09-17: the P&L carries pre-built rows
     into December, so "latest" opened the statement on a month that hasn't happened yet).
     Future months stay in the dropdown for whoever wants to peek. */
  var cm=(DATA.meta&&DATA.meta.currentMonth)||'';
  if(cm&&ms.indexOf(cm)>=0){ MONTH=cm; return; }
  var past=cm?ms.filter(function(m){ return m<=cm; }):ms;
  MONTH=past.length?past[past.length-1]:(ms.length?ms[ms.length-1]:null); }
function recFor(m){ var f=myFlat(); return (DATA.pnl&&DATA.pnl[f]&&DATA.pnl[f][m])||null; }
function prevMonth(){ var ms=monthsAvailable(), i=ms.indexOf(MONTH); return i>0?ms[i-1]:null; }
function daysIn(ym){ return new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(); }

/* ---- the month's stays (mock-up: Guest · In · Out · N · Channel · Paid) ---- */
function staysIn(ym){
  var f=myFlat();
  return (DATA.stays||[]).filter(function(s){
    var st=(s.status||'').toLowerCase();
    if(s.flat!==f || s.portal==='Blocked') return false;
    if(st.indexOf('cancel')>-1||st.indexOf('block')>-1) return false;
    if(!s.checkIn||!s.checkOut) return false;
    return s.checkIn.slice(0,7)<=ym && s.checkOut.slice(0,7)>=ym;      // any stay touching the month
  }).sort(function(a,b){ return a.checkIn<b.checkIn?-1:1; });
}
/* Nights of ONE stay that fall inside the month. A stay running 3 Jun → 19 Jul belongs to both
   months, and the P&L recognises each month's share separately — so the screen must too. */
function nightsOf(s,ym){
  var lo=new Date(ym+'-01T00:00:00'), hi=new Date(+ym.slice(0,4), +ym.slice(5,7), 1), n=0;
  var ci=new Date(s.checkIn.slice(0,10)+'T00:00:00'), co=new Date(s.checkOut.slice(0,10)+'T00:00:00');
  for(var d=new Date(Math.max(ci,lo)); d<co && d<hi; d.setDate(d.getDate()+1)) n++;
  return n;
}
function nightsIn(ym){ return staysIn(ym).reduce(function(a,s){ return a+nightsOf(s,ym); },0); }
/* This month's share of a stay's value, apportioned by nights — the same basis the sheet uses, so
   the column adds up to the revenue line instead of overstating it by the part earned elsewhere. */
function earnedIn(s,ym){ var tot=s.nights||nightsOf(s,ym)||1; return (s.allIn||0)*nightsOf(s,ym)/tot; }

/* A stay's money for one month, in USD, on the settled revenue rule: (All-in − Other) ÷ nights, per night
   inside the month. Gross is what the guest paid; fees = gross − net recorded, so the three columns ALWAYS add
   up (gross − fees = net) whatever the sheet's commission/charge/VAT split looks like underneath. A booking with
   no gross on record shows no fees rather than a made-up figure. */
function stayParts(s,ym){
  var tot=s.nights||nightsOf(s,ym)||1, k=nightsOf(s,ym)/tot, w=(s.allIn||0)-(s.other||0);
  var net=w*k, gross=(s.gross>0 && s.gross>=w) ? s.gross*k : net;
  return { gross:gross, fees:gross-net, net:net };
}
/* The statement chain for one month (USD): gross → fees → earnings → + other = net revenue → fee → owner share →
   operating costs → month result. The costs total is derived as share − result so the column always reconciles. */
function monthChain(ym){
  var r=recFor(ym); if(!r) return null;
  var G=0,N=0; staysIn(ym).forEach(function(s){ var p=stayParts(s,ym); G+=p.gross; N+=p.net; });
  var E=r.revenue.earnings||0, O=r.revenue.other||0, T=r.revenue.total||0, pv=r.partnerView||{};
  var fee=pv.managementFee||0, res=(pv.netPayout!=null?pv.netPayout:r.net);
  return { r:r, G:G, F:G-N, adj:E-N, E:E, O:O, T:T, fee:fee, share:T-fee, res:res, costs:(T-fee)-res };
}

/* ---- downloads (contract 8.2.1: the statement and the records behind it, in a standard file format) ---- */
function csvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function download(name,rows){
  var out=rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  var blob=new Blob(['\uFEFF'+out],{type:'text/csv;charset=utf-8;'});       // BOM so Excel reads any Arabic correctly
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=flatName().replace(/\s+/g,'-')+'-'+name+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function n2(v){ return (v==null||!isFinite(v))?'':v.toFixed(2); }
function exportStatement(){
  var cm=monthChain(MONTH), cp=prevMonth()?monthChain(prevMonth()):null; if(!cm) return;
  var c=function(ch,v){ return ch?n2(conv(v,'USD',ch.r)):''; };
  var rows=[['Line',monLabel(MONTH)+' ('+CUR+')'].concat(cp?[monLabel(prevMonth())+' ('+CUR+')']:[])];
  var add=function(lbl,fn){ rows.push([lbl,c(cm,fn(cm))].concat(cp?[c(cp,fn(cp))]:[])); };
  add('Gross guest payments',function(x){return x.G;}); add('Platform and card fees',function(x){return -x.F;});
  add('Adjustments',function(x){return x.adj;}); add('Earnings',function(x){return x.E;}); add('Other revenue',function(x){return x.O;});
  add('Net revenue',function(x){return x.T;}); add('Management fee',function(x){return -x.fee;}); add('Your share',function(x){return x.share;});
  costKeys(cm.r,cp&&cp.r).forEach(function(k){ var cu=curOf(cm.r,k)||(cp&&curOf(cp.r,k))||'EGP';
    rows.push(['Cost: '+(LABEL[k]||k), n2(conv(amt(cm.r,k),cu,cm.r))].concat(cp?[n2(conv(amt(cp.r,k),cu,cp.r))]:[])); });
  add('Total operating costs',function(x){return x.costs;}); add('Month result',function(x){return x.res;});
  rows.push(['Status',cm.r.status==='final'?'final':'in progress'].concat(cp?[cp.r.status==='final'?'final':'in progress']:[]));
  rows.push(['EGP per USD',n2(rateFor(cm.r))].concat(cp?[n2(rateFor(cp.r))]:[]));
  download('statement-'+MONTH,rows);
}
function exportBookings(){
  var f=myFlat(), rows=[['Guest','Channel','Status','Booked','Check-in','Check-out','Nights','Gross guest payment (USD)','Platform and card fees (USD)','Net (USD)','Other revenue (USD)']];
  (DATA.stays||[]).filter(function(s){ return s.flat===f && s.portal!=='Blocked'; })
    .sort(function(a,b){ return (a.checkIn||'')<(b.checkIn||'')?-1:1; })
    .forEach(function(s){ var w=(s.allIn||0)-(s.other||0), g=(s.gross>0&&s.gross>=w)?s.gross:w;
      rows.push([s.guest||'',s.portal||'Direct',s.status||'',s.booked||'',s.checkIn||'',s.checkOut||'',s.nights||'',n2(g),n2(g-w),n2(w),n2(s.other||0)]); });
  download('bookings',rows);
}
function exportCosts(){
  var f=myFlat(), rows=[['Date','Month','Category','Description','Amount','Currency',"USD at that month's rate"]];
  (DATA.tx||[]).filter(function(t){ return t.flat===f; }).sort(function(a,b){ return (a.date||'')<(b.date||'')?-1:1; })
    .forEach(function(t){ var rr=recFor(t.ym), usd=(t.currency==='USD')?t.amount:(rr?t.amount/rateFor(rr):null);
      rows.push([t.date||'',t.ym||'',t.cat==='__electricity'?'electricity':(t.cat==='__subscription'?'booking software':t.cat),shortDesc(t.desc),n2(t.amount),t.currency||'',n2(usd)]); });
  download('cost-entries',rows);
}

/* Cost descriptions are our internal working notes. A partner wants "what was this", not our
   reasoning — so drop bracketed asides and keep the opening clause. */
function shortDesc(t){
  var s=(t||'').replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  if(s.length>52){
    var cut=s.slice(0,52), b=Math.max(cut.lastIndexOf(', '), cut.lastIndexOf(' — '), cut.lastIndexOf('; '));
    s=(b>18 ? cut.slice(0,b) : cut.replace(/\s+\S*$/,''))+'…';
  }
  return s||'—';
}
function dotFor(p){ var s=(p||'').toLowerCase();
  return s.indexOf('airbnb')>-1?'d-air':(s.indexOf('booking')>-1?'d-book':'d-dir'); }

/* ---- cost lines, in the mock-up's order ---- */
var ORDER=['cleaning-labor','laundry','supplies','electricity','tv-phone-internet','water','heat-gas','furniture','maintenance','compound-maintenance','opsmanager','services-contingency','contingency','gifts-contingency','general-contingency','subscription'];
var LABEL={'cleaning-labor':'cleaning','laundry':'laundry','supplies':'supplies','electricity':'electricity','tv-phone-internet':'internet',
  'water':'water','heat-gas':'gas','maintenance':'maintenance','furniture':'furniture','compound-maintenance':'compound','opsmanager':'operations',
  'services-contingency':'services','contingency':'contingency','gifts-contingency':'contingency','general-contingency':'contingency','subscription':'booking software'};
var CATMAP={'electricity':'__electricity','subscription':'__subscription','laundry':'laundry','supplies':'supplies','cleaning-labor':'cleaning-labor','opsmanager':'opsManager','services-contingency':'Services','maintenance':'Maintenance','furniture':'Furniture','tv-phone-internet':'TV/Phone/Internet','water':'Water','heat-gas':'Heat/gas','compound-maintenance':'compound maintenance','contingency':'contingency','gifts-contingency':'Gifts','general-contingency':'General'};
function costKeys(a,b){
  var seen={}, keys=[];
  [a,b].forEach(function(r){ if(!r)return; (r.costs||[]).forEach(function(c){ if(c.amount) seen[c.key]=1; }); });
  ORDER.forEach(function(k){ if(seen[k]){ keys.push(k); delete seen[k]; } });
  for(var k in seen) keys.push(k);                     // anything new in the sheet still appears
  return keys;
}
function amt(r,key){ if(!r) return null; var c=(r.costs||[]).filter(function(x){return x.key===key;})[0]; return c?c.amount:null; }
function curOf(r,key){ if(!r) return null; var c=(r.costs||[]).filter(function(x){return x.key===key;})[0]; return c?c.currency:null; }

function txFor(ym,key){ var cat=CATMAP[key]; if(!cat) return [];
  return (DATA.tx||[]).filter(function(t){ return t.flat===myFlat() && t.ym===ym && t.cat===cat; }); }
function toggleDrill(k){ OPEN[k]=!OPEN[k]; render(); }
function drillBlock(key){
  var out='', pm=prevMonth();
  [[MONTH,'THIS MONTH'],[pm,'PREVIOUS MONTH']].forEach(function(pair){
    var ym=pair[0]; if(!ym) return;
    var list=txFor(ym,key); if(!list.length) return;
    var rr=recFor(ym);
    var sum=list.reduce(function(a,t){ return a+(conv(t.amount,t.currency,rr)||0); },0);
    out+='<tr class="foot"><td colspan="3">'+monLabel(ym).toUpperCase()+' — '+
         (list.length===1 ? fmt(sum) : list.length+' entries · '+fmt(sum/list.length)+' each → '+fmt(sum))+'</td></tr>';
    list.forEach(function(t){
      out+='<tr><td style="white-space:nowrap">'+dayLabel(t.date)+'</td><td>'+esc(shortDesc(t.desc))+'</td><td style="text-align:right">'+fmt(conv(t.amount,t.currency,rr))+'</td></tr>';
    });
  });
  return out ? '<tr><td colspan="3" style="padding:2px 4px"><div class="drill"><table>'+out+'</table></div></td></tr>' : '';
}

/* The balance with OWH, in words — minus = owed to OWH, plus = held for her. */
function balWords(v,r){ var s=sym()+fmt(conv(Math.abs(v),'USD',r));
  return v<-0.005 ? s+' owed to OWH' : (v>0.005 ? s+' held for you' : 'settled'); }

/* WHERE THE BALANCE COMES FROM (Sarah 2026-10-10: "a breakdown drop down for the balance with OWH").
   Month by month from the start, each block adds up on its own:
     brought forward + prepayments + the month's result (revenue − each cost − fee) ± float = balance after
   and the next block starts from this block's "balance after", so the chain reconciles to the figure on
   the Settlement card. "Float" is the part of a good month that was kept back (or of a bad month that the
   float absorbed) rather than moved against the balance. Every cost line opens onto its entries. */
function balanceBreakdown(upTo){
  var f=myFlat(), byM=(DATA.pnl&&DATA.pnl[f])||{};
  var ms=Object.keys(byM).sort().filter(function(m){ return m<=upTo && byM[m].partnerLedger; });
  var prev=0, out='', R=function(a,b,cls){ return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+a+'</td><td style="text-align:right;white-space:nowrap">'+b+'</td></tr>'; };
  var S=function(v,r){ return (v>0.005?'+ ':(v<-0.005?'− ':''))+sym()+fmt(conv(Math.abs(v),'USD',r)); };      // signed, in the chosen currency
  ms.forEach(function(m){
    var r=byM[m], pl=r.partnerLedger, rev=(r.revenue&&r.revenue.total)||0, opening=prev, prep=pl.prepay||0, res=pl.monthResult||0;
    var adj=Math.round((pl.balanceAfter-opening-prep-res)*100)/100;
    prev=pl.balanceAfter;
    var costs=(r.costs||[]).filter(function(c){ return c.amount; });
    if(!prep && !rev && !costs.length && Math.abs(adj)<0.005 && Math.abs(res)<0.005) return;     // a month that moved nothing says nothing
    out+='<tr class="foot"><td colspan="2">'+monLabel(m)+'</td></tr>';
    if(Math.abs(opening)>0.005) out+=R('brought forward',S(opening,r));
    if(prep) out+=R('your prepayments received',S(prep,r));
    if(rev) out+=R('revenue',S(rev,r));
    costs.forEach(function(c){
      var usd=conv(c.amount,c.currency,r), list=txFor(m,c.key);
      out+=R(LABEL[c.key]||c.key,'− '+sym()+fmt(usd));
      list.forEach(function(t){ out+='<tr><td style="padding-left:16px;color:#7a6a6a">'+dayLabel(t.date)+' · '+esc(shortDesc(t.desc))+'</td>'+
        '<td style="text-align:right;color:#7a6a6a;white-space:nowrap">'+fmt(conv(t.amount,t.currency,r))+'</td></tr>'; });
    });
    if(pl.fee>0.005) out+=R('management fee — '+Math.round((pl.feePct||0)*100)+'%','− '+sym()+fmt(conv(pl.fee,'USD',r)));
    out+=R('<b>month result</b>','<b>'+(res<0?'− ':'')+sym()+fmt(conv(Math.abs(res),'USD',r))+'</b>');
    if(Math.abs(adj)>0.005) out+=R(adj<0?'kept in the float / payable to you':'covered from the float',(adj<0?'− ':'+ ')+sym()+fmt(conv(Math.abs(adj),'USD',r)));
    out+=R('<b>balance after '+monShort(m)+'</b>','<b>'+balWords(pl.balanceAfter,r)+'</b>','foot2');
  });
  if(!out) return '<table><tr><td>Nothing has moved the balance yet.</td></tr></table>';
  return '<table>'+out+'</table><p class="note" style="padding:0 7px 5px">Minus = owed to OWH, plus = held for you. Each cost line lists the entries it is made of.</p>';
}

function render(){
  if(!DATA) return;
  if(isAdmin() && !(DATA.meta.demo&&DATA.meta.demo.active)){
    $('#app').innerHTML='<div class="card"><h3>Partner preview</h3><p class="note">This is the partner\'s view of a flat. To preview it: OWH Properties sheet → <b>The Hub</b> menu → <b>Demo mode — turn ON</b>, then reload.</p></div>'; return; }
  var f=flatName(), r=recFor(MONTH), pm=prevMonth(), pr=recFor(pm), ms=monthsAvailable();
  $('#rib').innerHTML=authWho()+' · '+esc(f);
  if(!r){ $('#app').innerHTML='<div class="card"><span class="muted">No numbers for this month yet.</span></div>'; return; }

  var pv=r.partnerView||{}, isFinal=(r.status==='final'), pct=pv.managementFeePct||0;
  var h='';
  if(DATA.meta.demo&&DATA.meta.demo.active) h+='<div class="demo"><b>Sample.</b> Real figures from a running apartment, on the terms we are discussing.</div>';

  h+='<p class="h1">'+esc(f)+' <span class="sub">· your numbers</span></p>';

  /* KPIs — "paid to you" is money that has actually been PAID: the payouts recorded in the owner
     ledger, cumulative, as the Clause-7 waterfall carries them (partnerLedger.paidToDate). It used
     to add up each closed month's net result, which put a loss month's −57.26 under "paid to you". */
  var paidToDate=0, paidAsOf=null, cmK=(DATA.meta&&DATA.meta.currentMonth)||'';
  ms.forEach(function(m){ var x=recFor(m);
    if(x&&x.partnerLedger&&(!cmK||m<=cmK)&&(!paidAsOf||m>paidAsOf)){ paidAsOf=m; paidToDate=conv(x.partnerLedger.paidToDate||0,'USD',x)||0; } });
  var nts=nightsIn(MONTH), occ=nts/daysIn(MONTH), adr=nts?conv(r.revenue.earnings,'USD',r)/nts:0;
  h+='<table class="kpis"><tr>'+
     '<td><div class="kpi-l">Paid to you, to date</div><div class="kpi-v">'+sym()+fmt(paidToDate)+'</div><div class="kpi-s">'+(paidToDate>0.005?'payouts recorded':'no payouts yet')+'</div></td>'+
     '<td><div class="kpi-l">This month result</div><div class="kpi-v">'+sym()+fmt(conv(pv.netPayout!=null?pv.netPayout:r.net,'USD',r))+'</div><div class="kpi-s">'+monLabel(MONTH)+', '+(isFinal?'final':'in progress')+'</div></td>'+
     '</tr></table>'+
     '<table class="kpis" style="margin-top:6px"><tr>'+
     '<td><div class="kpi-l">Occupancy</div><div class="kpi-v">'+Math.round(occ*100)+'%</div><div class="kpi-s">this month</div></td>'+
     '<td><div class="kpi-l">Avg nightly</div><div class="kpi-v">'+sym()+fmt2(adr)+'</div><div class="kpi-s">after discounts</div></td>'+
     '</tr></table>';

  h+='<div class="ctl">';
  if(ms.length>1) h+='<select onchange="MONTH=this.value;OPEN={};render()">'+
     ms.slice().reverse().map(function(m){ return '<option value="'+m+'"'+(m===MONTH?' selected':'')+'>'+monLabel(m)+'</option>'; }).join('')+'</select>';
  h+='<span class="seg"><button class="'+(CUR==='USD'?'on':'')+'" onclick="setCur(\'USD\')">USD</button>'+
     '<button class="'+(CUR==='EGP'?'on':'')+'" onclick="setCur(\'EGP\')">EGP</button></span></div>';

  /* ---- the month's stays ---- */
  var st=staysIn(MONTH);
  h+='<div class="card"><h3>'+monLabel(MONTH)+' stays <span class="pill '+(isFinal?'pf':'pa')+'" style="float:right">'+(isFinal?'final':'in progress')+'</span></h3>';
  if(!st.length) h+='<p class="note" style="margin:0">No stays recorded for this month.</p>';
  else{
    var spans=false, tG=0, tF=0, tN=0;
    h+='<table class="d" style="font-size:11px"><tr><th>Guest</th><th>Stay</th><th class="c">N</th><th>Channel</th><th class="r">Gross</th><th class="r">Fees</th><th class="r">Net</th></tr>';
    st.forEach(function(s){
      var nm=nightsOf(s,MONTH); if(nm!==(s.nights||nm)) spans=true;
      var p=stayParts(s,MONTH); tG+=p.gross; tF+=p.fees; tN+=p.net;
      h+='<tr><td>'+esc(s.guest||'—')+'</td><td style="white-space:nowrap">'+dayLabel(s.checkIn)+' → '+dayLabel(s.checkOut)+'</td>'+
         '<td class="c">'+nm+'</td><td style="white-space:nowrap"><span class="dot '+dotFor(s.portal)+'"></span>'+esc(s.portal||'Direct')+'</td>'+
         '<td class="r">'+fmt(conv(p.gross,'USD',r))+'</td><td class="r">'+(p.fees>0.005?fmt(-conv(p.fees,'USD',r)):'—')+'</td><td class="r">'+fmt(conv(p.net,'USD',r))+'</td></tr>';
    });
    h+='<tr class="tot"><td colspan="4">Total</td><td class="r">'+fmt(conv(tG,'USD',r))+'</td><td class="r">'+(tF>0.005?fmt(-conv(tF,'USD',r)):'—')+'</td><td class="r">'+fmt(conv(tN,'USD',r))+'</td></tr>';
    h+='</table>';
    h+='<p class="note" style="margin-top:5px">Gross = what the guest paid; Fees = platform commission, card/processing charges and taxes on them; Net = gross − fees.'+
       (spans?' A stay crossing into another month is counted here only for the nights inside '+monLabel(MONTH)+'.':'')+' The Net column is the earnings line of the statement below.</p>';
  }
  h+='</div>';

  /* ---- statement, this month beside last ---- */
  h+='<div class="card"><h3>Statement — '+monShort(MONTH)+(pm?' vs '+monShort(pm):'')+'</h3><table class="d">'+
     '<tr><th>Line</th><th class="r">'+monShort(MONTH)+'</th>'+(pm?'<th class="r">'+monShort(pm)+'</th>':'')+'</tr>';
  /* The chain follows clause 8.1 line by line: gross guest payments → platform & card fees → net revenue →
     management fee → the owner's 75% → operating costs → month result. Every column adds up. */
  var cm=monthChain(MONTH), cp=pm?monthChain(pm):null;
  var cc=function(ch,v){ return ch?fmt(conv(v,'USD',ch.r)):null; };
  var srow=function(lbl,get,cls,sign){ return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+lbl+'</td><td class="r">'+cc(cm,sign*get(cm))+'</td>'+(pm?'<td class="r">'+cc(cp,cp?sign*get(cp):0)+'</td>':'')+'</tr>'; };
  var showAdj=(Math.abs(cm.adj)>0.02)||(cp&&Math.abs(cp.adj)>0.02);
  h+=srow('Gross guest payments',function(x){return x.G;},'',1);
  h+=srow('platform &amp; card fees',function(x){return x.F;},'subrow',-1);
  if(showAdj) h+=srow('other adjustments',function(x){return x.adj;},'subrow',1);
  h+=srow('Earnings (net of fees)',function(x){return x.E;},'',1);
  h+=srow('other revenue',function(x){return x.O;},'subrow',1);
  h+=srow('Net revenue',function(x){return x.T;},'tot',1);
  h+=srow('management fee — '+Math.round(pct*100)+'% of net revenue',function(x){return x.fee;},'',-1);
  h+=srow('Your share — '+Math.round((1-pct)*100)+'% of net revenue',function(x){return x.share;},'tot',1);
  h+='<tr class="subrow"><td colspan="'+(pm?3:2)+'" style="font-weight:700">Operating costs, paid on your behalf</td></tr>';
  costKeys(r,pr).forEach(function(k){
    var open=!!OPEN[k], canDrill=!!CATMAP[k];
    var cu=curOf(r,k)||curOf(pr,k)||'EGP';
    h+='<tr'+(canDrill?' class="drillable" onclick="toggleDrill(\''+k+'\')"':'')+'><td>'+(LABEL[k]||k)+(canDrill?' '+(open?'▾':'▸'):'')+'</td>'+
       '<td class="r">'+fmt(conv(amt(r,k),cu,r))+'</td>'+(pm?'<td class="r">'+fmt(conv(amt(pr,k),cu,pr))+'</td>':'')+'</tr>';
    if(open) h+=drillBlock(k);
  });
  h+=srow('Total operating costs',function(x){return x.costs;},'tot',1);
  h+=srow('Month result',function(x){return x.res;},'net',1);
  h+='</table>';
  h+='<p class="note">Tap a cost line to see what it is made of — date, description, amount. '+
     'Everything is shown in <b>'+CUR+'</b>, each month converted at that month\'s own rate ('+
     fmt(rateFor(r))+' EGP/USD for '+monLabel(MONTH)+'), so a closed month never changes when the rate moves.'+
     (isFinal?'':' This month is still open, so figures can change until it is closed.')+'</p></div>';

  h+='<div class="card"><h3>Download</h3><div style="display:flex;gap:6px;flex-wrap:wrap">'+
     '<button class="btn" onclick="exportStatement()">This month\'s statement</button>'+
     '<button class="btn" onclick="exportBookings()">All bookings</button>'+
     '<button class="btn" onclick="exportCosts()">All cost entries</button></div>'+
     '<p class="note">CSV files that open in Excel or Google Sheets — the statement, every booking with its gross, fees and net, and every cost entry.</p></div>';

  /* ---- Clause-7 settlement — the waterfall (Sarah 2026-09-17: "the float must be visible in the
     partner view"). The SAME partnerLedger figures the admin Close shows — one truth, two readers. */
  var pl=r.partnerLedger;
  if(pl){
    var fL=function(v){ return sym()+fmt(conv(v,'USD',r)); };
    h+='<div class="card"><h3>Settlement — how this month\'s money moves</h3><table class="d">';
    h+='<tr><td>Month result after the fee</td><td class="r">'+fL(pl.monthResult)+'</td></tr>';
    h+='<tr class="drillable" onclick="toggleDrill(\'__bal\')"><td>Balance with OWH after this month '+(OPEN['__bal']?'▾':'▸')+'</td><td class="r">'+balWords(pl.balanceAfter,r)+'</td></tr>';
    if(OPEN['__bal']) h+='<tr><td colspan="2" style="padding:2px 4px"><div class="drill">'+balanceBreakdown(MONTH)+'</div></td></tr>';
    h+='<tr><td>Security float'+
       (pl.floatRetained>0.005?' · retained '+fL(pl.floatRetained)+' this month':'')+
       (pl.floatDrawn>0.005?' · drawn '+fL(pl.floatDrawn)+' this month':'')+
       '</td><td class="r">'+fL(pl.floatAfter)+' of '+fL(pl.floatTarget)+'</td></tr>';
    h+='<tr class="net"><td>Payable to you this month</td><td class="r g">'+fL(pl.payable)+'</td></tr>';
    if(pl.paidToDate>0.005||pl.outstanding>0.005)
      h+='<tr><td>Paid to date · still to pay</td><td class="r">'+fL(pl.paidToDate)+' · '+fL(pl.outstanding)+'</td></tr>';
    h+='</table><p class="note">Per Clause 7 of the agreement: each month\'s result first settles any '+
       'carried balance (setup costs and prepayments), then keeps the security float at its target of '+fL(pl.floatTarget)+
       '; only the remainder is paid out. In a negative month the float absorbs the shortfall first.</p></div>';
  }

  $('#app').innerHTML=h;
}

AUTH_ON_LOGIN = boot; if (authGuard()) boot();
</script>
</body>
