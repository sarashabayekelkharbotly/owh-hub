<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hub</title>
<link rel="icon" href="hub-logo.png">
<!-- Entry point for the site root. Sends you to Today, which shows the sign-in form if needed.
     (A partner is routed on from there — see AUTH_ROLE / AUTH_PARTNER_HOME in auth.js.)
     Kept as a redirect rather than renaming today.html, so every existing tab-bar link
     (today.html) and any bookmark keeps working. -->
<meta http-equiv="refresh" content="0; url=today.html">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#dcd0d0;
     font-family:'Cairo',sans-serif;color:#1a1a1a}
.box{background:#fff;border:1px solid #ecdede;border-radius:18px;padding:26px 24px;text-align:center;
     box-shadow:0 6px 28px rgba(0,0,0,.12)}
img{width:76px;height:76px;border-radius:15px;margin-bottom:10px}
h1{margin:0 0 4px;font-size:19px}
p{margin:0;font-size:12px;color:#6b6b6b}
a{color:#cc5f5f;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <img src="hub-logo.png" alt="The Hub">
    <h1>The Hub</h1>
    <p>Opening… <a href="today.html">continue</a></p>
  </div>
  <script>location.replace('today.html');</script>
</body>
</html>
