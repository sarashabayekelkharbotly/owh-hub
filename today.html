<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="hub-logo.png">
<!-- home-screen install: iOS reads apple-touch-icon, Android reads the manifest -->
<link rel="apple-touch-icon" href="hub-logo.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Hub">
<meta name="theme-color" content="#f9f0f0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
:root{--blush:#f9f0f0;--red:#cc5f5f;--blue:#b8c9d9;--ink:#1a1a1a;--soft:#6b6b6b;--white:#fff;--line:#ecdede;--grey:#f6f2f2;--g:#3a7d4d;--rr:#cc5f5f;--amber:#e8b45f;
--ch-airbnb:#e0798a;--ch-booking:#4a7fb5;--ch-direct:#6f9a76}
*{box-sizing:border-box}
body{margin:0;background:#dcd0d0;font-family:'Cairo',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 0 40px}
.frame{max-width:440px;margin:16px auto;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 24px rgba(0,0,0,.10);overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;white-space:nowrap;flex:none}.brand .r{color:var(--red)}.brand .logo{width:26px;height:26px;border-radius:6px;flex:none}.brand .bs{font-weight:600;font-size:11.5px;color:var(--soft);border-left:1px solid var(--line);padding-left:7px}
.rib{font-size:10px;color:#4c4040;text-align:right;line-height:1.5}.rib b{color:#1a1a1a}
.body{padding:13px 13px 12px;background:var(--blush)}
.tabbar{display:flex;background:var(--white);border-top:1px solid var(--line)}
.tabbar .tab{flex:1;text-align:center;padding:7px 2px 8px;font-size:10px;color:var(--soft);text-decoration:none;font-weight:600;border-top:2px solid transparent}
.tabbar .tab .ti{display:block;font-size:17px;line-height:1.15;margin-bottom:1px}
.tabbar .tab.active{color:var(--red);border-top-color:var(--red)}
.tabbar .tab.dis{opacity:.38;pointer-events:none}
h1{font-size:19px;margin:0 0 10px}.h1s{font-size:12px;color:var(--soft);font-weight:400;margin-left:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.kl{font-size:10px;color:var(--soft);margin-bottom:2px}
.kv{font-size:19px;font-weight:700;line-height:1.05}
.ks{font-size:10px;color:var(--soft);margin-top:3px;line-height:1.45}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:700}
.card h3 .rt{float:right;font-weight:400;color:var(--soft);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:4px 5px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:9.5px;color:var(--soft);font-weight:700}
tr:last-child td{border-bottom:0}
.tot td{font-weight:700;border-top:1px solid var(--ink)}
.g{color:var(--g)}.r{color:var(--rr)}.soft{color:var(--soft)}
.pill{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;white-space:nowrap}
.p-out{background:#f4dede;color:#a24a4a}.p-in{background:#dce9df;color:#3a7d4d}.p-stay{background:#e2edf3;color:#2c5468}.p-gap{background:#f3ead9;color:#8a6d2f}.p-free{background:#fdeaea;color:#cc5f5f;border:1px dashed #e0b3b3}
.rfree td{background:#fdf5f5}
.code{font-family:monospace;font-weight:700;font-size:11.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:middle}
.legend{font-size:9.5px;color:var(--soft);margin-top:6px}
.need{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.4}
.need:last-child{border-bottom:0}
.nb{font-weight:700;flex:none}.n-warn .nb{color:var(--amber)}.n-info .nb{color:var(--blue)}.n-ok .nb{color:var(--g)}
.payctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.payctl select{font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;background:var(--white)}
.paybtn{border:0;background:var(--red);color:#fff;font-family:inherit;font-weight:700;font-size:11.5px;border-radius:7px;padding:3px 12px;cursor:pointer}
.paymsg{font-size:10.5px;color:var(--soft)}
.err{background:#f6e3e3;border:1px solid #e6b9b9;border-radius:10px;padding:12px;font-size:13px}
.muted{color:var(--soft);font-size:11px}
a.tab{font-size:11px;color:var(--red);text-decoration:none;font-weight:700}
</style>

<body>
<div class="frame">
  <div class="topbar">
    <div class="brand"><img class="logo" src="hub-logo.png" alt="The Hub"><span class="bn">The Hub</span><span class="bs">Today</span></div>
    <div class="rib" id="rib"></div>
  </div>
  <div class="body"><div id="app"><div class="card"><span class="muted">Loading…</span></div></div></div>
  <nav class="tabbar">
    <a class="tab active" href="today.html"><span class="ti">🏠</span>Today</a>
    <a class="tab" href="close.html"><span class="ti">📑</span>Close</a>
    <a class="tab" href="stats.html"><span class="ti">📊</span>Stats</a>

  </nav>
</div>

<script src="auth.js?v=39895509"></script>
<script>
/* CONFIG lives in auth.js: ENDPOINT + the session token. No password or shared
   secret in this file — who you are comes from the signed-in session. */

var D=null, DAYMS=86400000, STAYS=[];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// every call site is money (earnings / values), so 2 decimals — small figures were rounding to "0"
var fmt=function(n){return (n<0?'-':'')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
var pct=function(n){return (isFinite(n)?Math.round(n*100):0)+'%';};
var $=function(s){return document.querySelector(s);};
var day=function(s){return new Date((s||'').slice(0,10)+'T00:00:00');};
var ymd=function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);};
var dmon=function(s){var d=day(s);return d.getDate()+' '+MON[d.getMonth()];};

/* fetch: one silent retry, stale-while-revalidate */
function boot(){ fetchOnce().then(onData).catch(function(e){ if(e&&e.message==='AUTH')return; setTimeout(function(){ fetchOnce().then(onData).catch(function(e2){ if(e2&&e2.message==='AUTH')return; if(!D){var c=cache();c?onData(c,true):showErr(e2);} }); },800); }); }
function fetchOnce(){ return api('props_get_all',{scope:'live'}).then(function(j){ if(!j||!j.ok)throw new Error(j&&j.error||'bad'); if(j.me){ ME=j.me; try{localStorage.setItem('owh_me',JSON.stringify(ME));}catch(e){} } return j; }); }
function cache(){ try{return JSON.parse(localStorage.getItem('owh_today'));}catch(e){return null;} }
function showErr(e){ if(D)return; $('#app').innerHTML='<div class="err">Couldn\'t reach the endpoint.<br><span class="muted">'+(e&&e.message||'')+'</span></div>'; }
var ALERTS=null;
var RVW=null, RVWBUSY={}, RVWSHOW=false;      // review bookings: the list from the server, ids being saved, the flagged list open or not
var OBJX=null, OBJR={}, OBJBUSY={};      // owner questions & objections: the log, unsent reply drafts, ids being sent
function onData(j,fromCache){ D=j.data; D._gen=j.generatedAt; STAYS=mergeStays(D.stays); try{ if(!fromCache)localStorage.setItem('owh_today',JSON.stringify(j)); }catch(e){} render(); demoTab(); if(!fromCache)fetchAlerts(); fetchObjs(); fetchReview(); }
/* The Demo tab exists only while demo mode is switched on — the switch itself is the on/off signal,
   so there is nothing extra to remember to hide before or after a partner meeting. The demo flat is
   never in this screen's data either way; this is only a way in. */
function demoTab(){ /* v229: «👁 Partner view» is always there for an admin — the demo, when on, is one of its choices */ }
/* light read-only alerts (WeShare pending confirmations) — fetched after the main render so the load stays fast */
function fetchAlerts(){ api('props_alerts').then(function(j){ if(j&&j.ok){ ALERTS=j; render(); } }).catch(function(){}); }
/* ---- review bookings (Sarah 2026-10-13): fictional bookings made on Airbnb / Booking.com to earn reviews. Every new booking on a
   flat in its review phase asks once: Normal · OWH paid · Owner paid. OWH-/owner-funded is OUTSIDE revenue — no 25% fee, no owner share;
   an owner-funded one is returned to her through her settlement. Mark final waits for the unanswered ones. ---- */
function fetchReview(){ api('props_review_list').then(function(j){ if(j&&j.ok){ RVW=j; render(); } }).catch(function(){}); }
function reviewSet(id,val){
  if(RVWBUSY[id]) return; RVWBUSY[id]=true; render();
  api('props_review_set',{id:id,value:val}).then(function(j){
    RVWBUSY[id]=false;
    if(j&&j.ok){ if((j.touchesFinal||[]).length) alert('Saved. Note: this booking falls in a month that is already final ('+j.touchesFinal.join(', ')+') — that month\'s revenue changed. Re-publish it if the owner has already seen it.'); fetchReview(); }
    else { alert('Not saved: '+((j&&j.error)||'try again')); render(); }
  }).catch(function(){ RVWBUSY[id]=false; alert('Not saved — check the connection.'); render(); });
}
function reviewPhase(flat,on){ api('props_review_phase',{flat:flat,on:on?'1':'0'}).then(function(){ fetchReview(); }).catch(function(){}); }
function reviewStartSel(){ var el=document.getElementById('rvStart'); if(el&&el.value) reviewPhase(el.value,true); }
function reviewCard(){
  if(!RVW) return '';
  var phase=RVW.phase||{}, flats=Object.keys(phase), pend=RVW.pending||[], fl=RVW.flagged||[];
  var h='<div class="card"><h3>Review bookings<span class="rt">'+(pend.length?pend.length+' to answer':(flats.length?'all answered':'off'))+'</span></h3>';
  var btn=function(id,v,lbl,hot){ return '<button class="paybtn" '+(RVWBUSY[id]?'disabled ':'')+'style="'+(hot?'':'background:#fff;color:var(--ink);border:1px solid var(--line)')+'" onclick="reviewSet(\''+id+'\',\''+v+'\')">'+lbl+'</button>'; };
  pend.forEach(function(b){
    h+='<div style="border-top:1px solid var(--line);padding:8px 0"><div style="font-size:12.5px"><b>'+esc(b.flat)+'</b> · '+esc(b.guest||'—')+' · '+esc(b.portal)+' · '+esc(b.checkIn)+' → '+esc(b.checkOut)+' ('+b.nights+'n) · <b>$'+fmt(b.gross)+'</b></div>'+
       '<div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+btn(b.id,'normal','Normal',true)+btn(b.id,'owh','OWH paid',false)+btn(b.id,'owner','Owner paid',false)+(RVWBUSY[b.id]?'<span class="muted">saving…</span>':'')+'</div></div>';
  });
  if(!pend.length&&flats.length) h+='<div class="muted" style="padding:2px 0 6px">Nothing waiting — every new booking on '+flats.map(esc).join(', ')+' has been answered.</div>';
  // which flats are prompting
  h+='<div style="border-top:1px solid var(--line);padding-top:6px;font-size:12px">'+(flats.length?'Asking about new bookings on: '+flats.map(function(f){ return '<b>'+esc(f)+'</b> <span class="muted">since '+esc(phase[f])+'</span> <a href="#" onclick="reviewPhase(\''+f+'\',false);return false">stop</a>'; }).join(' · ')
     :'No flat is collecting reviews.')+
     ' <select id="rvStart" style="font:inherit;font-size:11.5px;margin-left:6px"><option value="">start for…</option>'+((D.meta.flatsOrder||[]).filter(function(f){ return !phase[f]; }).map(function(f){ return '<option>'+esc(f)+'</option>'; }).join(''))+'</select> <a href="#" onclick="reviewStartSel();return false">start</a></div>';
  if(fl.length){
    h+='<div style="margin-top:6px"><a href="#" onclick="RVWSHOW=!RVWSHOW;render();return false" style="font-size:12px">'+(RVWSHOW?'▾':'▸')+' Flagged review bookings ('+fl.length+') · cost to OWH <b>$'+fmt(RVW.owhCost||0)+'</b></a></div>';
    if(RVWSHOW) fl.forEach(function(b){
      h+='<div style="padding:5px 0;font-size:11.5px;border-bottom:1px solid var(--line)"><b>'+esc(b.flat)+'</b> · '+esc(b.guest||'—')+' · '+esc(b.portal)+' · '+esc(b.checkIn)+' → '+esc(b.checkOut)+' · '+(b.value==='owner'?'<b>owner paid</b> — $'+fmt(b.gross)+' returned to her':'<b>OWH paid</b>')+' · platform charges (OWH) $'+fmt(b.owhCost||0)+
         ' · <a href="#" onclick="reviewSet(\''+b.id+'\',\'normal\');return false">make it a normal booking</a></div>';
    });
  }
  return h+'<div class="legend">An OWH- or owner-funded review booking is outside revenue: net revenue from it is zero, so no 25% fee and no owner share. OWH bears the platform charges. Owner-funded: what she paid is returned to her in that month, through her settlement.</div></div>';
}
/* ---- owner questions & objections (2026-10-13): what an owner wrote on her statement, answered from here.
   An answer goes to her Telegram and clears the alert on Sarah's alerts bot; "mark handled" closes it with no message. ---- */
function fetchObjs(){ api('props_objections').then(function(j){ if(j&&j.ok){ OBJX=j.items||[]; render(); } }).catch(function(){}); }
function objReply(id,close){
  var ta=document.getElementById('objr_'+id), txt=ta?ta.value:(OBJR[id]||''); OBJR[id]=txt;
  if(!close && txt.trim().length<2){ alert('Write a reply first, or use “mark handled”.'); return; }
  if(OBJBUSY[id]) return; OBJBUSY[id]=true; render();
  api('props_objection_reply',{id:id,reply:close?'':txt,action:close?'close':'answer'}).then(function(j){
    OBJBUSY[id]=false;
    if(j&&j.ok){ delete OBJR[id]; if(!close&&!j.telegram) alert('Answered and logged. Telegram did not reach her (not linked, or she has not pressed Start) — she will see the reply on her Hub page.'); fetchObjs(); }
    else { alert('Not saved: '+((j&&j.error)||'try again')); render(); }
  }).catch(function(){ OBJBUSY[id]=false; alert('Not saved — check the connection.'); render(); });
}
function objAdminCard(){
  if(!OBJX||!OBJX.length) return '';
  var open=OBJX.filter(function(o){ return o.status==='open'; }), done=OBJX.filter(function(o){ return o.status!=='open'; });
  var chip=function(o){ return o.status==='answered'?'<span style="color:#3a7d4d;font-weight:700">answered</span>':(o.status==='closed'?'<span class="muted">handled</span>':'<span style="color:var(--red,#cc5f5f);font-weight:700">open</span>'); };
  var win=function(o){ return o.statement==='final' ? (o.inWindow?' · <span class="muted">inside the 7-day period</span>':' · <b style="color:var(--red,#cc5f5f)">after the 7-day period</b>') : ' · <span class="muted">statement not yet published</span>'; };
  var h='<div class="card"><h3>Owner questions &amp; objections<span class="rt">'+(open.length?open.length+' open':'all answered')+'</span></h3>';
  open.forEach(function(o){
    h+='<div style="border-top:1px solid var(--line);padding:8px 0"><div style="font-size:12px"><b>'+esc(o.flat)+'</b> · '+esc(o.month)+' · '+(o.type==='objection'?'<b>objection</b>':'question')+win(o)+' · <span class="muted">'+esc((o.created||'').replace('T',' ').slice(0,16))+'</span></div>'+
       '<div style="margin:4px 0;font-size:12.5px;white-space:pre-wrap">'+esc(o.text)+'</div>'+
       '<textarea id="objr_'+o.id+'" rows="3" placeholder="Your reply to '+esc(o.from)+'…" oninput="OBJR[\''+o.id+'\']=this.value" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;resize:vertical">'+esc(OBJR[o.id]||'')+'</textarea>'+
       '<div style="margin-top:5px;display:flex;gap:8px;align-items:center"><button class="paybtn" '+(OBJBUSY[o.id]?'disabled ':'')+'onclick="objReply(\''+o.id+'\',false)">Send reply</button>'+
       '<a href="#" onclick="objReply(\''+o.id+'\',true);return false" style="font-size:11.5px">mark handled, no reply</a>'+(OBJBUSY[o.id]?'<span class="muted">saving…</span>':'')+'</div></div>';
  });
  if(done.length){
    h+='<details style="border-top:1px solid var(--line);padding-top:6px"><summary class="muted" style="cursor:pointer;font-size:12px">Log — '+done.length+' answered</summary>';
    done.slice(0,30).forEach(function(o){
      h+='<div style="padding:5px 0;font-size:11.5px;border-bottom:1px solid var(--line)"><b>'+esc(o.flat)+'</b> · '+esc(o.month)+' · '+(o.type==='objection'?'objection':'question')+' · '+chip(o)+' <span class="muted">'+esc((o.created||'').slice(0,10))+'</span>'+
         '<div style="white-space:pre-wrap">'+esc(o.text)+'</div>'+(o.reply?'<div class="muted" style="white-space:pre-wrap">↳ '+esc(o.reply)+' <i>('+esc(o.repliedBy)+', '+esc((o.repliedAt||'').slice(0,10))+')</i></div>':'')+'</div>';
    });
    h+='</details>';
  }
  return h+'<div class="legend">Written by the owner inside her Hub page. Each one raises an alert on your alerts bot (and one line to Khaled) until it is answered; your reply goes to her Telegram and her page.</div></div>';
}
/* "seen, not fixing" — permanently hides these exact alert keys; a NEW mismatch or bill reappears */
function dismissElec(keys){ api('props_dismiss_elec',{keys:keys}).then(function(j){ if(j&&j.ok) fetchAlerts(); }).catch(function(){}); }
function dismissBtn(keys){ return ' <a href="#" onclick=\'dismissElec('+JSON.stringify(keys)+');return false\' style="font-weight:700;white-space:nowrap">✕ dismiss</a>'; }
/* run the whole pipeline on demand (month-close / snapshot) */
function syncAll(){
  var btn=document.getElementById('syncAllBtn'); if(btn){ btn.disabled=true; btn.textContent='⏳ syncing…'; }
  api('props_sync_all').then(function(j){
    if(j&&j.ok){ var pc=(j.needsAttention&&j.needsAttention.pendingConfirmations)||0;
      var el=(j.steps&&j.steps.electricity)||{}, ed=(j.needsAttention&&j.needsAttention.electricityDecisions)||[];
      var msg='Synced ✓';
      if(el.applied||el.accrualsAdded) msg+='\n\n⚡ Electricity: '+(el.applied||0)+' bill row(s) applied, '+(el.accrualsAdded||0)+' accrual(s) refreshed.';
      if(ed.length) msg+='\n\n⚠️ '+ed.length+' electricity bill'+(ed.length>1?'s need':' needs')+' a decision — see "Needs you" below.';
      if(pc) msg+='\n\n⚠️ '+pc+' item'+(pc>1?'s':'')+' still pending confirmation in WeShare.';
      if(!pc&&!ed.length) msg+='\n\nEverything confirmed and up to date.';
      alert(msg);
      boot();
    } else { if(btn){btn.disabled=false;btn.textContent='🔄 Sync all';} alert('Sync error: '+((j&&j.error)||'failed')); }
  }).catch(function(e){ if(btn){btn.disabled=false;btn.textContent='🔄 Sync all';} alert('Sync failed: '+(e.message||e)); });
}
/* logical stays: contiguous same-guest bookings merge (cleaning + internet + occupancy events; revenue is sheet-side, per booking) */
function mergeStays(stays){
  var live=(stays||[]).filter(function(s){ return isLive(s)&&s.checkIn&&s.checkOut; })
    .slice().sort(function(a,b){ return a.flat<b.flat?-1:(a.flat>b.flat?1:(a.checkIn<b.checkIn?-1:1)); });
  var out=[], acc=null;
  live.forEach(function(s){
    if(acc && acc.flat===s.flat && acc.guest===s.guest && acc.checkOut===s.checkIn){
      acc.checkOut=s.checkOut; acc.nights=Math.round((day(acc.checkOut)-day(acc.checkIn))/DAYMS);
      acc.guests=Math.max(acc.guests||1,s.guests||1); acc.ids.push(s.id);
      if(acc.portals.indexOf(s.portal)<0)acc.portals.push(s.portal);   // a stay can span channels (early-night extension)
    } else { if(acc)out.push(acc);
      acc={ id:s.id, ids:[s.id], flat:s.flat, portal:s.portal, portals:[s.portal], status:s.status, guest:s.guest,
            checkIn:s.checkIn, checkOut:s.checkOut, nights:s.nights, guests:s.guests, allIn:s.allIn }; }
  });
  if(acc)out.push(acc);
  return out;
}
/* ============================================================================
   GUARD — TWO VIEWS OF BOOKINGS. Don't cross the streams.
   • STAYS (merged, from mergeStays)  → CLEANING / OCCUPANCY-EVENTS / INTERNET only.
   • rawStays() (per Smoobu booking)  → MONEY, CHANNEL, PAYMENT-METHOD, and STATISTICS.
   Revenue-by-channel and revenue-by-payment-method are per-booking — a guest can extend
   across channels, so those MUST read rawStays(), never the merged STAYS.
   ============================================================================ */
function rawStays(){ return D.stays || []; }

/* ---------- month + booking helpers ---------- */
function mInfo(ym){ var y=+ym.slice(0,4),mo=+ym.slice(5,7); var start=new Date(y,mo-1,1),nextStart=new Date(y,mo,1); return {ym:ym,start:start,nextStart:nextStart,dim:Math.round((nextStart-start)/DAYMS)}; }
function nextYm(ym){ var y=+ym.slice(0,4),mo=+ym.slice(5,7)+1; if(mo>12){mo=1;y++;} return y+'-'+('0'+mo).slice(-2); }
function prevYm(ym){ var y=+ym.slice(0,4),mo=+ym.slice(5,7)-1; if(mo<1){mo=12;y--;} return y+'-'+('0'+mo).slice(-2); }
function isLive(s){ var st=(s.status||'').toLowerCase(); return st.indexOf('cancel')<0 && st.indexOf('block')<0 && st!=='pending'; }   // v234: a VRBO request waiting for its payout is not booked yet
function overlapNights(s,m){ if(!s.checkIn||!s.checkOut)return 0; var os=Math.max(day(s.checkIn),m.start),oe=Math.min(day(s.checkOut),m.nextStart); return Math.max(0,Math.round((oe-os)/DAYMS)); }
function flatNights(f,m){ var n=0; D.stays.forEach(function(s){ if(s.flat===f&&isLive(s))n+=overlapNights(s,m); }); return n; }
function isBlocked(s){ return (s.status||'').toLowerCase().indexOf('block')>-1; }
// distinct blocked calendar nights in month m (Smoobu creates one block per channel, so ranges overlap — union them)
function flatBlockedNights(f,m){ var set={}; D.stays.forEach(function(s){ if(s.flat!==f||!isBlocked(s)||!s.checkIn||!s.checkOut)return;
  var t=new Date(Math.max(day(s.checkIn),m.start)), b=Math.min(day(s.checkOut),m.nextStart);
  for(; t<b; t.setDate(t.getDate()+1)) set[ymd(t)]=1; }); return Object.keys(set).length; }
function flatBooked(f,m){ var v=0; rawStays().forEach(function(s){ if(s.flat!==f||!isLive(s))return; var on=overlapNights(s,m); if(on&&s.nights)v+=s.allIn*on/s.nights; }); return v; }   // MONEY → rawStays()
function airbnbFlats(){ return D.meta.flatsOrder.filter(function(f){ return D.targets.byFlat[f]; }); }
function targetB(f,m){ return (D.targets.byFlat[f]||{B:0}).B*m.dim/D.targets.daysBasis; }
function targetA(f,m){ return (D.targets.byFlat[f]||{A:0}).A*m.dim/D.targets.daysBasis; }

function nextCheckIn(flat,asOf){ var next=null; STAYS.forEach(function(s){ if(s.flat!==flat)return; var ci=day(s.checkIn); if(ci>=asOf&&(!next||ci<next))next=ci; }); return next; }
function occStayOn(flat,asOf){ var o=null; STAYS.forEach(function(s){ if(s.flat===flat&&s.checkIn&&s.checkOut&&day(s.checkIn)<=asOf&&asOf<day(s.checkOut))o=s; }); return o; }
function codeOf(d){ return ('0'+d.getDate()).slice(-2)+('0'+(d.getMonth()+1)).slice(-2); }
// while a guest is IN → current stay's code; else next arrival's (only if within 2 days); else default 0107
function doorCode(flat,asOf){ var cur=occStayOn(flat,asOf); if(cur)return codeOf(day(cur.checkIn));
  var n=nextCheckIn(flat,asOf); if(!n)return '0107'; if((n-asOf)/DAYMS>2)return '0107'; return codeOf(n); }
function prevCheckOut(flat,before){ var last=null; STAYS.forEach(function(s){ if(s.flat!==flat)return; var co=day(s.checkOut); if(co<=before&&(!last||co>last))last=co; }); return last; }

/* free-night runs (>=2) in cm, from today forward */
function freeRuns(flat,cm,fromISO){
  var occ={}; D.stays.forEach(function(s){ if(s.flat!==flat||!s.checkIn||!s.checkOut||(!isLive(s)&&!isBlocked(s)))return; for(var t=day(s.checkIn),b=day(s.checkOut); t<b; t.setDate(t.getDate()+1))occ[ymd(t)]=1; });
  var from=day(fromISO); if(from<cm.start)from=new Date(cm.start);
  var runs=[],cur=null;
  for(var d=new Date(from); d<cm.nextStart; d.setDate(d.getDate()+1)){ var k=ymd(d);
    if(!occ[k]){ if(!cur)cur={s:d.getDate(),n:0}; cur.n++; cur.e=d.getDate(); } else if(cur){runs.push(cur);cur=null;} }
  if(cur)runs.push(cur);
  // min 2-night bookings: deduct 1 night per gap, keep only runs with >=2 fillable nights left
  return runs.map(function(r){ r.use=r.n-1; return r; }).filter(function(r){ return r.use>=2; });
}

/* ---------- render ---------- */
function render(){
  var cmY=D.meta.currentMonth, nmY=nextYm(cmY), pmY=prevYm(cmY);
  var cm=mInfo(cmY), nm=mInfo(nmY), pm=mInfo(pmY), flats=airbnbFlats(), asOf=day(D.meta.asOf);
  $('#rib').innerHTML=authWho()+' · FX '+(D.meta.fx.current||'?')+' · '+(D._gen?new Date(D._gen).toLocaleDateString():'');

  var pf={}, T={earn:0,tB:0,tA:0,n:0, nmEarn:0,nmTB:0,nmN:0, pmN:0, blk:0, blkVal:0};
  flats.forEach(function(f){
    var earn=(((D.pnl[f]||{})[cmY]||{}).revenue||{}).earnings||0;
    var n=flatNights(f,cm), nmEarn=flatBooked(f,nm), nmN=flatNights(f,nm), pmN=flatNights(f,pm);
    var tB=targetB(f,cm), nmtB=targetB(f,nm), adr=n?earn/n:0, blk=flatBlockedNights(f,cm);
    pf[f]={earn:earn,n:n,occ:n/cm.dim,adr:adr,vsB:tB?earn/tB:0, nmEarn:nmEarn,nmVsB:nmtB?nmEarn/nmtB:0, blk:blk, blkVal:blk*adr};
    T.earn+=earn;T.tB+=tB;T.tA+=targetA(f,cm);T.n+=n; T.nmEarn+=nmEarn;T.nmTB+=nmtB;T.nmN+=nmN; T.pmN+=pmN; T.blk+=blk; T.blkVal+=blk*adr;
  });
  var denom=cm.dim*flats.length;
  var occ=T.n/denom, pmOcc=T.pmN/(pm.dim*flats.length);
  var occExBlk=(denom-T.blk)>0?T.n/(denom-T.blk):0, pctBlk=denom?T.blk/denom:0;

  // free nights (forward)
  var runs=[], freeVal=0, freeN=0;
  flats.forEach(function(f){ freeRuns(f,cm,D.meta.asOf).forEach(function(r){ var v=r.use*pf[f].adr; runs.push({flat:f,s:r.s,e:r.e,n:r.n,use:r.use,adr:pf[f].adr,val:v}); freeVal+=v; freeN+=r.use; }); });
  runs.sort(function(a,b){return b.val-a.val;});

  var d0=new Date(D.meta.asOf+'T00:00:00');
  var h='<h1>Today <span class="h1s">'+d0.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+'</span></h1>';

  // ---- 4 KPI tiles
  h+='<div class="kpis">';
  h+=kpi(mLabel(cmY)+' earnings','$'+fmt(T.earn),'B '+col(T.earn/T.tB)+' · A '+pct(T.tA?T.earn/T.tA:0));
  h+=kpi(mLabel(nmY)+' earnings','$'+fmt(T.nmEarn),'B '+col(T.nmTB?T.nmEarn/T.nmTB:0)+' · '+T.nmN+'n booked / '+flats.length+' flats');
  h+=kpi('Free '+mLabel(cmY)+' nights',String(freeN),runs.length+' run'+(runs.length===1?'':'s')+' · $'+fmt(freeVal));
  h+=kpi('Occupancy',pct(occ),mLabel(pmY)+' '+pct(pmOcc)+' · '+deltaPts(occ,pmOcc));
  h+='</div>';

  // ---- by flat (this month + next-month vs B)
  h+='<div class="card"><h3>By flat<span class="rt">'+mLabel(cmY)+' &amp; '+mLabel(nmY)+'</span></h3><table><thead><tr><th>Flat</th><th>'+mLabel(cmY)+' $</th><th>vs B</th><th>Occ</th><th>ADR</th><th>'+mLabel(nmY)+' vsB</th></tr></thead><tbody>';
  flats.forEach(function(f){ var p=pf[f];
    h+='<tr><td>'+f+'</td><td>'+fmt(p.earn)+'</td><td class="'+cc(p.vsB)+'">'+pct(p.vsB)+'</td><td>'+pct(p.occ)+'</td><td>'+p.adr.toFixed(1)+'</td><td class="'+cc(p.nmVsB)+'">'+pct(p.nmVsB)+'</td></tr>'; });
  h+='<tr class="tot"><td>Portfolio</td><td>'+fmt(T.earn)+'</td><td class="'+cc(T.tB?T.earn/T.tB:0)+'">'+pct(T.tB?T.earn/T.tB:0)+'</td><td>'+pct(occ)+'</td><td>'+(T.n?(T.earn/T.n).toFixed(1):'—')+'</td><td class="'+cc(T.nmTB?T.nmEarn/T.nmTB:0)+'">'+pct(T.nmTB?T.nmEarn/T.nmTB:0)+'</td></tr>';
  h+='</tbody></table></div>';

  // ---- happening today
  h+=happening(cm,asOf);

  // ---- free nights table
  if(runs.length){
    h+='<div class="card"><h3>Free nights<span class="rt">'+mLabel(cmY)+' · fillable</span></h3><table><thead><tr><th>Flat</th><th>Run</th><th>Gap</th><th>Fillable</th><th>ADR</th><th>Value</th></tr></thead><tbody>';
    runs.forEach(function(r){ h+='<tr><td>'+r.flat+'</td><td>'+r.s+'–'+r.e+'</td><td class="soft">'+r.n+'n</td><td>'+r.use+'n</td><td>'+r.adr.toFixed(1)+'</td><td>$'+fmt(r.val)+'</td></tr>'; });
    h+='<tr class="tot"><td colspan="5">Total</td><td>$'+fmt(freeVal)+'</td></tr></tbody></table><div class="legend">Min 2-night bookings: each gap loses 1 night; gaps with under 2 fillable nights are dropped. Value = fillable × ADR (estimate).</div></div>';
  }

  // ---- blocked nights (opportunity cost) — self-inflicted unavailability; hurts occupancy, not ADR
  if(T.blk>0){
    h+='<div class="card"><h3>Blocked nights<span class="rt">'+mLabel(cmY)+' · opportunity cost</span></h3>';
    h+='<table><thead><tr><th>Flat</th><th>Blocked</th><th>ADR</th><th>Value</th></tr></thead><tbody>';
    flats.forEach(function(f){ var p=pf[f]; if(p.blk>0) h+='<tr><td>'+f+'</td><td>'+p.blk+'n</td><td>'+p.adr.toFixed(1)+'</td><td>$'+fmt(p.blkVal)+'</td></tr>'; });
    h+='<tr class="tot"><td>Total</td><td>'+T.blk+'n</td><td></td><td>$'+fmt(T.blkVal)+'</td></tr></tbody></table>';
    h+='<div class="legend">'+pct(pctBlk)+' of the month is blocked. Occupancy is '+pct(occ)+' — without the blocks it would be '+pct(occExBlk)+' ('+deltaPts(occExBlk,occ)+'). Value = blocked nights × actual ADR. Blocked nights don\'t affect ADR.</div></div>';
  }

  // ---- needs you
  h+=needs(cm,pmY);
  h+=objAdminCard();
  h+=reviewCard();
  h+=ownerCard();
  h+=stripeCard();
  h+=adjustCard();   // 🛠 real dates + VRBO numbers (v244)

  /* 🔍 guest lookup (Sarah 2026-08-31: "i have a phone number and a first name") — searches every
     stay in the payload, cancelled included. Phone matching is FORMAT-BLIND: both sides reduce to
     digits, a leading 00 drops, and the comparison runs on the last-10-digit tails — so
     "+20 101 234 5678", "0101-234-5678" and "20101234 5678" all find the same guest. */
  h+='<div class="card"><h3>Guest lookup<span class="rt">name or phone · any format</span></h3>'+
     '<input id="gsq" value="'+esc(window._gsq||'')+'" placeholder="e.g. Amina · 0101 234 5678 · +20 101…" '+
     'oninput="window._gsq=this.value;guestSearch()" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:8px 10px">'+
     '<div id="gsr"></div></div>';


  $('#app').innerHTML=h;
  if(window._gsq) guestSearch();
}

function normPh(x){ var d=String(x||'').replace(/\D/g,''); if(d.slice(0,2)==='00') d=d.slice(2); return d; }
function phoneMatch(p,q){ var a=normPh(p), b=normPh(q); if(!a||!b) return false;
  if(b.length>=7){ var ta=a.slice(-10), tb=b.slice(-10);
    return ta.slice(-tb.length)===tb || tb.slice(-ta.length)===ta || a.indexOf(b)>-1; }
  return a.indexOf(b)>-1; }
/* the lookup sees ALL history (2026-08-31): this screen's payload is trimmed to recent stays for
   speed, so the search fetches its own thin full index once and reuses it */
var GIDX=null, GIDX_BUSY=false;
function loadGuestIndex(){
  if(GIDX||GIDX_BUSY) return; GIDX_BUSY=true;
  api('props_guest_index').then(function(j){ GIDX_BUSY=false;
    if(j&&j.ok){ GIDX=j.stays||[]; guestSearch(); } }).catch(function(){ GIDX_BUSY=false; });
}
function guestSearch(){
  var el=$('#gsr'); if(!el) return;
  var q=String(window._gsq||'').trim();
  if(q.length<2){ el.innerHTML=q?'<div class="muted" style="padding:6px 0">اكتب حرفين على الأقل</div>':''; return; }
  if(!GIDX) loadGuestIndex();
  var ql=q.toLowerCase(), isPhone=normPh(q).length>=4&&normPh(q).length>=q.replace(/[\s+\-()]/g,'').length-1;
  var today=ymd(day(D.meta.asOf));
  var hits=(GIDX||rawStays()||[]).filter(function(s){
    var byName=String(s.guest||'').toLowerCase().indexOf(ql)>-1;
    var byPhone=phoneMatch(s.phone,q);
    var byConf=String(s.conf||'').toLowerCase()===ql;
    return byName||byPhone||byConf;
  }).sort(function(a,b){ return (a.checkIn||'')<(b.checkIn||'')?1:-1; });
  if(!hits.length){ el.innerHTML='<div class="muted" style="padding:6px 0">'+(GIDX?'no guest matches'+(isPhone?' — try fewer digits':''):'searching full history…')+'</div>'; return; }
  var lim=(window._gsAll===q)?hits.length:15;   // «show all» sticks to ITS query — a new search resets to 15
  el.innerHTML='<table style="margin-top:6px"><thead><tr><th style="text-align:left">Guest</th><th>Flat</th><th style="text-align:left">Stay</th><th>Portal</th><th style="text-align:left">Phone</th></tr></thead><tbody>'+
    hits.slice(0,lim).map(function(s){
      var st=/cancel/i.test(s.status||'')?'<span class="pill p-out">cancelled</span>'
            :(s.checkOut&&s.checkOut<=today?'<span class="pill p-gap">departed</span>'
            :(s.checkIn&&s.checkIn<=today?'<span class="pill p-in">in-house</span>':'<span class="pill p-stay">upcoming</span>'));
      var ph=String(s.phone||'');
      return '<tr><td style="text-align:left"><bdi>'+esc(s.guest||'—')+'</bdi> '+st+(s.conf?'<div class="soft" style="font-size:10px">'+esc(s.conf)+'</div>':'')+'</td>'+
        '<td>'+esc(s.flat)+'</td>'+
        '<td style="text-align:left" dir="ltr">'+(s.checkIn||'?')+' → '+(s.checkOut||'?')+' · '+(s.nights||0)+'n</td>'+
        '<td>'+esc(s.portal||'')+'</td>'+
        '<td style="text-align:left" dir="ltr">'+(ph?'<a href="https://wa.me/'+normPh(ph)+'" target="_blank">'+esc(ph)+'</a>':'—')+'</td></tr>';
    }).join('')+'</tbody></table>'+
    (hits.length>lim?'<div class="muted">showing '+lim+' of '+hits.length+' — <a href="#" onclick="window._gsAll=window._gsq.trim();guestSearch();return false">show all '+hits.length+'</a></div>':'');
}

function mLabel(ym){ return MON[+ym.slice(5,7)-1]; }
function kpi(l,v,s){ return '<div class="kpi"><div class="kl">'+l+'</div><div class="kv">'+v+'</div><div class="ks">'+s+'</div></div>'; }
function col(x){ return isFinite(x)?'<span class="'+cc(x)+'">'+pct(x)+'</span>':'—'; }
function cc(x){ return x>=1?'g':'r'; }
function deltaPts(a,b){ var d=Math.round((a-b)*100); return '<span class="'+(d>=0?'g':'r')+'">'+(d>=0?'+':'')+d+'</span>'; }

function happening(cm,asOf){
  var today=D.meta.asOf, rows=[];
  /* ONE ROW PER FLAT (Sarah 2026-10-13): a same-day turnover used to emit a separate out AND in row,
     but Flat / Next action / Code are identical on both, so the extra full row only confused. Now the
     turnover stacks its out+in as two sub-lines inside the single flat row (Event + Guest columns);
     the channel dot sits next to each guest so both guests show their own channel. */
  airbnbFlats().forEach(function(f){
    var cur=null, coToday=null;
    STAYS.forEach(function(s){ if(s.flat!==f)return;
      if(day(s.checkIn)<=asOf&&asOf<day(s.checkOut))cur=s;   // occupied tonight (incl. check-in today)
      if(s.checkOut===today)coToday=s; });
    var events=[];
    if(coToday) events.push({kind:'out', guest:coToday.guest, portals:coToday.portals});
    if(cur){ var inn=cur.checkIn===today; events.push({kind:inn?'in':'stay', guest:cur.guest, portals:cur.portals}); }
    if(events.length){
      var act = coToday ? nextAction(coToday,asOf,today,true,false)   // Flat/action/code are shared across a turnover
                        : nextAction(cur,asOf,today,false,cur.checkIn===today);
      rows.push({flat:f, events:events, action:act, code:doorCode(f,asOf)});
    } else if(!coToday){
      var n=nextCheckIn(f,asOf), action, code=doorCode(f,asOf);
      if(!n){ rows.push({flat:f, events:[{kind:'free',guest:'',portals:[]}], action:'No booking coming up', code:code}); }
      else {
        var inS=null; STAYS.forEach(function(s){ if(s.flat===f&&s.checkIn&&day(s.checkIn).getTime()===n.getTime())inS=s; });
        var portals=inS?inS.portals:[];   // guest stays blank — nobody has checked in yet
        // RULE: gap > 2 days between check-out and next check-in => revision clean the day before arrival
        var pco=prevCheckOut(f,n), gap=pco?Math.round((n-pco)/DAYMS):0, diff=Math.round((n-asOf)/DAYMS);
        var sched=nextSched(f,asOf);
        if(sched) action=sched.label;                 // confirmed clean/repair from Week wins
        else if(gap>2){ var rev=new Date(n); rev.setDate(rev.getDate()-1); action='Revision clean '+dmon(ymd(rev)); }
        else action='clean → new guest '+(diff<=0?'today':(diff===1?'tomorrow':dmon(ymd(n))));
        rows.push({flat:f, events:[{kind:'gap',guest:'',portals:portals}], action:action, code:code});
      }
    }
  });
  var h='<div class="card"><h3>Happening today</h3>';
  h+='<table><thead><tr><th>Flat</th><th style="text-align:left">Event</th><th style="text-align:left">Guest</th><th style="text-align:left">Next action</th><th>Code</th></tr></thead><tbody>';
  function pillFor(k){ return k==='out'?'<span class="pill p-out">out</span>':(k==='in'?'<span class="pill p-in">in</span>':(k==='gap'?'<span class="pill p-gap">vacant</span>':(k==='free'?'<span class="pill p-free">not booked</span>':'<span class="pill p-stay">in stay</span>'))); }
  rows.forEach(function(r){
    var isFree = r.events.length===1 && r.events[0].kind==='free';
    var evCell = r.events.map(function(e){ return '<div style="min-height:24px;display:flex;align-items:center">'+pillFor(e.kind)+'</div>'; }).join('');
    var gCell  = r.events.map(function(e){ return '<div style="min-height:24px;display:flex;align-items:center;gap:4px;white-space:nowrap">'+((e.portals&&e.portals.length)?e.portals.map(dotp).join(''):'')+esc(e.guest||'')+'</div>'; }).join('');
    h+='<tr'+(isFree?' class="rfree"':'')+'><td>'+r.flat+'</td><td style="text-align:left">'+evCell+'</td><td style="text-align:left">'+gCell+'</td><td dir="ltr" style="text-align:left" class="soft">'+r.action+'</td><td class="code">'+(r.code||'')+'</td></tr>';
  });
  h+='</tbody></table><div class="legend"><span class="dot" style="background:var(--ch-airbnb)"></span>Airbnb <span class="dot" style="background:var(--ch-booking)"></span>Booking <span class="dot" style="background:var(--ch-direct)"></span>Direct</div></div>';
  return h;
}
// THE IN-STAY CLEAN RULE (Sarah 2026-10-10): ≤9 nights none · 10–12 nights ONE mid-stay clean in the middle (day ⌊N/2⌋:
// 10→5, 11→5, 12→6) · >12 nights day 6 then every 7 days · never within 4 nights of checkout · a pinned weekday keeps weekly on
// that day (first at least 4 nights in). Same rule in week.html, today.html and the engine's comms ladder.
function cleanPlan(s){
  var N=s.nights||0; if(N<10||!s.checkIn) return [];
  var ci=day(s.checkIn), plan=[], j=0;
  if(N<=12){ var m=new Date(ci); m.setDate(m.getDate()+Math.floor(N/2)); return [{d:m,first:true}]; }   // 10–12 nights: one, in the middle
  for(var off=6; N-off>4; off+=7,j++){ var d=new Date(ci); d.setDate(d.getDate()+off); plan.push({d:d,first:j===0}); }
  return plan;
}
// NEXT ACTION mirrors الكنترول's CONFIRMED schedule (read-only from Supabase since Switch C) — cleans (D.cleans) + open repairs (D.repairs) —
// NOT an independent recalculation. Whatever you set/edit in Week is the source of truth shown here.
function cleanTypeLabel(t){ t=(t||'').toLowerCase(); return t==='checkout'?'Check-out clean':t==='midstay'?'Mid-stay clean':t==='weekly'?'Weekly clean':t==='revision'?'Revision clean':t==='codechange'?'Code change':'Clean'; }
function nextSched(flat,asOf){
  var best=null;
  (D.cleans||[]).forEach(function(c){ if(c.flat!==flat||!c.date)return; var d=day(c.date); if(d>=asOf&&(!best||d<best.d)) best={d:d,label:cleanTypeLabel(c.type)+' '+dmon(c.date)}; });
  (D.repairs||[]).forEach(function(r){ if(r.flat!==flat||r.status!=='open'||!r.date)return; var d=day(r.date); if(d>=asOf&&(!best||d<best.d)) best={d:d,label:'🔧 <bdi>'+esc(r.trade||'repair')+'</bdi> '+dmon(r.date)}; });
  return best;
}
function nextAction(s,asOf,today,out,inn){
  var sched=nextSched(s.flat,asOf);
  if(sched) return sched.label;                       // confirmed clean / open repair from the Week schedule
  if(out){ var n=nextCheckIn(s.flat,asOf); if(n){ var diff=Math.round((n-asOf)/DAYMS); return 'clean → new guest '+(diff<=0?'tonight':(diff===1?'tomorrow':dmon(ymd(n)))); } return 'clean'; }
  if(inn) return 'in · out '+dmon(s.checkOut);
  return 'check-out '+dmon(s.checkOut);
}
function dotp(portal){ var p=(portal||'').toLowerCase(); var c=p.indexOf('airbnb')>-1?'--ch-airbnb':(p.indexOf('book')>-1?'--ch-booking':'--ch-direct'); return '<span class="dot" style="background:var('+c+')"></span>'; }

function isDirect(portal){ return (portal||'').toLowerCase().indexOf('direct')>-1; }
/* direct bookings the Smoobu sync brought in without a payment method yet (§14).
   Flag a direct booking with no route when it was booked recently OR is current/upcoming —
   this targets fresh arrivals & live bookings, never nags about old completed history. */
function directNeedsPay(){
  var asOf=day(D.meta.asOf), cutoff=new Date(asOf); cutoff.setDate(cutoff.getDate()-30);
  return rawStays().filter(function(s){   // PAYMENT per booking → rawStays()
    if(!isDirect(s.portal)||!isLive(s)||s.payRoute||!s.checkOut) return false;
    var recentlyBooked=s.booked&&day(s.booked)>=cutoff, currentOrFuture=day(s.checkOut)>=asOf;
    return recentlyBooked||currentOrFuture;
  }).sort(function(a,b){ return a.checkIn<b.checkIn?-1:1; });
}

/* ---- other revenue that would otherwise be lost (Sarah 2026-08-06) -----------------------------
   Two things Smoobu can tell us happened but not how much they were worth, so the Hub asks rather
   than guesses. Answered here, they go straight into the ledger — nothing is typed into a sheet.
     • an OTA booking cancelled  → "how much was kept?" (Smoobu never carries the payout decision)
     • a price element with no type → a manual extra the host added; the amount can be stale after a
       booking change, and it may belong to a DIFFERENT flat — Ehab's $40 was $20 for 8A and $20
       for 28A — so both are confirmed, never auto-written.
   A DIRECT cancellation raises nothing: those are data-entry corrections, not cancellations. */
/* ONE ROW, ONE KEY (Sarah 2026-08-12). The key used to be the confirmation code — but one booking
   moved between flats produces TWO cancellation alerts sharing that code, so both rows got the
   same element ids: the second row's Save read the first row's input and wrote to the first row's
   message. The STAY id is unique per row; the index is the last-resort tie-break. */
function orevKey(a,i){ return String(a.stayId||a.conf||a.smoobuId||('n'+i)).replace(/[^A-Za-z0-9_-]/g,'')+'_'+i; }
function orevRow(a,kind,i){
  var id=esc(orevKey(a,i)), pre='or_'+kind+'_'+id;
  var flats=((D.meta&&D.meta.flatsOrder)||[]).map(function(f){
    return '<option'+(f===a.flat?' selected':'')+'>'+esc(f)+'</option>'; }).join('');
  var head = kind==='canc'
    ? '<b>❓ '+esc(a.flat)+' — '+esc(a.guest||'guest')+' cancelled.</b> '+dmon(a.checkIn)+' → '+dmon(a.checkOut)+
      ', '+a.nights+' night'+(a.nights===1?'':'s')+'. How much did we keep?'
    : '<b>➕ '+esc(a.flat)+' — '+esc(a.guest||'guest')+' was charged an extra.</b> "'+esc(a.name)+'"'+
      (a.qty>1?' ×'+a.qty:'')+' — Smoobu says $'+fmt(a.amount)+'. Confirm the amount actually received.';
  return '<div class="need n-warn" id="'+pre+'"><span class="nb">$</span><span>'+head+
    '<div class="payctl">'+
      '<input id="'+pre+'_amt" style="width:74px" value="'+(kind==='canc'?'':a.amount)+'" placeholder="USD">'+
      (kind==='extra'?'<select id="'+pre+'_flat">'+flats+'</select>':'')+
      '<button class="paybtn" onclick="orevAnswer(\''+kind+'\',\''+id+'\')">Save</button>'+
      '<span class="paymsg" id="'+pre+'_msg"></span>'+
    '</div>'+
    '<div class="soft" style="font-size:10.5px;margin-top:2px">'+
      (kind==='canc'?'Spread across the nights the booking would have used, the way you do it — enter the total kept.'
                    :'Goes in whole, in the month it was earned. If it came through Stripe, enter what landed (net of 3.65%).')+
    '</div></span></div>';
}
function orevAnswer(kind,id){
  var pre='or_'+kind+'_'+id, msg=document.getElementById(pre+'_msg');
  var list=((ALERTS&&ALERTS.revAlerts)||{})[kind==='canc'?'cancellations':'extras']||[];
  /* Match by the SAME key the row was rendered with (2026-09-07: this compared the raw conf
     against the sanitized key + index suffix — never equal, so every Save died as "not found"). */
  var a=null; list.forEach(function(x,i){ if(!a&&orevKey(x,i)===id) a=x; });
  if(!a){ if(msg)msg.textContent='this alert was refreshed away — reload the page and try again'; return; }
  var amt=(document.getElementById(pre+'_amt')||{}).value||'';
  amt=String(amt).replace(/,/g,'').trim();
  // 0 IS A VALID ANSWER — "cancelled, we kept nothing" (Sarah 2026-08-11, Amber). Only a blank
  // or a non-number is rejected; the zero row is the trace that clears the alert honestly.
  if(amt===''||isNaN(+amt)||+amt<0){ if(msg)msg.textContent='enter an amount (0 if nothing was kept)'; return; }
  var flatEl=document.getElementById(pre+'_flat');
  var p={ flat:(flatEl?flatEl.value:a.flat), amount:amt, guest:a.guest||'', conf:a.conf||'',
          stayId:a.stayId||'', user:(ME&&ME.user)||'' };
  if(kind==='canc'){ p.cat='cancellation fee'; p.split='1'; p.month=(a.checkOut||'').slice(0,7); p.date=a.checkOut||''; }
  else { p.cat='extra service'; p.month=(a.checkIn||'').slice(0,7); p.date=a.checkIn||''; p.note=a.name||''; }
  /* The button locks and the row dims WHILE it saves — the sheet round-trip is a couple of
     seconds and the screen used to look frozen. Nothing is claimed until the server answers
     (save-then-say-so): a failure restores the row and names the reason, so a silent loss is
     impossible. (Sarah 2026-08-11: "writing in Needs-you takes a lot of time".) */
  var row=document.getElementById(pre);
  var btn=row?row.querySelector('.paybtn'):null;
  if(btn){ btn.disabled=true; btn.textContent='saving…'; }
  if(row) row.style.opacity=.5;
  if(msg)msg.textContent='';
  api('props_other_rev_save',p).then(function(j){
    if(!j||!j.ok) throw new Error(j&&j.error||'failed');
    if(msg)msg.textContent=(+amt===0?'recorded as kept nothing':(j.action||'saved'))+' ✓';
    if(btn){ btn.textContent='saved'; }
    if(row) row.style.opacity=.45;
  }).catch(function(e){
    if(row) row.style.opacity=1;
    if(btn){ btn.disabled=false; btn.textContent='Save'; }
    if(msg)msg.textContent='failed: '+(e.message||e);
  });
}

/* Owner accounts — the partner flats' STANDING balances, on the front page (Sarah 2026-09-03:
   "these balances have to display on the hub"). One row per partner flat, taken from the latest
   month the waterfall has computed: what she owes / we hold, the float, and payouts not yet made.
   Hidden entirely while every figure is zero — a card of zeros is noise. */
function ownerCard(){
  var rowsH='';
  Object.keys(D.pnl||{}).forEach(function(f){
    var byM=D.pnl[f]||{}, latest=null, pl=null;
    Object.keys(byM).forEach(function(m){ if(byM[m]&&byM[m].partnerLedger&&(!latest||m>latest)){ latest=m; pl=byM[m].partnerLedger; } });
    if(!pl) return;
    if(Math.abs(pl.balanceAfter)<0.005&&pl.floatAfter<0.005&&pl.outstanding<0.005&&!pl.payable) return;
    var bits=[];
    if(pl.balanceAfter<-0.005) bits.push('owes us <b>$'+fmt(-pl.balanceAfter)+'</b>');
    else if(pl.balanceAfter>0.005) bits.push('we hold <b>$'+fmt(pl.balanceAfter)+'</b> of her funds');
    bits.push('float $'+fmt(pl.floatAfter)+' / '+fmt(pl.floatTarget));
    if(pl.outstanding>0.005) bits.push('<span style="color:var(--red,#cc5f5f);font-weight:700">unpaid payouts $'+fmt(pl.outstanding)+'</span>');
    else if(pl.payable>0.005) bits.push('payable $'+fmt(pl.payable));
    rowsH+='<div style="padding:4px 0;font-size:12.5px"><b>'+esc(f)+'</b> · '+latest+' — '+bits.join(' · ')+'</div>';
  });
  if(!rowsH) return '';
  return '<div class="card"><h3>Owner accounts<span class="rt"><a class="tab" href="close.html">statements →</a></span></h3>'+rowsH+
    '<div class="legend">The Clause-7 waterfall, standing as of the latest computed month: prepayments and month results move the balance, the float fills to its target before anything is paid, and unpaid payouts stay red until the payout is recorded in WeShare.</div></div>';
}
function needs(cm,pmY){
  var items=[];
  // ⏰ recurring cards on/past their due day, still pending in WeShare (written by the 9h watch)
  (D.meta.recurDue||[]).forEach(function(r){
    items.push({t:'warn',txt:'<b>⏰ '+esc(r.desc)+'</b> — '+fmt(r.amt)+' EGP due'+(r.overdue?' since '+esc(r.date):' today')+', still pending in WeShare.'});
  });
  if(!D.meta.fx.isCurrentMonthSet) items.push({t:'warn',txt:'<b>FX not set for '+D.meta.currentMonth+'</b> — carrying '+(D.meta.fx.current||'?')+' from last close.'});
  var anyOpen=false; airbnbFlats().forEach(function(f){ var r=(D.pnl[f]||{})[pmY]; if(r&&r.status&&r.status!=='final')anyOpen=true; });
  if(anyOpen) items.push({t:'info',txt:'<b>'+pmY+' not closed</b> — review &amp; mark final on the close screen.'});
  var pays=directNeedsPay();   // internet dangers + the Thursday confirm live on الكنترول's «مطلوب منكم» card (Switch C, 2026-10-03)
  // an owner payout the statements say is due but no 🏦 entry has settled — Clause 7.2's 7th-of-month wire
  Object.keys(D.pnl||{}).forEach(function(fO){ var byMO=D.pnl[fO]||{}, plO=null, lO=null;
    Object.keys(byMO).forEach(function(mO){ if(byMO[mO]&&byMO[mO].partnerLedger&&(!lO||mO>lO)){ lO=mO; plO=byMO[mO].partnerLedger; } });
    if(plO&&plO.outstanding>0.005) items.unshift({t:'warn',txt:'<b>'+esc(fO)+' — owner payout $'+fmt(plO.outstanding)+' due</b> (settlement by the 7th). Wire it, then log it as 🏦 Owner payout in WeShare.'});
  });
  if(ALERTS && ALERTS.pendingCount>0) items.unshift({t:'warn',txt:'<b>'+ALERTS.pendingCount+' expense'+(ALERTS.pendingCount>1?'s':'')+' awaiting confirmation</b> in WeShare — confirm who paid and they flow to the P&amp;L.'});
  /* §5.2d — a big bill touching closed months is a DECISION, not a sync step. Both choices spelled
     out with their numbers so it can be taken from here without opening the sheet first. */
  if(ALERTS && ALERTS.elecDecisions && ALERTS.elecDecisions.length) ALERTS.elecDecisions.forEach(function(d){
    var diff=Math.round(Math.abs(d.trueUp)), over=d.trueUp<0;
    items.unshift({t:'warn',txt:'<b>⚡ '+esc(d.flat)+' — electricity bill needs a decision.</b> '+
      Math.round(d.amount).toLocaleString()+' EGP arrived covering '+d.covers.replace('..',' → ')+' ('+d.span+' months, '+
      Math.round(d.perMonth).toLocaleString()+'/mo); '+d.closedMonths.length+' closed month'+(d.closedMonths.length>1?'s':'')+' accrued '+
      Math.round(d.accrued).toLocaleString()+', so you '+(over?'over':'under')+'-accrued by <b>'+diff.toLocaleString()+'</b>.<br>'+
      'In the sheet: <b>Electricity — apply new bills</b> puts the whole difference in '+esc(d.postTo||'the current month')+
      ', or <b>Electricity — restate one bill</b> spreads it over '+d.covers.replace('..',' → ')+' only (closed months get marked).'+
      (d.key?dismissBtn([d.key]):'')});
  });
  /* ⚡ 8A card depletion (§7 ①): fires when the projection says the card dies before the next
     check-out or within 7 days. Sarah gets it because she pays the recharges. */
  if(ALERTS && ALERTS.meter8a && ALERTS.meter8a.alert){
    var m8=ALERTS.meter8a;
    /* The alert always shows its evidence now (reading + date + rate), and when the newest
       interval runs far hotter than the earlier ones it asks a question instead of asserting a
       depletion date — the usual cause is a misread digit or a recharge that never reached
       WeShare, not a genuinely empty card (Sarah 2026-08-11). */
    var ev='<span class="soft" style="font-size:10.5px"> — from '+fmt(m8.balance)+' EGP read on '+esc(m8.lastReadAt||'?')+
           ' ('+m8.readAgoDays+'d ago), '+fmt(m8.ratePerDay)+'/day over '+(m8.intervals||0)+' interval'+((m8.intervals||0)===1?'':'s')+'</span>';
    if(m8.belowFloor){
      items.unshift({t:'warn',txt:'<b>🔴 8A card is below '+fmt(m8.floor||400)+' EGP</b> — '+fmt(m8.balance)+
        ' left as of '+esc(m8.lastReadAt||'?')+'. It needs the pre-charged card in the meter now.'+
        (m8.depletion?' Estimated empty ~<b>'+esc(m8.depletion)+'</b>.':'')+ev});
    } else if(m8.suspect){
      items.unshift({t:'warn',txt:'<b>⚡ 8A card — the numbers don\'t add up.</b> The last stretch burned ~'+fmt(m8.lastIntervalRate)+
        '/day against ~'+fmt(m8.priorRate)+'/day before it, which would empty the card ~<b>'+esc(m8.depletion)+'</b>. '+
        'Before treating that as real: check the last reading ('+fmt(m8.balance)+' on '+esc(m8.lastReadAt||'?')+') and whether a recharge was paid but never logged in WeShare. '+
        'Ask Emad for a fresh reading.'+ev});
    } else {
      items.unshift({t:'warn',txt:'<b>⚡ 8A prepaid card is running out.</b> ~'+fmt(m8.projectedBalance)+' EGP left, burning ~'+
        fmt(m8.ratePerDay)+'/day → empty ~<b>'+esc(m8.depletion)+'</b>'+
        (m8.nextCheckout&&m8.depletion<=m8.nextCheckout?' — <b>before the next check-out ('+esc(m8.nextCheckout)+')</b>. Recharge and log it in WeShare as usual.':'. Recharge soon.')+
        ev});
    }
  }
  /* 8A closed-month mismatch alert RETIRED (2026-08-01): the recharge reader auto-corrects open
     months before they close, so new mismatches cannot form. Sheet menu → "Electricity — sync 8A
     recharges" keeps the historical report. */
  var RA=(ALERTS&&ALERTS.revAlerts)||{}, cancs=RA.cancellations||[], extras=RA.extras||[];
  var vrbos=vrboPending(), vrboAsk=(((ALERTS&&ALERTS.revAlerts)||{}).vrboAwaiting||[]).filter(function(a){ return a.ask; });
  if(!items.length&&!pays.length&&!vrbos.length&&!vrboAsk.length&&!cancs.length&&!extras.length) items.push({t:'ok',txt:'Nothing needs you right now.'});
  var h='<div class="card"><h3>Needs you<button id="syncAllBtn" onclick="syncAll()" style="float:right;font:inherit;font-size:11px;font-weight:700;border:1px solid var(--line,#ecdede);background:#fff;color:var(--red,#cc5f5f);border-radius:8px;padding:3px 9px;cursor:pointer">🔄 Sync all</button></h3>';
  vrbos.forEach(function(s){ h+=vrboRow(s); });   // 📩 VRBO requests waiting for their payout (v234)
  vrboAsk.forEach(function(a){ h+=vrboActualRow(a); });   // 🏦 VRBO payouts still an estimate after check-in (v235)
  pays.forEach(function(s){ h+=payRow(s); });
  /* 💳 bookings flagged Stripe whose payment could not be matched — one notification each, answered here */
  ((ALERTS&&ALERTS.stripeAwaiting)||[]).forEach(function(a){ h+=stripeRow(a); });
  /* money that exists but has no amount recorded yet — put it above the informational lines,
     because unlike those it is lost entirely if it is never answered */
  cancs.forEach(function(a,i){ h+=orevRow(a,'canc',i); });
  extras.forEach(function(a,i){ h+=orevRow(a,'extra',i); });
  items.forEach(function(i){ h+='<div class="need n-'+i.t+'"><span class="nb">'+(i.t==='warn'?'!':(i.t==='ok'?'✓':'•'))+'</span><span>'+i.txt+'</span></div>'; });
  return h+'</div>';
}
function payMethod(id){
  var m=document.getElementById('pm_'+id).value, c=document.getElementById('pc_'+id);
  if(m==='Instapay'){ c.value='EGP'; c.disabled=true; }
  else if(m==='Stripe'){ c.value='USD'; c.disabled=true; }
  else if(m==='No charge'){ c.value='USD'; c.disabled=true; }   // a free night (Christina 16 Dec, 2026-10-15) — no money, no currency
  else c.disabled=false;                           // Cash: either currency
}
function savePay(id){
  var m=document.getElementById('pm_'+id).value, c=document.getElementById('pc_'+id).value, msg=document.getElementById('pmsg_'+id);
  var pd=document.getElementById('pd_'+id), paidOn=pd?pd.value:'';
  msg.textContent='saving…';
  api('props_set_pay',{id:id,method:m,currency:c,paidOn:paidOn}).then(function(j){
    if(!j||!j.ok)throw new Error(j&&j.error||'bad');
    var st=j.result&&j.result.stripe, rs=j.result&&j.result.resolved;   // st = the estimate; rs = Stripe looked up RIGHT NOW
    var said='';
    if(rs&&rs.state==='matched') said='saved · Stripe receipt recorded: fee '+Number(rs.fee).toFixed(2)+(rs.credit?' (credited back)':'')+' → you receive '+Number(rs.receipt).toFixed(2);
    else if(rs&&rs.state==='closed') said='saved · payment found (receives '+Number(rs.receipt).toFixed(2)+') but the stay touches a closed month — see the notification';
    else if(rs&&(rs.state==='none'||rs.state==='ambiguous')) said='saved · payment not found in Stripe yet — I will keep looking; tell me which one in the notification below';
    else if(rs&&rs.state==='error') said='saved · Stripe lookup failed ('+rs.error+')'+(st&&st.estimate?' · fee '+st.fee.toFixed(2)+' estimated':'');
    else if(rs&&rs.state==='nokey') said=st&&st.estimate?'saved · Stripe fee '+st.fee.toFixed(2)+' estimated (no Stripe key set yet)':'saved';
    else if(st&&st.estimate) said='saved · Stripe fee '+st.fee.toFixed(2)+' estimated (real receipt to follow)';
    else if(st&&st.skipped) said='saved · fee not applied: '+st.skipped;
    if(said) msg.textContent=said;
    setTimeout(boot, said?2200:0);   // reload — the item drops off once the route is set
  }).catch(function(e){ msg.textContent='failed: '+(e.message||e); });
}
/* 💳 "Paid ✓" — one line per booking flagged Stripe that matters now (still awaiting, or checking out
   within the last 3 days / later). It only REPORTS what the Stripe lookup already wrote down; the
   notification above (stripeRow) is where a missing payment is answered. */
/* 🛠 BOOKING ADJUSTMENTS (v244, Sarah 2026-10-14 — Christina: VRBO could not move her check-in, so VRBO says 9→16 while
   she really stays 10→17). Pick an upcoming booking: set its REAL dates (the schedule, Dani's ladder, door codes and the
   revenue follow them; Smoobu never overwrites them), and for a VRBO booking re-enter VRBO's numbers after a change. */
var ADJ_SEL='';
function adjustCard(){
  var asOf=D.meta.asOf, list=rawStays().filter(function(s){ var st=String(s.status||'').toLowerCase();
    return st.indexOf('cancel')<0&&st.indexOf('block')<0&&s.checkOut&&s.checkOut>=asOf; })
    .sort(function(a,b){ return a.checkIn<b.checkIn?-1:1; });
  if(!list.length) return '';
  var h='<div class="card"><h3>🛠 Booking adjustments</h3><select id="adjSel" onchange="ADJ_SEL=this.value;render()" style="width:100%;font:inherit;font-size:12.5px;padding:5px;border:1px solid var(--line);border-radius:8px">'+
    '<option value="">— pick a booking —</option>'+list.map(function(s){ return '<option value="'+esc(s.id)+'"'+(s.id===ADJ_SEL?' selected':'')+'>'+esc(s.flat)+' · '+esc(s.guest||'')+' · '+dmon(s.checkIn)+' → '+dmon(s.checkOut)+' · '+esc(s.portal)+(s.realDates?' · 📅 real dates':'')+'</option>'; }).join('')+'</select>';
  var s=list.filter(function(x){ return x.id===ADJ_SEL; })[0];
  if(s){ var id=esc(s.id), inp='style="font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 5px"';
    h+='<div style="margin-top:10px"><b>📅 Real dates</b> <span class="paymsg">— when the guest really arrives/leaves on other days than the channel says. Schedule, Dani\'s ladder, codes and revenue follow these; Smoobu never overwrites them.</span>'+
      (s.realDates?'<div class="paymsg" style="margin-top:3px">now: '+esc(s.realDates)+'</div>':'')+
      '<div class="payctl"><label class="paymsg">in <input type="date" id="rdi_'+id+'" value="'+esc(s.checkIn)+'" '+inp+'></label>'+
      '<label class="paymsg">out <input type="date" id="rdo_'+id+'" value="'+esc(s.checkOut)+'" '+inp+'></label>'+
      '<label class="paymsg">why <input id="rdw_'+id+'" placeholder="e.g. VRBO could not move the check-in" style="width:190px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 5px"></label>'+
      '<button class="paybtn" onclick="saveRealDates(\''+id+'\')">Save</button>'+(s.realDates?'<button class="paybtn" style="background:#fff;color:var(--red);border:1px solid var(--line)" onclick="saveRealDates(\''+id+'\',true)">Back to channel dates</button>':'')+
      '<span class="paymsg" id="rdm_'+id+'"></span></div></div>';
    if(s.portal==='Vrbo') h+='<div style="margin-top:10px"><b>💲 VRBO numbers</b> <span class="paymsg">— after a change on VRBO, copy the new figures from «View full payment details».</span>'+
      '<div class="payctl"><label class="paymsg">total traveler payment $ <input type="number" step="0.01" id="vt_'+id+'" '+inp+'></label>'+
      '<label class="paymsg">booking amount $ <input type="number" step="0.01" id="vn_'+id+'" '+inp+'></label>'+
      '<label class="paymsg">estimated payout $ <input type="number" step="0.01" id="vp_'+id+'" '+inp+'></label>'+
      '<label class="paymsg">adults <input type="number" min="1" step="1" id="va_'+id+'" value="'+(s.guests||'')+'" style="width:46px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 5px"></label>'+
      '<label class="paymsg">children <input type="number" min="0" step="1" value="0" id="vc_'+id+'" style="width:46px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 5px"></label>'+
      '<button class="paybtn" onclick="saveVrbo(\''+id+'\')">Save</button><span class="paymsg" id="vmsg_'+id+'"></span></div></div>';
  }
  return h+'</div>';
}
function saveRealDates(id,clear){
  var msg=document.getElementById('rdm_'+id), ci=document.getElementById('rdi_'+id).value, co=document.getElementById('rdo_'+id).value, why=document.getElementById('rdw_'+id).value;
  if(!clear&&!(ci&&co&&co>ci)){ msg.textContent='check-out must be after check-in'; return; }
  msg.textContent='saving…';
  api('props_set_real_dates',clear?{id:id,clear:1}:{id:id,ci:ci,co:co,reason:why}).then(function(j){
    if(!j||!j.ok)throw new Error(j&&j.error||'bad');
    msg.textContent=clear?'back to the channel\'s dates (restored on the next sync)':'saved · real stay '+dmon(j.result.ci)+' → '+dmon(j.result.co)+' — الكنترول follows within ~10 min';
    setTimeout(boot,2200);
  }).catch(function(e){ msg.textContent='failed: '+(e.message||e); });
}
function stripeCard(){
  var rows=(ALERTS&&ALERTS.stripeStatus)||[]; if(!rows.length) return '';
  var ok=rows.filter(function(r){ return r.state==='paid'||r.state==='nofee'; }).length;
  var h='<div class="card"><h3>Stripe payments<span class="rt">'+ok+' of '+rows.length+' confirmed</span></h3>';
  rows.forEach(function(r){
    var pill, sub='', id=esc(r.id);
    if(r.state==='paid'){ pill='<span class="pill p-in">Paid ✓ $'+fmt(r.net)+'</span>'; sub='fee '+fmt(r.fee)+(r.paidOn?' · paid '+dmon(r.paidOn):''); }
    else if(r.state==='nofee'){ pill='<span class="pill p-in">Paid ✓</span>'; sub='before 15 Jun — no fee'; }
    else if(r.state==='awaiting'){ pill='<span class="pill p-out">No payment found</span>'; sub='answer it in Needs you above'; }
    else if(r.state==='estimate'){ pill='<span class="pill p-gap">≈ $'+fmt(r.net)+' estimate</span>'; sub='real receipt not found yet'; }
    else { pill='<span class="pill p-stay">Not checked yet</span>'; }
    var chk=(r.state==='paid'||r.state==='nofee')?'':(sub?' · ':'')+'<a href="#" onclick="stripeCheckRow(\''+id+'\');return false">check now</a><span class="paymsg" id="scm_'+id+'"></span>';
    h+='<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px">'+
       '<span><b>'+esc(r.flat)+'</b> · <bdi>'+esc(r.guest||'')+'</bdi><div class="soft" style="font-size:10.5px">'+dmon(r.ci)+' → '+dmon(r.co)+' · $'+fmt(r.gross)+'</div></span>'+
       '<span style="text-align:right">'+pill+'<div class="soft" style="font-size:10.5px">'+sub+chk+'</div></span></div>';
  });
  return h+'</div>';
}
function stripeCheckRow(id){
  var m=document.getElementById('scm_'+id); if(m) m.textContent=' checking…';
  api('props_stripe_check',{id:id}).then(function(j){
    if(!j||!j.ok) throw new Error(j&&j.error||'bad');
    var r=j.result||{}; if(m) m.textContent=r.state==='matched'?' ✓ found':(r.state==='nokey'?' no Stripe key':' not found yet');
    setTimeout(boot,1200);
  }).catch(function(e){ if(m) m.textContent=' failed: '+(e.message||e); });
}
function stripeRow(a){
  var id=esc(a.id), opts='<option value="">pick the payment…</option>'+(a.cands||[]).map(function(c){
    var net=(c.amount||0)-(c.refunded||0);
    return '<option value="'+esc(c.id)+'">'+(c.exact?'★ ':'')+'$'+fmt(net)+' · '+esc(c.date)+' · '+esc(c.name||c.email||c.id)+(c.fee?' · fee '+fmt(c.fee):'')+'</option>'; }).join('');
  var inp='font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;background:var(--white)';
  return '<div class="need n-warn" id="st_'+id+'"><span class="nb">💳</span><span>'+
    '<b>Stripe payment not found</b> — '+esc(a.flat)+' · '+esc(a.guest||'')+' · '+dmon(a.ci)+' → '+dmon(a.co)+' ($'+fmt(a.amount)+')'+
    '<div class="muted" style="margin-top:2px">'+esc(a.note||'')+'</div>'+
    '<div class="payctl"><select id="stc_'+id+'" style="'+inp+'">'+opts+'</select>'+
      '<input id="sti_'+id+'" placeholder="or paste ch_… / pi_…" style="width:150px;'+inp+'">'+
      '<button class="paybtn" onclick="stripeLink(\''+id+'\')">Link</button>'+
      '<button class="paybtn" style="background:#6b5b5b" onclick="stripeCheck(\''+id+'\')">Check again</button>'+
      '<span class="paymsg" id="stmsg_'+id+'"></span></div></span></div>';
}
function stripeAnswer(id,j){
  var msg=document.getElementById('stmsg_'+id), r=j&&j.result||{};
  if(!j||!j.ok) throw new Error(j&&j.error||'bad');
  if(r.state==='matched'){ msg.textContent='linked ✓ fee '+Number(r.fee).toFixed(2)+' → you receive '+Number(r.receipt).toFixed(2); setTimeout(boot,1500); }
  else if(r.state==='closed'){ msg.textContent='found (receives '+Number(r.receipt).toFixed(2)+'), but it touches a closed month ('+(r.closed||[]).join(', ')+') — approve it from the sheet menu: Stripe → sync receipts'; }
  else if(r.state==='error') msg.textContent=r.error||'failed';
  else if(r.state==='nokey') msg.textContent='no Stripe key is set';
  else msg.textContent='still not found in Stripe';
}
function stripeLink(id){
  var sel=document.getElementById('stc_'+id), inp=document.getElementById('sti_'+id), msg=document.getElementById('stmsg_'+id);
  var ref=(inp.value||'').trim()||sel.value;
  if(!ref){ msg.textContent='pick a payment, or paste its id'; return; }
  msg.textContent='linking…';
  api('props_stripe_link',{id:id,ref:ref}).then(function(j){ stripeAnswer(id,j); }).catch(function(e){ msg.textContent='failed: '+(e.message||e); });
}
function stripeCheck(id){
  var msg=document.getElementById('stmsg_'+id); msg.textContent='checking Stripe…';
  api('props_stripe_check',{id:id}).then(function(j){ stripeAnswer(id,j); }).catch(function(e){ msg.textContent='failed: '+(e.message||e); });
}
function esc(s){return (s||'').toString().replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}

AUTH_ON_LOGIN = boot; if (authGuard()) boot();   // signed in → load now; otherwise the sign-in form loads it
</script>
